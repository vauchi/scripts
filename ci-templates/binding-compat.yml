# Binding Compatibility Check Template
#
# Decides whether an automated vauchi-platform-swift bump is safe to open as
# a normal MR, or must be a Draft because the consumer will not compile
# against the new binding.
#
# Extracted from ios/.gitlab-ci.yml on 2026-08-20. iOS carried this inline
# with two blind spots and macOS had no check at all, so one widened enum
# case (`scheduleWakeup` gaining a fourth associated value in 0.63.0) opened
# green bump MRs in both repos that then failed to build — ios!643 and
# macos!359. Sharing it keeps the two from drifting apart again.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/binding-compat.yml'
#   # then, inside a bump job's script:
#   - !reference [.binding-compat-check, script]
#
# Expects (from the calling job):
#   OLD_VERSION, BINDINGS_VERSION  — the versions being compared
#   CONSUMER_DIRS                  — source dirs to grep (default "Vauchi/")
#
# Sets, for the caller to use when creating the MR:
#   MARK_DRAFT       — "true" when the consumer needs changes first
#   REMOVED_WARNING  — markdown describing what will not compile

.binding-compat-check:
  variables:
    CONSUMER_DIRS: "Vauchi/"
  script:
    - |
      # --- Removed-symbol check (advisory) ---
      # Compare old and new binding source to detect removed functions.
      # If consumer code still references removed symbols, mark MR as Draft.
      REMOVED_WARNING=""
      MARK_DRAFT=false
      PLATFORM_REPO="https://gitlab.com/vauchi/vauchi-platform-swift.git"
      # Both public surfaces the consumer compiles against. CoreUIModels was
      # missing until 2026-08-19, when a widened `scheduleWakeup` enum case
      # shipped a bump MR that could not compile: the check never fetched the
      # file the change was in.
      BINDING_PATHS="Sources/VauchiPlatform/vauchi_platform.swift Sources/CoreUIModels/Models.swift"

      if [ -n "$OLD_VERSION" ] && [ "$OLD_VERSION" != "$BINDINGS_VERSION" ]; then
        echo "Checking for removed symbols between $OLD_VERSION and $BINDINGS_VERSION..."
        # Use mktemp -d so each run gets its own dir. A shared fixed path like
        # /tmp/binding-check persists across jobs on the gitlab-runner host and
        # can end up owned by a different user, causing EACCES on write.
        BINDING_CHECK_DIR=$(mktemp -d -t binding-check.XXXXXX)
        OLD_BINDING="$BINDING_CHECK_DIR/old.swift"
        NEW_BINDING="$BINDING_CHECK_DIR/new.swift"

        # Fetch binding files from both versions (shallow, single-file)
        # --retry handles transient 5xx / dependency-proxy HTML-404 on the
        # GitLab raw endpoint. --max-time bounds each attempt so a hung
        # TLS handshake doesn't burn the whole job timeout silently.
        CURL_FETCH="curl -sf --retry 3 --retry-max-time 60 --max-time 30"
        for BINDING_PATH in $BINDING_PATHS; do
          $CURL_FETCH "${PLATFORM_REPO%.git}/-/raw/v${OLD_VERSION}/${BINDING_PATH}" >> "$OLD_BINDING" 2>/dev/null || \
            $CURL_FETCH "${PLATFORM_REPO%.git}/-/raw/${OLD_VERSION}/${BINDING_PATH}" >> "$OLD_BINDING" 2>/dev/null || true
          $CURL_FETCH "${PLATFORM_REPO%.git}/-/raw/v${BINDINGS_VERSION}/${BINDING_PATH}" >> "$NEW_BINDING" 2>/dev/null || \
            $CURL_FETCH "${PLATFORM_REPO%.git}/-/raw/${BINDINGS_VERSION}/${BINDING_PATH}" >> "$NEW_BINDING" 2>/dev/null || true
        done

        if [ -s "$OLD_BINDING" ] && [ -s "$NEW_BINDING" ]; then
          # Extract public func/var names from each version
          grep -oE '(open |public )?func [a-zA-Z_][a-zA-Z0-9_]*' "$OLD_BINDING" | sed 's/.* //' | sort -u > "$BINDING_CHECK_DIR/old_funcs"
          grep -oE '(open |public )?func [a-zA-Z_][a-zA-Z0-9_]*' "$NEW_BINDING" | sed 's/.* //' | sort -u > "$BINDING_CHECK_DIR/new_funcs"

          # Find functions removed in the new version
          REMOVED_FUNCS=$(comm -23 "$BINDING_CHECK_DIR/old_funcs" "$BINDING_CHECK_DIR/new_funcs")

          # Enum cases whose parameter list changed. A widened case removes no
          # function, so the removed-symbol pass above cannot see it, yet a
          # consumer destructuring the old arity fails to compile — which is
          # exactly what shipped on 2026-08-19 and turned both this MR and its
          # companion red, each holding one half of the change.
          # Flatten first: a case declared across several lines is invisible to
          # a line-oriented grep, and `scheduleWakeup` is exactly that in
          # 0.63.0 — the first version of this check found nothing for that
          # reason. Verified against v0.62.0 and v0.63.0, where it reports
          # `scheduleWakeup` and nothing else.
          tr '\n' ' ' < "$OLD_BINDING" | sed 's/  */ /g' \
            | grep -oE 'case [a-zA-Z_][a-zA-Z0-9_]*\([^)]*\)' | sed 's/  */ /g' \
            | sort -u > "$BINDING_CHECK_DIR/old_cases"
          tr '\n' ' ' < "$NEW_BINDING" | sed 's/  */ /g' \
            | grep -oE 'case [a-zA-Z_][a-zA-Z0-9_]*\([^)]*\)' | sed 's/  */ /g' \
            | sort -u > "$BINDING_CHECK_DIR/new_cases"
          CHANGED_CASES=""
          while IFS= read -r old_case; do
            [ -z "$old_case" ] && continue
            case_name=$(echo "$old_case" | sed 's/^case \([a-zA-Z0-9_]*\).*/\1/')
            # Unchanged if the identical signature survives.
            grep -qxF "$old_case" "$BINDING_CHECK_DIR/new_cases" && continue
            # Gone entirely is a removal, not a signature change.
            grep -q "^case ${case_name}(" "$BINDING_CHECK_DIR/new_cases" || continue
            if grep -rq "\.${case_name}(" ${CONSUMER_DIRS} 2>/dev/null; then
              CHANGED_CASES="${CHANGED_CASES}- \`${case_name}\` — signature changed and still destructured in consumer code\n"
              echo "  CHANGED CASE: $case_name"
            fi
          done < "$BINDING_CHECK_DIR/old_cases"

          if [ -n "$CHANGED_CASES" ]; then
            MARK_DRAFT=true
            REMOVED_WARNING="${REMOVED_WARNING}\\n\\n⚠️ **Enum cases whose signature changed:**\\n${CHANGED_CASES}\\nThis bump cannot compile until the callsites are updated in the same MR."
            echo "WARNING: Changed enum case signatures — MR will be created as Draft"
          fi

          if [ -n "$REMOVED_FUNCS" ]; then
            echo "Removed functions: $(echo "$REMOVED_FUNCS" | tr '\n' ', ')"
            STALE_REFS=""
            while IFS= read -r func_name; do
              [ -z "$func_name" ] && continue
              # Search consumer source (excluding build artifacts and tests)
              if grep -rq "$func_name" ${CONSUMER_DIRS} 2>/dev/null; then
                STALE_REFS="${STALE_REFS}- \`${func_name}()\` — still referenced in consumer code\n"
                echo "  STALE: $func_name found in consumer source"
              fi
            done <<< "$REMOVED_FUNCS"

            if [ -n "$STALE_REFS" ]; then
              MARK_DRAFT=true
              REMOVED_WARNING="\\n\\n⚠️ **Removed symbols still referenced in consumer code:**\\n${STALE_REFS}\\nCallsite updates are needed before this MR can merge."
              echo "WARNING: Stale callsites detected — MR will be created as Draft"
            else
              echo "No stale callsites found — all removed symbols are unused"
            fi
          else
            echo "No functions were removed in this version"
          fi
        else
          echo "Could not fetch binding files for comparison — skipping symbol check"
        fi
        rm -rf "$BINDING_CHECK_DIR"
      fi
