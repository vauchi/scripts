# Allow-Direct Lint Guard Template
#
# Forbids production `allow_direct` initializers or assignments unless the
# value is literal `false`. It also rejects production calls to
# `HttpTransportConfig::for_testing` outside the documented allow-list (see
# `scripts/check-no-allow-direct.sh` for the full rationale and exemptions).
#
# Background: `HttpTransportConfig::allow_direct = true` silently falls
# back to direct (non-OHTTP) HTTP when no gateway key is wired, exposing
# the client's source IP to the relay and defeating ADR-037. The
# 2026-04-17 audit (finding A1) flagged 8 production overrides; the
# remediation is tracked in problem record
# `_private/docs/problems/2026-04-17-ohttp-allow-direct-fallback/`.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/allow-direct-guard.yml'
#
# Provides:
#   - allow-direct:check — fails the pipeline on any unapproved
#     direct-transport opt-in in the current repo.

allow-direct:check:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: false
  rules:
    # Held back on main where the repository sets MAIN_RETEST_TEMPLATES
    # (main-retest.yml, vauchi/private#1179); elsewhere this never matches.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MAIN_RETEST != "off" && $MAIN_RETEST_TEMPLATES == "on"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      fetch_vauchi_script scripts/check-no-allow-direct.sh /tmp/check-no-allow-direct.sh
      chmod +x /tmp/check-no-allow-direct.sh
      /tmp/check-no-allow-direct.sh .
  timeout: 5 minutes
