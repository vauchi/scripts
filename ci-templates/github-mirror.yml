# GitHub Push Mirror via GitHub App
#
# Pushes branches and tags to the GitHub mirror after merges to main
# or version tag pushes. Uses a GitHub App installation token that
# auto-expires after 1 hour — no manual rotation needed.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/github-mirror.yml'
#
#   github-mirror:
#     extends: .github-mirror
#
# Required group-level CI variables (masked):
#   GITHUB_APP_ID            — GitHub App numeric ID
#   GITHUB_APP_INSTALLATION_ID    — Installation ID (from org install URL)
#   GITHUB_APP_PRIVATE_KEY   — Base64-encoded .pem private key (File type)
#
# Override variables (optional):
#   GITHUB_MIRROR_ORG        — GitHub org name (default: vauchi)
#   GITHUB_MIRROR_REPO       — Target repo name (default: $CI_PROJECT_NAME)
#   GITHUB_MIRROR_LFS_INCLUDE — Git LFS include pattern (e.g. "*.a") for repos
#       with large files in history that exceed GitHub's 100 MB limit.
#       When set, the job rewrites history with `git lfs migrate import`
#       so large blobs become LFS pointers before pushing.
#
# NOTE: Do NOT include this template in private repos (_private).
# This template is self-contained — it does NOT depend on rust-base.yml.

.github-mirror:
  stage: .post
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags:
    - docker
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITHUB_MIRROR_ORG: "vauchi"
    GITHUB_MIRROR_REPO: "$CI_PROJECT_NAME"
    GITHUB_MIRROR_LFS_INCLUDE: ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache git curl jq openssl coreutils && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
  script:
    - |
      # --- Generate GitHub App JWT (RS256, valid 10 min) ---
      header=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      now=$(date +%s)
      payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 600))" "$GITHUB_APP_ID" \
        | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      unsigned="${header}.${payload}"

      # Decode base64 PEM and sign (variable is File type — path to base64 content)
      # Strip whitespace/newlines before decoding (wl-copy may add trailing newline)
      tr -d '[:space:]' < "$GITHUB_APP_PRIVATE_KEY" | base64 -d > /tmp/app.pem
      if ! openssl rsa -in /tmp/app.pem -check -noout 2>/dev/null; then
        echo "ERROR: GITHUB_APP_PRIVATE_KEY did not decode to a valid RSA key"
        echo "File contents (first 20 chars): $(head -c 20 "$GITHUB_APP_PRIVATE_KEY")..."
        exit 1
      fi
      signature=$(printf '%s' "$unsigned" \
        | openssl dgst -sha256 -sign /tmp/app.pem -binary \
        | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      rm -f /tmp/app.pem
      JWT="${unsigned}.${signature}"

      # --- Exchange JWT for installation access token ---
      # Capture status and body separately. `curl -sf | jq` cannot report
      # why it failed: -f makes curl exit 22 on any 4xx/5xx, and under
      # pipefail that kills the job at this assignment, before the check
      # below can run. Every mirror failure on 2026-08-20 printed only
      # "exit code 22" for that reason.
      : > /tmp/gh-token.json
      HTTP_STATUS=$(curl -s -o /tmp/gh-token.json -w '%{http_code}' -X POST \
        -H "Authorization: Bearer ${JWT}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens") \
        || HTTP_STATUS="000"

      if [ "$HTTP_STATUS" != "201" ]; then
        echo "ERROR: token exchange returned HTTP ${HTTP_STATUS} (expected 201)"
        # GitHub's error bodies name the cause ("Bad credentials",
        # "Integration not found", "expired"). They carry no token — a
        # non-201 response has none to leak — so this is safe to print and
        # is the whole point of the change.
        if [ -s /tmp/gh-token.json ]; then
          echo "GitHub said: $(jq -r '.message // "no message field"' < /tmp/gh-token.json 2>/dev/null || echo 'unparsable body')"
        else
          echo "GitHub said: (no response body)"
        fi
        case "$HTTP_STATUS" in
          401) echo "  → the App JWT was rejected: check GITHUB_APP_ID and that GITHUB_APP_PRIVATE_KEY is the current key" ;;
          404) echo "  → installation not found: check GITHUB_APP_INSTALLATION_ID, or the App may be uninstalled from the org" ;;
          000) echo "  → no HTTP response at all: network or DNS failure reaching api.github.com" ;;
        esac
        rm -f /tmp/gh-token.json
        exit 1
      fi

      TOKEN=$(jq -r '.token' < /tmp/gh-token.json)
      rm -f /tmp/gh-token.json

      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "ERROR: HTTP 201 but no token in the response body"
        exit 1
      fi

      # --- Push to GitHub ---
      git remote add github \
        "https://x-access-token:${TOKEN}@github.com/${GITHUB_MIRROR_ORG}/${GITHUB_MIRROR_REPO}.git"

      # Fetch full history — CI clone may be shallow or detached
      git fetch origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/heads/${CI_DEFAULT_BRANCH}" --depth=2147483647 2>/dev/null || true # vci03-ok: history deepening is best-effort; job is allow_failure and the push below fails loudly on stale refs
      git fetch origin --tags 2>/dev/null || true # vci03-ok: tags fetch is best-effort, same rationale

      # Convert large files to LFS pointers if configured.
      # Required for repos where committed binaries exceed GitHub's 100 MB limit
      # (e.g. .a static libraries in iOS history).
      if [ -n "${GITHUB_MIRROR_LFS_INCLUDE}" ]; then
        echo "Installing Git LFS and migrating: ${GITHUB_MIRROR_LFS_INCLUDE}"
        # The Alpine CDN fails intermittently and a bare `apk add` turns
        # that into a red job for a check that never ran. Retry, and fail
        # loudly rather than continuing without the tools.
        for attempt in 1 2 3; do
            apk add --no-cache git-lfs && installed=yes && break
            echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
            sleep 5
        done
        if [ "${installed:-}" != yes ]; then
            echo "apk add failed after 3 attempts" >&2
            exit 1
        fi
        git lfs install
        git lfs migrate import --include="${GITHUB_MIRROR_LFS_INCLUDE}" --everything
      fi

      # Upload LFS objects before refs — avoids a window with broken pointers.
      # Explicit push because pre-push hooks may not fire in CI containers.
      if [ -n "${GITHUB_MIRROR_LFS_INCLUDE}" ]; then
        git lfs push github --all
      fi

      git push github "refs/heads/${CI_DEFAULT_BRANCH}:refs/heads/${CI_DEFAULT_BRANCH}" --force
      git push github --tags --force
      echo "Mirrored to github.com/${GITHUB_MIRROR_ORG}/${GITHUB_MIRROR_REPO}"
  allow_failure: true
