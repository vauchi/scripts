# GitHub Push Mirror via GitHub App
#
# Pushes branches and tags to the GitHub mirror after merges to main
# or version tag pushes. Uses a GitHub App installation token that
# auto-expires after 1 hour — no manual rotation needed.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/github-mirror.yml'
#
#   github-mirror:
#     extends: .github-mirror
#
# Required group-level CI variables (masked):
#   GITHUB_APP_ID            — GitHub App numeric ID
#   GITHUB_APP_INSTALLATION_ID    — Installation ID (from org install URL)
#   GITHUB_APP_PRIVATE_KEY   — Base64-encoded .pem private key (File type)
#
# Override variables (optional):
#   GITHUB_MIRROR_ORG        — GitHub org name (default: vauchi)
#   GITHUB_MIRROR_REPO       — Target repo name (default: $CI_PROJECT_NAME)
#
# NOTE: Do NOT include this template in private repos (_private).
# This template is self-contained — it does NOT depend on rust-base.yml.

.github-mirror:
  stage: .post
  image: alpine:3.21
  tags:
    - docker
  needs: []
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
    GITHUB_MIRROR_ORG: "vauchi"
    GITHUB_MIRROR_REPO: "$CI_PROJECT_NAME"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache git curl jq openssl coreutils
  script:
    - |
      # --- Generate GitHub App JWT (RS256, valid 10 min) ---
      header=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      now=$(date +%s)
      payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 600))" "$GITHUB_APP_ID" \
        | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      unsigned="${header}.${payload}"

      # Decode base64 PEM and sign (variable is File type — path to base64 content)
      # Strip whitespace/newlines before decoding (wl-copy may add trailing newline)
      tr -d '[:space:]' < "$GITHUB_APP_PRIVATE_KEY" | base64 -d > /tmp/app.pem
      if ! openssl rsa -in /tmp/app.pem -check -noout 2>/dev/null; then
        echo "ERROR: GITHUB_APP_PRIVATE_KEY did not decode to a valid RSA key"
        echo "File contents (first 20 chars): $(head -c 20 "$GITHUB_APP_PRIVATE_KEY")..."
        exit 1
      fi
      signature=$(printf '%s' "$unsigned" \
        | openssl dgst -sha256 -sign /tmp/app.pem -binary \
        | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
      rm -f /tmp/app.pem
      JWT="${unsigned}.${signature}"

      # --- Exchange JWT for installation access token ---
      TOKEN=$(curl -sf -X POST \
        -H "Authorization: Bearer ${JWT}" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens" \
        | jq -r '.token')

      if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
        echo "ERROR: Failed to obtain GitHub installation token"
        exit 1
      fi

      # --- Push to GitHub ---
      git remote add github \
        "https://x-access-token:${TOKEN}@github.com/${GITHUB_MIRROR_ORG}/${GITHUB_MIRROR_REPO}.git"

      # Fetch full history — CI clone may be shallow or detached
      git fetch origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/heads/${CI_DEFAULT_BRANCH}" --depth=2147483647 2>/dev/null || true
      git fetch origin --tags 2>/dev/null || true

      git push github "refs/heads/${CI_DEFAULT_BRANCH}:refs/heads/${CI_DEFAULT_BRANCH}" --force
      git push github --tags --force
      echo "Mirrored to github.com/${GITHUB_MIRROR_ORG}/${GITHUB_MIRROR_REPO}"
  allow_failure: true
