# Test Quality Gates Template
# Automated checks for test code quality (PI-06, PI-14)
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/test-quality.yml'
#
# Provides:
#   - quality:zero-assertions: Fails if any #[test] function has zero assertions
#   - quality:test-ratio: Reports test-to-code ratio as CI metric
#
# Both jobs fetch scripts via GitLab API (no git clone needed),
# so consuming repos don't need to vendor the scripts.
#
# IMPORTANT: These jobs require rust-base.yml to be included (provides
# .linux-runner-nocache). All Rust repos already include it.

# ============================================================
# Zero-Assertion Scanner (PI-06)
# ============================================================
# Scans for #[test] functions that contain no assert!() calls.
# Catches "tests" that don't actually verify anything.
# Runs on self-hosted runner (~5s) instead of Docker (~210s).

quality:zero-assertions:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
  script:
    - |
      # Fetch single script via GitLab API (faster than git clone)
      curl -fsSL "https://gitlab.com/vauchi/scripts/-/raw/${CI_DEFAULT_BRANCH}/scripts/check-zero-assertions.sh" -o /tmp/check-zero-assertions.sh
      chmod +x /tmp/check-zero-assertions.sh

      # Scan all Rust source directories that contain tests
      DIRS=""
      for dir in src tests; do
        if [ -d "$dir" ]; then
          DIRS="$DIRS $dir"
        fi
      done
      # Also check workspace member directories
      for dir in */src */tests; do
        if [ -d "$dir" ]; then
          DIRS="$DIRS $dir"
        fi
      done

      if [ -n "$DIRS" ]; then
        /tmp/check-zero-assertions.sh $DIRS
      else
        echo "No test directories found — skipping"
      fi
  timeout: 5 minutes

# ============================================================
# Test-to-Code Ratio (PI-14)
# ============================================================
# Measures TLOC/ELOC ratio and reports it. Advisory — does not
# fail the pipeline, but tracks progress toward 50% target.

quality:test-ratio:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
  allow_failure: true
  script:
    - |
      # Fetch single script via GitLab API (faster than git clone)
      curl -fsSL "https://gitlab.com/vauchi/scripts/-/raw/${CI_DEFAULT_BRANCH}/scripts/test-code-ratio.sh" -o /tmp/test-code-ratio.sh
      chmod +x /tmp/test-code-ratio.sh

      # Measure ratio for each crate directory that has src/
      for dir in . */; do
        dir="${dir%/}"
        if [ -d "$dir/src" ]; then
          echo ""
          /tmp/test-code-ratio.sh "$dir"
        fi
      done
  timeout: 5 minutes

# ============================================================
# Engineering Metrics Dashboard (PI-21)
# ============================================================
# Aggregates 10 key metrics across all repos. Runs monthly on
# schedule, outputs markdown report as CI artifact.
#
# To include GitLab API metrics, set GITLAB_TOKEN in CI/CD variables.
# Without it, only locally-measurable metrics are reported.

quality:metrics-dashboard:
  stage: lint
  image: python:3.12-slim
  tags: [docker]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq git findutils gawk >/dev/null 2>&1
    - git clone --depth=1 https://gitlab.com/vauchi/scripts.git /tmp/scripts
    - chmod +x /tmp/scripts/scripts/engineering-metrics.sh
    - |
      # Clone all Rust repos for local measurement
      mkdir -p /tmp/workspace
      for repo in core relay cli tui e2e; do
        git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" "/tmp/workspace/${repo}" 2>/dev/null || true
      done
    - |
      VAUCHI_ROOT=/tmp/workspace \
      GITLAB_TOKEN="${GITLAB_TOKEN:-}" \
        /tmp/scripts/scripts/engineering-metrics.sh --gitlab | tee metrics-dashboard.md
    - |
      VAUCHI_ROOT=/tmp/workspace \
      GITLAB_TOKEN="${GITLAB_TOKEN:-}" \
        /tmp/scripts/scripts/engineering-metrics.sh --gitlab --json > metrics-dashboard.json
  artifacts:
    paths:
      - metrics-dashboard.md
      - metrics-dashboard.json
    expire_in: 90 days
  timeout: 10 minutes
