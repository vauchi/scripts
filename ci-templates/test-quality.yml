# Test Quality Gates Template
# Automated checks for test code quality (PI-06, PI-14)
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/test-quality.yml'
#
# Provides:
#   - quality:zero-assertions: Fails if any #[test] function has zero assertions
#   - quality:test-ratio: Reports test-to-code ratio as CI metric
#   - quality:scenario-names: Fails an MR whose added @scenario annotations
#     name no scenario on features main (vauchi/private#994)
#
# Both jobs fetch scripts via GitLab API (no git clone needed),
# so consuming repos don't need to vendor the scripts.
#
# IMPORTANT: These jobs require rust-base.yml to be included (provides
# .linux-runner-nocache). All Rust repos already include it.

# ============================================================
# Zero-Assertion Scanner (PI-06)
# ============================================================
# Scans for #[test] functions that contain no assert!() calls.
# Catches "tests" that don't actually verify anything.
# Runs on self-hosted runner (~5s) instead of Docker (~210s).

quality:zero-assertions:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: false
  rules:
    # Held back on main where the repository sets MAIN_RETEST_TEMPLATES
    # (main-retest.yml, vauchi/private#1179); elsewhere this never matches.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MAIN_RETEST != "off" && $MAIN_RETEST_TEMPLATES == "on"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      fetch_vauchi_script scripts/check-zero-assertions.sh /tmp/check-zero-assertions.sh

      # Scan all Rust source directories that contain tests
      DIRS=""
      for dir in src tests; do
        if [ -d "$dir" ]; then
          DIRS="$DIRS $dir"
        fi
      done
      # Also check workspace member directories
      for dir in */src */tests; do
        if [ -d "$dir" ]; then
          DIRS="$DIRS $dir"
        fi
      done

      if [ -n "$DIRS" ]; then
        /tmp/check-zero-assertions.sh $DIRS
      else
        echo "No test directories found — skipping"
      fi
  timeout: 5 minutes

# ============================================================
# Test-to-Code Ratio (PI-14)
# ============================================================
# Measures TLOC/ELOC ratio and reports it. Advisory — does not
# fail the pipeline, but tracks progress toward 50% target.

quality:test-ratio:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  rules:
    # Held back on main where the repository sets MAIN_RETEST_TEMPLATES
    # (main-retest.yml, vauchi/private#1179); elsewhere this never matches.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MAIN_RETEST != "off" && $MAIN_RETEST_TEMPLATES == "on"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - |
      fetch_vauchi_script scripts/test-code-ratio.sh /tmp/test-code-ratio.sh

      # Measure ratio for each crate directory that has src/
      for dir in . */; do
        dir="${dir%/}"
        if [ -d "$dir/src" ]; then
          echo ""
          /tmp/test-code-ratio.sh "$dir"
        fi
      done
  timeout: 5 minutes

# ============================================================
# Engineering Metrics Dashboard (PI-21)
# ============================================================
# Aggregates 10 key metrics across all repos. Runs monthly on
# schedule, outputs markdown report as CI artifact.
#
# To include GitLab API metrics, set GITLAB_TOKEN in CI/CD variables.
# Without it, only locally-measurable metrics are reported.

quality:metrics-dashboard:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  allow_failure: true
  script:
    - apt-get update -qq && apt-get install -y -qq git findutils gawk >/dev/null 2>&1
    # fetch, not `clone --branch`: core pins VAUCHI_SCRIPTS_REF to a commit
    # SHA, which `--branch` rejects (private#556).
    - git init -q /tmp/scripts
    - git -C /tmp/scripts fetch -q --depth=1 https://gitlab.com/vauchi/scripts.git "${VAUCHI_SCRIPTS_REF}"
    - git -C /tmp/scripts checkout -q --detach FETCH_HEAD
    - chmod +x /tmp/scripts/scripts/engineering-metrics.sh
    - |
      # Clone all Rust repos for local measurement
      mkdir -p /tmp/workspace
      for repo in core relay cli tui e2e; do
        git clone --depth=1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/${repo}.git" "/tmp/workspace/${repo}" 2>/dev/null || true
      done
    - |
      VAUCHI_ROOT=/tmp/workspace \
      GITLAB_TOKEN="${GITLAB_TOKEN:-}" \
        /tmp/scripts/scripts/engineering-metrics.sh --gitlab | tee metrics-dashboard.md
    - |
      VAUCHI_ROOT=/tmp/workspace \
      GITLAB_TOKEN="${GITLAB_TOKEN:-}" \
        /tmp/scripts/scripts/engineering-metrics.sh --gitlab --json > metrics-dashboard.json
  artifacts:
    paths:
      - metrics-dashboard.md
      - metrics-dashboard.json
    expire_in: 90 days
  timeout: 10 minutes

# ============================================================
# Scenario Annotation Coverage (PI-27)
# ============================================================
# Warns when #[test] functions lack // @scenario: or // @internal
# annotations. Advisory — warns but does not block the pipeline.
# Tracks traceability between tests and Gherkin feature scenarios.

quality:scenario-annotations:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: true
  rules:
    # Held back on main where the repository sets MAIN_RETEST_TEMPLATES
    # (main-retest.yml, vauchi/private#1179); elsewhere this never matches.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MAIN_RETEST != "off" && $MAIN_RETEST_TEMPLATES == "on"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      fetch_vauchi_script scripts/check-scenario-annotations.sh /tmp/check-scenario-annotations.sh

      DIRS=""
      for dir in tests src; do
        [ -d "$dir" ] && DIRS="$DIRS $dir"
      done
      for dir in */tests */src; do
        [ -d "$dir" ] && DIRS="$DIRS $dir"
      done

      if [ -n "$DIRS" ]; then
        /tmp/check-scenario-annotations.sh $DIRS
      else
        echo "No test directories found — skipping"
      fi
  timeout: 5 minutes

# ============================================================
# New Test Annotation Gate (PI-27b)
# ============================================================
# Hard gate: every NEW #[test] / #[tokio::test] function added
# in an MR must have a @scenario: or @internal annotation.
# Existing unannotated tests are grandfathered — only new tests
# are checked.  Prevents annotation backslide after Phase 1.

quality:new-test-annotations:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
  script:
    - |
      fetch_vauchi_script scripts/check-new-test-annotations.sh /tmp/check-new-test-annotations.sh
      /tmp/check-new-test-annotations.sh "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  timeout: 5 minutes

# ============================================================
# Scenario Names Gate (vauchi/private#994)
# ============================================================
# Hard gate: every @scenario annotation an MR adds must name a scenario
# features main already has. Merging a test that named a scenario still
# on a features branch turned features' lint:implemented-scenarios red on
# every MR, three times on 2026-10-30, until one combined MR broke the
# deadlock. The scenario lands in features first; this is the order that
# check already assumes. Only added lines are checked, so a rename in
# features does not block unrelated MRs here.

quality:scenario-names:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates wget > /dev/null
    # fetch, not `clone --branch`: core pins VAUCHI_SCRIPTS_REF to a commit
    # SHA, which `--branch` rejects (private#556).
    - git init -q /tmp/scripts
    - git -C /tmp/scripts fetch -q --depth=1 https://gitlab.com/vauchi/scripts.git "${VAUCHI_SCRIPTS_REF}"
    - git -C /tmp/scripts checkout -q --detach FETCH_HEAD
    - mkdir -p /tmp/roots
    - wget -qO /tmp/features.tar.gz "https://gitlab.com/vauchi/features/-/archive/main/features-main.tar.gz"
    - tar -xzf /tmp/features.tar.gz -C /tmp/roots
    # GIT_DEPTH is 1, so the diff base is not in the checkout until fetched.
    - git fetch -q --depth=1 origin "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - python3 /tmp/scripts/scripts/check-implemented-scenarios.py --features /tmp/roots/features-main --added-since "$CI_MERGE_REQUEST_DIFF_BASE_SHA" .
  timeout: 5 minutes

# ============================================================
# Vauchi Quality Semgrep Rules (CC-03, CC-06, ADR-030, ADR-043)
# ============================================================
# semgrep-rules/vauchi-quality.yml was written but never wired to
# anything: no CI job and no just recipe referenced it, so ADR-030's
# "semgrep-enforced" claim in adr-constraints.md held only for whoever
# ran the command by hand. This job runs it.
#
# Deliberately NOT folded into the SAST ruleset passthrough: quality
# findings would then land in the security dashboard, which
# sast-ruleset.toml excludes them from on purpose.
#
# Complements quality:zero-assertions rather than duplicating it —
# that job catches tests with no assertions, these rules catch
# assertions that pass regardless of the value (assert!(x.is_ok())).

quality:semgrep-rules:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  allow_failure: false
  # Self-provisioning on a docker image rather than .linux-runner-nocache:
  # nothing installs semgrep or opengrep on the self-hosted runners, so a
  # job that assumes the binary is a gate that cannot run. Pinned because
  # an unpinned analyzer changes what the gate enforces without review.
  variables:
    SEMGREP_VERSION: "1.174.0"
  rules:
    # Held back on main where the repository sets MAIN_RETEST_TEMPLATES
    # (main-retest.yml, vauchi/private#1179); elsewhere this never matches.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MAIN_RETEST != "off" && $MAIN_RETEST_TEMPLATES == "on"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - pip install --no-cache-dir --quiet "semgrep==${SEMGREP_VERSION}"
  script:
    # Fetched with python rather than curl: the slim image ships no curl,
    # and urllib raises on a non-200 instead of writing an error body to
    # the rules file and letting semgrep "pass" on nothing (VSH13).
    - |
      python - <<'FETCH'
      import os, sys, urllib.parse, urllib.request

      path = urllib.parse.quote("semgrep-rules/vauchi-quality.yml", safe="")
      url = "{}/projects/77957857/repository/files/{}/raw?ref={}".format(
          os.environ["CI_API_V4_URL"], path, os.environ["VAUCHI_SCRIPTS_REF"])
      request = urllib.request.Request(
          url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      try:
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read()
      except Exception as error:
          sys.exit("ERROR: fetching vauchi-quality.yml failed: {}".format(error))
      if not body.strip():
          sys.exit("ERROR: vauchi-quality.yml came back empty")
      open("/tmp/vauchi-quality.yml", "wb").write(body)
      FETCH
    - semgrep scan --config /tmp/vauchi-quality.yml --error --quiet --metrics=off .
