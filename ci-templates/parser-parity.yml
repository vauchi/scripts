# Parser-Parity Template
# Verifies that the consuming frontend's hand-rolled ScreenModel
# parser handles every Component variant declared in core's canonical
# `Component` enum. Catches silent drift — a new core variant that
# would render as a placeholder / silently default.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/parser-parity.yml'
#
# Provides:
#   - .parser-parity-job: Validates one frontend's parser file
#
# Variables (set by consumer jobs that extend `.parser-parity-job`):
#   FRONTEND_NAME:  Frontend identifier — must match a key in the
#                   script's parser map.
#   PARSER_FILE:    Path to the consumer's parser file (repo-relative).
#   CORE_REF:       Git ref of vauchi/core to check against (default:
#                   main). Pin to a specific tag/commit for reproducible
#                   runs.
#   PARSER_PROTOCOL: "component" (legacy) or "presentation".
#   CORE_PIN_FILE / CORE_PIN_KIND: the consumer's own Core pin (e.g.
#                   cabi-version.json / cabi-json). When set, CORE_REF is
#                   read from it through scripts/core-pins.py, so the check
#                   runs against the Core the app ships with (ADR-026
#                   amendment, #434). Prefer this over a CORE_REF constant.

.parser-parity-job:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    FRONTEND_NAME: ""
    PARSER_FILE: ""
    CORE_REF: "main"
    PARSER_PROTOCOL: "component"
    PARSER_SCRIPT_REF: "main"
    CORE_PIN_FILE: ""
    CORE_PIN_KIND: ""
  before_script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache git python3 && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
  script:
    - |
      set -euo pipefail

      if [ -z "$FRONTEND_NAME" ] || [ -z "$PARSER_FILE" ]; then
        echo "ERROR: FRONTEND_NAME and PARSER_FILE must be set"
        exit 2
      fi

      if [ ! -e "$PARSER_FILE" ]; then
        echo "ERROR: PARSER_FILE not found: $PARSER_FILE"
        exit 2
      fi

      # Same step as design-drift.yml: the pin, not a constant, names Core.
      if [ -n "$CORE_PIN_FILE" ]; then
        wget -q -O /tmp/core-pins.py \
          "https://gitlab.com/vauchi/scripts/-/raw/${PARSER_SCRIPT_REF}/scripts/core-pins.py"
        CORE_REF=$(python3 /tmp/core-pins.py read --kind "$CORE_PIN_KIND" "$CORE_PIN_FILE")
        echo "Core ref from $CORE_PIN_FILE: $CORE_REF"
      fi

      # Fetch only the canonical enum file from core via shallow clone +
      # sparse-checkout — avoids a full clone of the core repo just to
      # read one source file.
      #
      # Wire Humble Tier 0 (2026-05-04, core 0.41.0) split the single
      # `component.rs` into `component/{mod,list,preview}.rs` to keep the
      # file under the size warn threshold. Fetch both paths so this
      # template works against pre-Tier-0 refs (tagged binding versions
      # still pinned to 0.39.0 etc.) and post-Tier-0 main alike.
      mkdir -p .core-parity
      git -C .core-parity init -q
      git -C .core-parity remote add origin https://gitlab.com/vauchi/core.git
      git -C .core-parity sparse-checkout init --no-cone
      git -C .core-parity sparse-checkout set \
        Cargo.toml \
        vauchi-app/src/ui/component.rs \
        vauchi-app/src/ui/component \
        vauchi-core/src/platform/presentation/surface/nodes.rs
      git -C .core-parity fetch -q --depth 1 origin "$CORE_REF"
      git -C .core-parity checkout -q FETCH_HEAD

      # ADR-078 (vauchi/private#1013) moved the presentation nodes to the
      # contract crate, which Core pins by tag in its workspace Cargo.toml.
      # A Core ref without vauchi-core's copy reads the contract's at that
      # tag; older refs keep vauchi-core's (vauchi/private#1030).
      PRESENTATION_NODES=".core-parity/vauchi-core/src/platform/presentation/surface/nodes.rs"
      if [ "$PARSER_PROTOCOL" = "presentation" ] && [ ! -f "$PRESENTATION_NODES" ]; then
        CONTRACT_REF=$(sed -n 's/^vauchi-contract *=.*tag *= *"\([^"]*\)".*/\1/p' .core-parity/Cargo.toml)
        if [ -z "$CONTRACT_REF" ]; then
          echo "ERROR: Core $CORE_REF has no presentation nodes and pins no vauchi-contract tag"
          exit 2
        fi
        echo "Presentation nodes from vauchi/contract $CONTRACT_REF (pinned by Core $CORE_REF)"
        mkdir -p .contract-parity
        git -C .contract-parity init -q
        git -C .contract-parity remote add origin https://gitlab.com/vauchi/contract.git
        git -C .contract-parity sparse-checkout init --no-cone
        git -C .contract-parity sparse-checkout set src/presentation/surface/nodes.rs
        git -C .contract-parity fetch -q --depth 1 origin "refs/tags/$CONTRACT_REF"
        git -C .contract-parity checkout -q FETCH_HEAD
        PRESENTATION_NODES=".contract-parity/src/presentation/surface/nodes.rs"
      fi

      # Prefer the post-Tier-0 layout; fall back to the pre-Tier-0
      # single-file layout for older refs.
      if [ "$PARSER_PROTOCOL" = "presentation" ]; then
        ENUM_FILE="$PRESENTATION_NODES"
      elif [ -f .core-parity/vauchi-app/src/ui/component/mod.rs ]; then
        ENUM_FILE=".core-parity/vauchi-app/src/ui/component/mod.rs"
      elif [ -f .core-parity/vauchi-app/src/ui/component.rs ]; then
        ENUM_FILE=".core-parity/vauchi-app/src/ui/component.rs"
      else
        echo "ERROR: failed to fetch core's Component enum at ref $CORE_REF"
        echo "       (looked for component/mod.rs and component.rs under vauchi-app/src/ui/)"
        exit 2
      fi

      # Fetch the parity script. CI_PROJECT_PATH-aware: use the same
      # dependency proxy / mirror the runner already trusts. Falls back
      # to raw HTTPS for non-GitLab environments.
      SCRIPT_URL="https://gitlab.com/vauchi/scripts/-/raw/${PARSER_SCRIPT_REF}/scripts/check-component-parser-parity.py"
      wget -q -O check-parser-parity.py "$SCRIPT_URL"

      python3 check-parser-parity.py \
        --protocol "$PARSER_PROTOCOL" \
        --enum-file "$ENUM_FILE" \
        --frontend "$FRONTEND_NAME" \
        --parser-file "$PARSER_FILE"
