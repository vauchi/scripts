# Release Pipeline Template
# Tag-based release automation
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/release.yml'
#
# Provides:
#   Auto-tag:
#     - .auto-tag: Auto-create git tag from Cargo.toml version on merge to main
#   Verification:
#     - .dev-verify: Verify dev tag is on main (lightweight pipeline)
#     - .rc-verify: Verify RC tag is on main (full quality gate)
#     - .release-verify: Verify tag is on main branch
#   Dev tag lint/test (extend with runner template):
#     - .dev-lint-format: cargo fmt check on dev tags
#     - .dev-lint-clippy: cargo clippy on dev tags
#     - .dev-test-nextest: cargo nextest on dev tags (with junit artifacts)
#   RC tag lint/security (extend with runner template):
#     - .rc-lint-format: cargo fmt check on RC tags
#     - .rc-lint-clippy: cargo clippy on RC tags
#     - .rc-security-audit: cargo audit on RC tags
#   Release:
#     - .release-build: Build release artifacts
#     - .release-package: Package artifacts with checksums
#     - .release-publish: Publish to GitLab registry
#     - .release-create: Create GitLab release
#     - .release-trigger: Trigger downstream repos

# ============================================================
# Auto-Tag (merge to main → create version tag)
# ============================================================
# Reads version from Cargo.toml and creates a git tag if it doesn't exist.
# Uses Docker runner with Alpine for minimal footprint.
#
# Variables:
#   AUTO_TAG_VERSION_CMD:     Shell command to extract version (default: single crate)
#   AUTO_TAG_SKIP_PRERELEASE: "true" to skip dev/rc versions (default: "true")
#   AUTO_TAG_DEV_FALLBACK:    "true" to auto-create dev tag when version tag exists (default: "false")
#
# Example:
#   auto-tag:version:
#     extends: .auto-tag
#
#   # Workspace repo with dev-fallback (e.g. core):
#   auto-tag:version:
#     extends: .auto-tag
#     variables:
#       AUTO_TAG_VERSION_CMD: "grep -A5 '^\\[workspace\\.package\\]' Cargo.toml | grep '^version' | sed 's/.*\"\\(.*\\)\"/\\1/'"
#       AUTO_TAG_SKIP_PRERELEASE: "false"
#       AUTO_TAG_DEV_FALLBACK: "true"

.auto-tag:
  stage: auto-tag
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # Skip on triggered pipelines (core triggering downstream for compat check).
    # Auto-tag only makes sense when THIS repo's code was merged to main.
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
    AUTO_TAG_VERSION_CMD: "grep '^version' Cargo.toml | head -1 | sed 's/.*\"\\(.*\\)\"/\\1/'"
    AUTO_TAG_SKIP_PRERELEASE: "true"
    AUTO_TAG_DEV_FALLBACK: "false"
  script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache git curl && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
    - |
      VERSION=$(eval "${AUTO_TAG_VERSION_CMD}")
      TAG="v${VERSION}"
      echo "Cargo.toml version: ${VERSION}"
      echo "Expected tag: ${TAG}"

      if [ "${AUTO_TAG_SKIP_PRERELEASE}" = "true" ]; then
        if echo "$VERSION" | grep -qE -- '-(dev|rc)\.'; then
          echo "⚠ Pre-release version ${VERSION} detected — skipping auto-tag"
          echo "  Use 'just release-dev' or 'just release-rc' to create pre-release tags"
          exit 0
        fi
      fi

      # Commit as the token's own bot user. The group push rule "commit author
      # must be a GitLab user" rejects a hardcoded noreply@vauchi.app address
      # that belongs to nobody (core pipeline 2842810001, 2026-09-12). The
      # /user endpoint answers with the member the token acts as; plain sed
      # keeps this portable across the alpine, debian and node images.
      BOT_USER_JSON=$(curl --silent --fail --header "PRIVATE-TOKEN: ${PROJECT_ACCESS_TOKEN}" "${CI_API_V4_URL}/user")
      BOT_NAME=$(printf '%s' "$BOT_USER_JSON" | sed -n 's/.*"username":"\([^"]*\)".*/\1/p')
      BOT_EMAIL=$(printf '%s' "$BOT_USER_JSON" | sed -n 's/.*"commit_email":"\([^"]*\)".*/\1/p')
      [ -n "$BOT_NAME" ] && [ -n "$BOT_EMAIL" ] || { echo "ERROR: could not resolve the bot identity from PROJECT_ACCESS_TOKEN" >&2; exit 1; }
      git config user.name "$BOT_NAME"
      git config user.email "$BOT_EMAIL"

      # Use project access token for push — CI_JOB_TOKEN cannot be used here
      # because pushes via CI_JOB_TOKEN do not trigger new pipelines, and the
      # tag push must trigger the release pipeline (build/package/publish stages).
      # PROJECT_ACCESS_TOKEN is set at group level in Settings > CI/CD > Variables.
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      # Check if tag already exists
      if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
        if [ "${AUTO_TAG_DEV_FALLBACK}" = "true" ]; then
          echo "Tag ${TAG} already exists — creating dev tag instead"
          BASE_VERSION=$(echo "${VERSION}" | sed 's/-.*//')
          LAST_DEV=$(git ls-remote --tags origin "refs/tags/v${BASE_VERSION}-dev.*" \
            | sed 's|.*/||' | sort -V | tail -1 || true)
          if [ -n "${LAST_DEV}" ]; then
            N=$(echo "${LAST_DEV}" | grep -oE '[0-9]+$')
            N=$((N + 1))
          else
            N=1
          fi
          DEV_TAG="v${BASE_VERSION}-dev.${N}"
          echo "Creating dev tag: ${DEV_TAG}"
          git tag -a "${DEV_TAG}" -m "Dev build ${DEV_TAG}"
          git push origin "${DEV_TAG}"
          echo "✓ Created and pushed dev tag ${DEV_TAG}"
        else
          echo "✓ Tag ${TAG} already exists — nothing to do"
        fi
        exit 0
      fi

      echo "Tag ${TAG} does not exist — creating it..."

      git tag -a "${TAG}" -m "Release ${TAG}"
      git push origin "${TAG}"
      echo "✓ Created and pushed tag ${TAG}"

# ============================================================
# Dev Tag Verification (lightweight)
# ============================================================

# Dev tags run lint + test only — no build, package, publish, or deploy.
.dev-verify:
  interruptible: true
  stage: build
  script:
    - |
      echo "Dev tag $CI_COMMIT_TAG — running lightweight verification"
      echo "Version: ${CI_COMMIT_TAG#v}"
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

# ============================================================
# RC Tag Verification (full quality gate)
# ============================================================

# RC tags run the full pipeline (coverage, mutation, bench, e2e)
# but do NOT publish, deploy, or trigger downstream.
.rc-verify:
  interruptible: true
  stage: build
  script:
    - |
      echo "RC tag $CI_COMMIT_TAG — running full quality gate"
      echo "Version: ${CI_COMMIT_TAG#v}"
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Dev Tag Lint/Test Templates
# ============================================================
# Reusable job templates for dev tag pipelines. Extend with a runner template.
#
# Example:
#   dev:lint:format:
#     extends: [.rust-runner-nocache, .dev-lint-format]
#   dev:lint:clippy:
#     extends: [.rust-runner-readonly, .dev-lint-clippy]
#   dev:test:
#     extends: [.rust-runner, .dev-test-nextest, .timeout-standard]

.dev-lint-format:
  extends: .lint-format
  needs: [dev:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

.dev-lint-clippy:
  extends: .lint-clippy
  needs: [dev:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

.dev-test-nextest:
  stage: test
  needs: [dev:lint:format]
  variables:
    DEV_TEST_EXTRA_FLAGS: ""
  script:
    - cargo nextest run --profile ci --all-targets ${DEV_TEST_EXTRA_FLAGS}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# ============================================================
# RC Tag Lint/Security Templates
# ============================================================
# Reusable job templates for RC tag pipelines. Extend with a runner template.
#
# Example:
#   rc:lint:format:
#     extends: [.rust-runner-nocache, .rc-lint-format]
#   rc:lint:clippy:
#     extends: [.rust-runner-readonly, .rc-lint-clippy]
#   rc:security:audit:
#     extends: [.rust-runner-readonly, .rc-security-audit]

.rc-lint-format:
  extends: .lint-format
  needs: [rc:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

.rc-lint-clippy:
  extends: .lint-clippy
  needs: [rc:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

.rc-security-audit:
  extends: [.security-audit, .timeout-quick]
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || true

# ============================================================
# Release Verification
# ============================================================

# Verify tag is on main branch before proceeding
# CRITICAL: Tags must only be created on commits that are on main
.release-verify:
  interruptible: false
  stage: build
  script:
    - |
      echo "Verifying tag $CI_COMMIT_TAG is on main branch..."
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        echo "  Tags must only be created on commits that are on $CI_DEFAULT_BRANCH."
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Build Templates
# ============================================================

# Exact-zero Humble UI boundary gate.  MR ratchets intentionally permit
# existing debt to remain while it decreases; a production release may not
# carry any remaining boundary violations.  Consumers instantiate this as
# `release:ratchet-zero` and provide the same REPO_NAME used by lint:humble.
.release-ratchet-zero:
  interruptible: false
  allow_failure: false
  stage: build
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl coreutils
    - mkdir -p .ratchet-scripts
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check.py/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check.py
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/scripts%2Fhumble_check_rules.json/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o .ratchet-scripts/humble_check_rules.json
  script:
    - python3 .ratchet-scripts/humble_check.py
        --repo "${REPO_NAME:-$CI_PROJECT_NAME}"
        --repo-path "${CI_PROJECT_DIR}"
        --config .ratchet-scripts/humble_check_rules.json
        --require-zero
  artifacts:
    paths:
      - .ratchet-scripts/
    when: on_failure
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Build release binary
.release-build:
  interruptible: false
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Build release with specific binary name
.release-build-binary:
  interruptible: false
  stage: build
  variables:
    BINARY_NAME: ""
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/${BINARY_NAME}
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Packaging Templates
# ============================================================

# Package with checksums
.release-package:
  interruptible: false
  stage: package
  variables:
    ARTIFACT_NAME: ""
    ARTIFACT_PATH: ""
  script:
    - |
      mkdir -p dist
      cp "${ARTIFACT_PATH}" "dist/${ARTIFACT_NAME}"
      cd dist
      sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
      echo "Packaged: ${ARTIFACT_NAME}"
      cat "${ARTIFACT_NAME}.sha256"
  artifacts:
    paths:
      - dist/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Publishing Templates
# ============================================================

# Publish to GitLab Generic Package Registry
.release-publish-generic:
  interruptible: false
  resource_group: release-publish
  stage: publish
  variables:
    PACKAGE_NAME: ""
    PACKAGE_FILE: ""
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing ${PACKAGE_NAME} ${VERSION} to GitLab package registry..."

      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "${PACKAGE_FILE}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/$(basename ${PACKAGE_FILE})"

      echo "Published ${PACKAGE_NAME} ${VERSION}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Publish Rust crate to GitLab registry
.release-publish-crate:
  interruptible: false
  resource_group: release-publish
  stage: publish
  variables:
    CRATE_NAME: ""
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing ${CRATE_NAME} ${VERSION} to GitLab package registry..."

      cargo package -p ${CRATE_NAME} --allow-dirty

      CRATE_FILE="target/package/${CRATE_NAME}-${VERSION}.crate"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CRATE_NAME}/${VERSION}/${CRATE_NAME}-${VERSION}.crate"

      echo "Published ${CRATE_NAME} ${VERSION}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# GitLab Release Creation
# ============================================================

# Create GitLab release with artifacts
.release-create:
  interruptible: false
  resource_group: release-publish
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  tags:
    - docker
  variables:
    RELEASE_DESCRIPTION: ""
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: $RELEASE_DESCRIPTION
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Downstream Triggers
# ============================================================

# Trigger downstream repository pipeline
.release-trigger:
  interruptible: false
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Trigger multiple downstream repos (use with parallel matrix)
.release-trigger-multiple:
  interruptible: false
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "src/**/*"
        - "vauchi-platform/**/*"
