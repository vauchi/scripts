# Release Pipeline Template
# Tag-based release automation
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/release.yml'
#
# Provides:
#   Auto-tag:
#     - .auto-tag: Auto-create git tag from Cargo.toml version on merge to main
#   Verification:
#     - .dev-verify: Verify dev tag is on main (lightweight pipeline)
#     - .rc-verify: Verify RC tag is on main (full quality gate)
#     - .release-verify: Verify tag is on main branch
#   Dev tag lint/test (extend with runner template):
#     - .dev-lint-format: cargo fmt check on dev tags
#     - .dev-lint-clippy: cargo clippy on dev tags
#     - .dev-test-nextest: cargo nextest on dev tags (with junit artifacts)
#   RC tag lint/security (extend with runner template):
#     - .rc-lint-format: cargo fmt check on RC tags
#     - .rc-lint-clippy: cargo clippy on RC tags
#     - .rc-security-audit: cargo audit on RC tags
#   Release:
#     - .release-build: Build release artifacts
#     - .release-package: Package artifacts with checksums
#     - .release-publish: Publish to GitLab registry
#     - .release-create: Create GitLab release
#     - .release-trigger: Trigger downstream repos

# ============================================================
# Auto-Tag: .auto-tag lives in auto-tag.yml, which needs no other template,
# so a repo can include it alone (private#1045). Included here so repos
# that include release.yml keep it.
# ============================================================
include:
  - local: '/ci-templates/auto-tag.yml'

# ============================================================
# Dev Tag Verification (lightweight)
# ============================================================

# Dev tags run lint + test only — no build, package, publish, or deploy.
.dev-verify:
  interruptible: true
  stage: build
  script:
    - |
      echo "Dev tag $CI_COMMIT_TAG — running lightweight verification"
      echo "Version: ${CI_COMMIT_TAG#v}"
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

# ============================================================
# RC Tag Verification (full quality gate)
# ============================================================

# RC tags run the full pipeline (coverage, mutation, bench, e2e)
# but do NOT publish, deploy, or trigger downstream.
.rc-verify:
  interruptible: true
  stage: build
  script:
    - |
      echo "RC tag $CI_COMMIT_TAG — running full quality gate"
      echo "Version: ${CI_COMMIT_TAG#v}"
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# ============================================================
# Dev Tag Lint/Test Templates
# ============================================================
# Reusable job templates for dev tag pipelines. Extend with a runner template.
#
# Example:
#   dev:lint:format:
#     extends: [.rust-runner-nocache, .dev-lint-format]
#   dev:lint:clippy:
#     extends: [.rust-runner-readonly, .dev-lint-clippy]
#   dev:test:
#     extends: [.rust-runner, .dev-test-nextest, .timeout-standard]

.dev-lint-format:
  extends: .lint-format
  needs: [dev:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

.dev-lint-clippy:
  extends: .lint-clippy
  needs: [dev:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

.dev-test-nextest:
  stage: test
  needs: [dev:lint:format]
  variables:
    DEV_TEST_EXTRA_FLAGS: ""
  script:
    - cargo nextest run --profile ci --all-targets ${DEV_TEST_EXTRA_FLAGS}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# ============================================================
# RC Tag Lint/Security Templates
# ============================================================
# Reusable job templates for RC tag pipelines. Extend with a runner template.
#
# Example:
#   rc:lint:format:
#     extends: [.rust-runner-nocache, .rc-lint-format]
#   rc:lint:clippy:
#     extends: [.rust-runner-readonly, .rc-lint-clippy]
#   rc:security:audit:
#     extends: [.rust-runner-readonly, .rc-security-audit]

.rc-lint-format:
  extends: .lint-format
  needs: [rc:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

.rc-lint-clippy:
  extends: .lint-clippy
  needs: [rc:verify]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

.rc-security-audit:
  extends: [.security-audit, .timeout-quick]
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || true

# ============================================================
# Release Verification
# ============================================================

# Verify tag is on main branch before proceeding
# CRITICAL: Tags must only be created on commits that are on main
.release-verify:
  interruptible: false
  stage: build
  script:
    - |
      echo "Verifying tag $CI_COMMIT_TAG is on main branch..."
      git fetch origin $CI_DEFAULT_BRANCH --depth=100
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/$CI_DEFAULT_BRANCH; then
        echo "Tag $CI_COMMIT_TAG is on $CI_DEFAULT_BRANCH branch"
      else
        echo "ERROR: Tag $CI_COMMIT_TAG is NOT on $CI_DEFAULT_BRANCH branch!"
        echo "  Tags must only be created on commits that are on $CI_DEFAULT_BRANCH."
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Build Templates
# ============================================================

# Build release binary
.release-build:
  interruptible: false
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Build release with specific binary name
.release-build-binary:
  interruptible: false
  stage: build
  variables:
    BINARY_NAME: ""
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/${BINARY_NAME}
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Packaging Templates
# ============================================================

# Package with checksums
.release-package:
  interruptible: false
  stage: package
  variables:
    ARTIFACT_NAME: ""
    ARTIFACT_PATH: ""
  script:
    - |
      mkdir -p dist
      cp "${ARTIFACT_PATH}" "dist/${ARTIFACT_NAME}"
      cd dist
      sha256sum "${ARTIFACT_NAME}" > "${ARTIFACT_NAME}.sha256"
      echo "Packaged: ${ARTIFACT_NAME}"
      cat "${ARTIFACT_NAME}.sha256"
  artifacts:
    paths:
      - dist/*
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Release Publishing Templates
# ============================================================

# Publish to GitLab Generic Package Registry
.release-publish-generic:
  interruptible: false
  resource_group: release-publish
  stage: publish
  variables:
    PACKAGE_NAME: ""
    PACKAGE_FILE: ""
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing ${PACKAGE_NAME} ${VERSION} to GitLab package registry..."

      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "${PACKAGE_FILE}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/$(basename ${PACKAGE_FILE})"

      echo "Published ${PACKAGE_NAME} ${VERSION}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Publish Rust crate to GitLab registry
.release-publish-crate:
  interruptible: false
  resource_group: release-publish
  stage: publish
  variables:
    CRATE_NAME: ""
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing ${CRATE_NAME} ${VERSION} to GitLab package registry..."

      cargo package -p ${CRATE_NAME} --allow-dirty

      CRATE_FILE="target/package/${CRATE_NAME}-${VERSION}.crate"
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file "$CRATE_FILE" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${CRATE_NAME}/${VERSION}/${CRATE_NAME}-${VERSION}.crate"

      echo "Published ${CRATE_NAME} ${VERSION}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# GitLab Release Creation
# ============================================================

# Create GitLab release with artifacts
.release-create:
  interruptible: false
  resource_group: release-publish
  stage: publish
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  tags:
    - docker
  variables:
    RELEASE_DESCRIPTION: ""
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: $RELEASE_DESCRIPTION
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Downstream Triggers
# ============================================================

# Trigger downstream repository pipeline
.release-trigger:
  interruptible: false
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Trigger multiple downstream repos (use with parallel matrix)
.release-trigger-multiple:
  interruptible: false
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "src/**/*"
        - "vauchi-platform/**/*"
