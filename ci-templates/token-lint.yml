# Token Lint Template
# Detects hardcoded visual values (hex colors, pixel sizes, dp/sp) that should use design tokens.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/token-lint.yml'
#
# Variables (set by consumer jobs):
#   TOKEN_LINT_PATHS:     Space-separated directories to scan (required)
#   TOKEN_LINT_GLOBS:     Space-separated file globs, e.g. "*.swift *.css" (required)
#   TOKEN_LINT_EXCLUDES:  Space-separated glob patterns to exclude (optional)

.token-lint-job:
  stage: lint
  image: alpine:latest
  before_script:
    - apk add --no-cache bash ripgrep >/dev/null 2>&1
  script:
    - |
      # Inline token lint scanner — detects hardcoded visual values
      set -euo pipefail

      rg_args=()
      for glob in $TOKEN_LINT_GLOBS; do
        rg_args+=(--glob "$glob")
      done

      # Default excludes
      for pat in '!**/tokens.json' '!**/tokens.css' '!**/themes.json' '!**/generated/**' \
                 '!**/tests/**' '!**/*_test.*' '!**/*_tests.*' '!**/*Test.*' '!**/*Tests.*' \
                 '!**/*spec.*' '!**/package-lock.json' '!**/Cargo.lock' \
                 '!**/__Snapshots__/**' '!**/snapshots/**' '!**/build/**' '!**/node_modules/**'; do
        rg_args+=(--glob "$pat")
      done

      for pat in ${TOKEN_LINT_EXCLUDES:-}; do
        rg_args+=(--glob "!$pat")
      done

      patterns=(
        '#[0-9a-fA-F]{3,8}\b'
        '[0-9]+px'
        '[0-9]+\.dp\b'
        '[0-9]+\.sp\b'
        '\.system\(size:\s*[0-9]'
      )

      search_paths=()
      for p in $TOKEN_LINT_PATHS; do
        search_paths+=("$p")
      done

      tmpfile=$(mktemp)
      trap 'rm -f "$tmpfile"' EXIT

      for pattern in "${patterns[@]}"; do
        rg --no-heading --line-number --with-filename \
          "${rg_args[@]}" -e "$pattern" \
          "${search_paths[@]}" 2>/dev/null || true
      done > "$tmpfile"

      # Filter out comment lines
      filtered=$(mktemp)
      trap 'rm -f "$tmpfile" "$filtered"' EXIT

      while IFS= read -r line; do
        source_line="${line#*:*:}"
        trimmed="${source_line#"${source_line%%[![:space:]]*}"}"
        case "$trimmed" in
          //*) continue ;;
          '#'*) continue ;;
          '/*'*) continue ;;
          '*'*) continue ;;
        esac
        echo "$line"
      done < "$tmpfile" | sort -u > "$filtered"

      count=$(wc -l < "$filtered" | tr -d ' ')
      files=0
      if [ "$count" -gt 0 ]; then
        cat "$filtered"
        files=$(cut -d: -f1 "$filtered" | sort -u | wc -l | tr -d ' ')
      fi

      echo ""
      echo "${count} design token violations in ${files} files"

      if [ "$count" -gt 0 ]; then exit 1; else exit 0; fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
