# Security Scanning Template
# GitLab Ultimate security scanning configuration
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/security.yml'
#
# Provides:
#   - GitLab Ultimate security templates (SAST, Dependency Scanning, Secret Detection)
#   - Rust-specific security jobs (cargo-audit, cargo-deny)
#   - Configured analyzer overrides for self-hosted runners
#
# NOT included (add directly if needed):
#   - Container-Scanning (only for repos that build Docker images)
#   - License-Scanning (removed in GitLab 17.0, use cargo-deny instead)

# GitLab Ultimate Templates
# Note: License-Scanning template was removed in GitLab 17.0
# Use cargo-deny for Rust license compliance instead
# Note: Container-Scanning not included here - only repos that build
# Docker images (e.g., relay) should include it directly
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # SAST Configuration
  SAST_EXCLUDED_PATHS: "target/, node_modules/, dist/, builds/, cache/, tmp/, tests/fixtures/"
  SAST_EXCLUDED_ANALYZERS: ""
  SAST_ANALYZER_IMAGE_TAG: "5"

  # Dependency Scanning
  DS_EXCLUDED_PATHS: "target/, node_modules/, builds/"
  DS_EXCLUDED_ANALYZERS: ""

  # Secret Detection
  SECRET_DETECTION_EXCLUDED_PATHS: "target/, node_modules/, builds/, cache/, tmp/"
  SECRET_DETECTION_HISTORIC_SCAN: "false"


# ============================================================
# GitLab Analyzer Overrides
# ============================================================

# Semgrep SAST analyzer - use Docker runner
# Runs on MRs, main branch, and scheduled pipelines.
# Repos needing language-specific change detection can override
# the rules locally (e.g., changes: ["**/*.kt"]).
semgrep-sast:
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Disable Gemnasium dependency scanning (use cargo-audit for Rust)
gemnasium-dependency_scanning:
  rules:
    - when: never

# Secret detection analyzer - use Docker runner
secret_detection:
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Rust Security Jobs
# ============================================================

# Rust security audit (cargo-audit)
.security-audit:
  stage: security
  script:
    - cargo audit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Rust license compliance (cargo-deny)
.security-licenses:
  stage: security
  script:
    - cargo deny check licenses
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"

# Rust ban check (cargo-deny)
.security-bans:
  stage: security
  script:
    - cargo deny check bans
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"

# Full cargo-deny check (all checks)
.security-deny:
  stage: security
  script:
    - cargo deny check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
