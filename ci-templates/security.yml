# Security Scanning Template (Rust repos)
# GitLab Ultimate security scanning + Rust-specific security tools
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/security.yml'
#
# Provides:
#   - GitLab Ultimate templates: SAST (Semgrep), Secret Detection
#   - Rust-specific security jobs (cargo-audit, cargo-deny, cargo-vet)
#   - Configured analyzer overrides for self-hosted runners
#   - .security-audit-job: Ready-to-use cargo-audit job (extend with runner)
#   - .security-deny-job: Ready-to-use cargo-deny job (extend with runner)
#   - .security-vet-job: Ready-to-use cargo-vet supply chain audit job (extend with runner)
#   - .allow-git-drift-job: deny.toml git sources match policy/allowed-git-sources.txt
#
# NOT included (language-specific, add directly if needed):
#   - Dependency-Scanning: Gemnasium does not support Cargo/Rust.
#     Use cargo-audit + cargo-deny instead. Android includes it directly.
#   - Container-Scanning: Only for repos that build Docker images (relay).
#   - License-Scanning: Removed in GitLab 17.0. Use cargo-deny check licenses.
#
# Push-based secret detection is enabled at group level in GitLab settings:
#   Settings > Security & Compliance > Secret Detection > Push Protection
# This blocks secrets at push time (before they reach the server), complementing
# the pipeline-based detection configured below.

# GitLab Ultimate Templates
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: '/ci-templates/verified-fetch.yml'

variables:
  # SAST Configuration
  SAST_EXCLUDED_PATHS: "target/, node_modules/, dist/, builds/, cache/, tmp/, tests/fixtures/"
  SAST_EXCLUDED_ANALYZERS: ""
  SAST_ANALYZER_IMAGE_TAG: "5"
  # semgrep's default 5 s per rule and file is charged the file's parse time
  # too, so a busy shared runner tripped it on core's 1968-line rekey.rs
  # (core!1643) where a local run of every rule takes 1.2 s. The severity gate
  # still blocks any timeout, so a rule that really hangs is still caught;
  # this only lifts the ceiling above scheduling noise. Max-target-bytes is
  # restated because this variable replaces the analyzer's default whole.
  SAST_SCANNER_ALLOWED_CLI_OPTS: "--max-target-bytes=1000000 --timeout=30"

  # Secret Detection
  SECRET_DETECTION_EXCLUDED_PATHS: "target/, node_modules/, builds/, cache/, tmp/"
  SECRET_DETECTION_HISTORIC_SCAN: "false"


# ============================================================
# GitLab Analyzer Overrides
# ============================================================

# Semgrep SAST analyzer - use Docker runner
# Runs on MRs, main branch, and scheduled pipelines.
# Repos needing language-specific change detection can override
# the rules locally (e.g., changes: ["**/*.kt"]).
semgrep-sast:
  tags: [docker]
  allow_failure: false
  # Publish semgrep.sarif alongside the GitLab report. The report carries
  # findings but not the analyzer's own notifications, so the severity gate
  # could not see that a rule gave up on a file (core!1551 printed "no SARIF
  # at semgrep.sarif" on a green run); semgrep records that in SARIF under
  # runs[].invocations[].toolExecutionNotifications.
  #
  # Overriding `artifacts` REPLACES the upstream block, so both existing
  # uploads are re-listed. The upstream job uploads gl-sast-report.json twice
  # — once as "archive" (paths) and once as "sast" (reports) — verified in
  # the job log, not assumed. Dropping either would silently stop findings
  # reaching the security dashboard.
  artifacts:
    paths:
      - gl-sast-report.json
      - semgrep.sarif
    reports:
      sast: gl-sast-report.json
  # Self-heal transient SAST failures (analyzer image / ruleset download,
  # registry hiccups). semgrep is deterministic on fixed source, so a real
  # finding fails every attempt — retry cannot mask it. Overriding retry
  # REPLACES the rust-base default, so the infra conditions are re-listed.
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
  rules:
    # Skip on triggered pipelines (downstream verification checks compatibility, not security)
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Secret detection analyzer - use Docker runner
secret_detection:
  tags: [docker]
  allow_failure: false
  rules:
    # Skip on triggered pipelines (downstream verification checks compatibility, not security)
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# GitLab analyzers report vulnerabilities without failing their process.
# Consumers opt in after clearing existing Critical debt, then inherit a
# blocking policy decision from this job rather than analyzer exit status.
.security-sast-severity-gate:
  extends: .verified-fetch-script
  stage: security
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  interruptible: false
  allow_failure: false
  needs:
    - job: semgrep-sast
      artifacts: true
  variables:
    FETCH_SCRIPT_PATH: "scripts/ci/check-sast-severity.py"
    FETCH_SCRIPT_OUTPUT: "check-sast-severity.py"
    FETCH_SCRIPT_SHA256: "5ae3bbc672a1a63d600e92ea726e3129a08ae6dfe25ed8edbff15c0cd829f061"
  before_script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache curl python3 >/dev/null && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
    - !reference [.verified-fetch-script, before_script]
  script:
    - python3 check-sast-severity.py gl-sast-report.json semgrep.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ============================================================
# Rust Security Jobs
# ============================================================

# Rust security audit (cargo-audit)
#
# --deny warnings is deliberate. Plain `cargo audit` exits 0 on
# `unsound`, `unmaintained` and `yanked` advisories, which is how
# RUSTSEC-2026-0253 (unsound lru, use-after-free in LruCache::pop) sat
# in four consumers' lockfiles without a single red pipeline — the one
# repo that caught it, web-demo, was also the only one passing this
# flag. An advisory nobody is told about is not a check.
#
# Per-repo exceptions go in AUDIT_IGNORES as `--ignore RUSTSEC-…`
# flags, next to a comment naming the record and the exit condition.
# Set it in the repo's top-level `variables:` so the RC-tag audit
# (.rc-security-audit) inherits the same list; unset means none.
.security-audit:
  stage: security
  script:
    - cargo audit --deny warnings ${AUDIT_IGNORES:-}

# Rust license compliance (cargo-deny)
.security-licenses:
  stage: security
  script:
    - cargo deny check licenses
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"

# Rust ban check (cargo-deny)
.security-bans:
  stage: security
  script:
    - cargo deny check bans
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "deny.toml"

# Full cargo-deny check (all checks)
.security-deny:
  stage: security
  script:
    - cargo deny check

# ============================================================
# Ready-to-Use Security Jobs
# ============================================================
# Complete job templates with tool installation and rules.
# Extend with a runner template (e.g. .rust-runner-readonly).
#
# Example:
#   security:audit:
#     extends: [.rust-runner-readonly, .security-audit-job]
#   security:deny:
#     extends: [.rust-runner-readonly, .security-deny-job]

# cargo-audit with auto-install (MR dependency changes + main + schedule)
#
# The dependency-change rule alone cannot see a NEW advisory published
# against an UNCHANGED lockfile, which is the normal way advisories
# arrive. main and schedule are what make this a standing check rather
# than a review-time one; web-demo already carried all three and was
# the only repo where RUSTSEC-2026-0253 ever surfaced.
.security-audit-job:
  extends: [.security-audit, .timeout-quick]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-audit >/dev/null 2>&1 || cargo binstall cargo-audit --no-confirm 2>/dev/null || true

# cargo-deny with auto-install (MR + scheduled)
# No compilation needed — starts immediately (needs:[]) in lint stage for fast feedback
.security-deny-job:
  extends: [.security-deny, .timeout-quick]
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-deny >/dev/null 2>&1 || cargo binstall cargo-deny --no-confirm 2>/dev/null || true

# cargo-deny's git sources match the reviewed list (vauchi/private#1162).
# Every deny.toml in the repository allows exactly the sources in
# policy/allowed-git-sources.txt, so a git source Core starts to take is
# already allowed in every consumer when its bump MR opens. Pure Python,
# no cargo: runs in seconds on every MR, main and schedule.
.allow-git-drift-job:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends curl ca-certificates
    - mkdir -p .allow-git
    - |
      for file in scripts/check-allow-git.py policy/allowed-git-sources.txt; do
        encoded=$(printf '%s' "$file" | sed 's|/|%2F|g')
        status=$(curl --silent --show-error -o ".allow-git/$(basename "$file")" -w '%{http_code}' \
          "${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/${encoded}/raw?ref=${VAUCHI_SCRIPTS_REF:-main}") || status=000
        [ "$status" = 200 ] || { echo "ERROR: fetching $file -> HTTP $status"; exit 1; }
      done
  script:
    - |
      deny_files=$(find . -name deny.toml -not -path './target/*' -not -path './.allow-git/*' | sort)
      [ -n "$deny_files" ] || { echo "ERROR: no deny.toml in this repository"; exit 1; }
      # shellcheck disable=SC2086 # one path per word is the point
      python3 .allow-git/check-allow-git.py deny --list .allow-git/allowed-git-sources.txt $deny_files
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# cargo-vet supply chain verification (MR dependency changes + main + scheduled)
# Checks that all dependencies are either audited, trusted, or explicitly exempted.
# Repos must have a supply-chain/ directory (created by `cargo vet init`).
# No compilation needed — starts immediately (needs:[]) in lint stage for fast feedback
.security-vet-job:
  extends: .timeout-quick
  stage: lint
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
        - "supply-chain/**"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
    - command -v cargo-vet >/dev/null 2>&1 || cargo binstall cargo-vet --no-confirm 2>/dev/null || true
  script:
    # Use committed Cargo.lock — never regenerate, as newer versions may lack exemptions
    - cargo vet --locked

# cargo-vet with auto-fix on main (creates MR for transitive dep bumps)
# Repos override script to pass --regenerate-lockfile if they use path overrides.
# Requires PROJECT_ACCESS_TOKEN CI variable (group-level, same as release.yml and plan-sync.yml).
.security-vet-autofix-job:
  extends: .security-vet-job
  interruptible: false  # Must complete push+MR creation
  resource_group: vet-autofix-push
  script:
    - fetch_vauchi_script scripts/ci/vet-autofix.sh vet-autofix.sh
    - ./vet-autofix.sh
