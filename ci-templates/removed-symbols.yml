# Removed Symbols Check Template
# Detects stale references to features removed from vauchi-core.
# Catches references in docs, tests, configs, comments, and headers
# that the Rust compiler can't see.
#
# The manifest (removed-symbols.txt) is fetched from the vauchi/vauchi
# root repo via the GitLab API.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/removed-symbols.yml'
#
# Provides:
#   - .removed-symbols-job: Grep-based stale reference detection
#
# Variables (set by consumer jobs):
#   SEARCH_DIRS:  Space-separated list of directories to scan (default: "src/ tests/")

.removed-symbols-job:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  # Retry on runner system failures — primarily transient 404s from the
  # GitLab dependency proxy (observed 2026-04-22: windows main 19/20 red
  # with failure_reason=runner_system_failure from failed image pull).
  # Only retries on system-level failures, never on script failures.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    SEARCH_DIRS: "src/ tests/"
    # Root repo project ID (vauchi/vauchi)
    ROOT_PROJECT_ID: "77851901"
  script:
    - |
      set -euo pipefail

      # Fetch removed-symbols.txt from root repo (busybox wget — no apk install)
      MANIFEST=$(wget -qO- \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${ROOT_PROJECT_ID}/repository/files/removed-symbols.txt/raw?ref=main" \
        2>/dev/null || echo "")

      # wget (unlike curl -sf) exits 0 on HTTP 4xx/5xx and returns the
      # error body.  Detect JSON/HTML error responses so a misconfigured
      # CI_JOB_TOKEN doesn't silently produce a passing check.
      if [ -z "$MANIFEST" ] || printf '%s' "$MANIFEST" | grep -qE '^[{<]'; then
        echo "No removed-symbols.txt in root repo (empty or API error) — skipping check"
        exit 0
      fi

      # Strip comments and blank lines
      symbols=$(echo "$MANIFEST" | grep -v '^[[:space:]]*#' | grep -v '^[[:space:]]*$' | sed 's/[[:space:]]*#.*//' | tr -d '"' || true)

      if [ -z "$symbols" ]; then
        echo "Manifest is empty — nothing to check"
        exit 0
      fi

      # Validate search directories
      # shellcheck disable=SC2086
      search_dirs=""
      for d in ${SEARCH_DIRS}; do
        [ -d "$d" ] && search_dirs="$search_dirs $d"
      done

      if [ -z "$search_dirs" ]; then
        echo "No search directories found — skipping"
        exit 0
      fi

      # Write symbols to temp file for single-pass grep -f
      sym_file=$(mktemp)
      trap 'rm -f "$sym_file"' EXIT
      printf '%s\n' "$symbols" > "$sym_file"

      # Build find extension filter
      # (busybox grep lacks --include; use find for file filtering)
      # shellcheck disable=SC2086
      stale_files=$(find $search_dirs -type f \( \
        -name '*.rs' -o -name '*.cpp' -o -name '*.h' \
        -o -name '*.py' -o -name '*.md' -o -name '*.yml' \
        -o -name '*.yaml' -o -name '*.toml' -o -name '*.json' \
        -o -name '*.sh' -o -name '*.txt' \) \
        -exec grep -lFf "$sym_file" {} + 2>/dev/null || true)

      if [ -z "$stale_files" ]; then
        echo "OK: No stale references to removed symbols"
        exit 0
      fi

      # Detailed per-symbol report (only on failure — rare path)
      errors=0
      while IFS= read -r symbol; do
        [ -z "$symbol" ] && continue
        # shellcheck disable=SC2086
        sym_matches=$(find $search_dirs -type f \( \
          -name '*.rs' -o -name '*.cpp' -o -name '*.h' \
          -o -name '*.py' -o -name '*.md' -o -name '*.yml' \
          -o -name '*.yaml' -o -name '*.toml' -o -name '*.json' \
          -o -name '*.sh' -o -name '*.txt' \) \
          -exec grep -lF "$symbol" {} + 2>/dev/null || true)

        if [ -n "$sym_matches" ]; then
          echo "STALE REFERENCE: '$symbol' found in:"
          printf '%s\n' "$sym_matches" | while IFS= read -r m; do printf '  %s\n' "$m"; done
          errors=$((errors + 1))
        fi
      done < "$sym_file"

      if [ "$errors" -eq 0 ]; then
        echo "OK: No stale references to removed symbols"
        exit 0
      else
        echo ""
        echo "FAILED: $errors removed symbol(s) still referenced"
        echo "Update the listed files or check removed-symbols.txt in vauchi/vauchi."
        exit 1
      fi
