# VRT Upload Template
# Uploads screenshots to Visual Regression Tracker after snapshot tests.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/vrt-upload.yml'
#
# Provides:
#   - .vrt-upload-script: Reusable script block for after_script
#
# Variables (set by consumer jobs):
#   VRT_PLATFORM:        Platform label (ios, macos, android, web-demo)
#   VRT_SCREENSHOT_DIR:  Directory containing *.png files
#
# Variables (set at group level):
#   VRT_API_KEY:         Project API key (masked)
#
# Example:
#   test:snapshots:
#     extends: [.macos-job]
#     script:
#       - ... run tests ...
#     after_script:
#       - !reference [.vrt-upload-script, script]

.vrt-upload-script:
  script:
    - |
      if [ -n "${VRT_API_KEY:-}" ]; then
        # Consumers reference this block from `after_script`, which GitLab runs
        # in a FRESH shell — so a `fetch_vauchi_script` defined by a base
        # `before_script` is NOT in scope here. Define it when absent (mirrors
        # rust-base.yml; project 77957857 = vauchi/scripts) so every VRT
        # consumer uploads without needing its own inline copy.
        if ! command -v fetch_vauchi_script >/dev/null 2>&1; then
          fetch_vauchi_script() {
            local src_path="$1" dest="$2"
            local encoded_path
            encoded_path=$(printf '%s' "$src_path" | sed 's|/|%2F|g')
            curl -fsSL -u "gitlab-ci-token:${CI_JOB_TOKEN}" \
              "${CI_API_V4_URL}/projects/77957857/repository/files/${encoded_path}/raw?ref=${VAUCHI_SCRIPTS_REF}" \
              -o "$dest"
            chmod +x "$dest"
          }
        fi
        # vrt-upload.sh parses every API answer with jq, which some job
        # images lack (web-demo's Playwright image, vauchi/private#564).
        # Best effort: if neither package manager works the script names it.
        if ! command -v jq >/dev/null 2>&1; then
          { apt-get update -qq && apt-get install -y -qq jq; } >/dev/null 2>&1 \
            || apk add --no-cache jq >/dev/null 2>&1 \
            || echo "[vrt] could not install jq"
        fi
        fetch_vauchi_script scripts/ci/vrt-upload.sh vrt-upload.sh
        VRT_API_URL="${VRT_API_URL:-https://vrt.vauchi.app}" \
        VRT_PROJECT="${VRT_PROJECT:-vauchi}" \
        VRT_BRANCH="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-${CI_COMMIT_REF_NAME}}" \
        VRT_CI_BUILD_ID="${CI_PIPELINE_ID}" \
        ./vrt-upload.sh || echo "[vrt] Upload failed (advisory)"
      fi

# PowerShell twin for Windows shell runners (executor shell pwsh), where the
# block above fails to parse: it is POSIX sh, and pam has neither bash on
# PATH nor jq (vauchi/private#592). Same contract: advisory, never fails
# the job.
#
# Usage (windows):
#   after_script:
#     - !reference [.vrt-upload-script-pwsh, script]
.vrt-upload-script-pwsh:
  script:
    - |
      if ($env:VRT_API_KEY) {
        try {
          $uri = "$env:CI_API_V4_URL/projects/77957857/repository/files/scripts%2Fci%2Fvrt-upload.ps1/raw?ref=$env:VAUCHI_SCRIPTS_REF"
          Invoke-WebRequest -Headers @{ 'JOB-TOKEN' = $env:CI_JOB_TOKEN } -Uri $uri -OutFile vrt-upload.ps1 -ErrorAction Stop
          if (-not $env:VRT_API_URL) { $env:VRT_API_URL = 'https://vrt.vauchi.app' }
          if (-not $env:VRT_PROJECT) { $env:VRT_PROJECT = 'vauchi' }
          $env:VRT_BRANCH = if ($env:CI_MERGE_REQUEST_SOURCE_BRANCH_NAME) { $env:CI_MERGE_REQUEST_SOURCE_BRANCH_NAME } else { $env:CI_COMMIT_REF_NAME }
          $env:VRT_CI_BUILD_ID = $env:CI_PIPELINE_ID
          & ./vrt-upload.ps1
        } catch {
          Write-Host "[vrt] Upload failed (advisory): $($_.Exception.Message)"
        }
      }
