# Verified tool-install anchors for external binaries downloaded in CI.
# Every download is pinned by version and SHA-256.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: ci-templates-v2026.07.2
#       file: '/ci-templates/tool-install.yml'
#
#   my_job:
#     before_script:
#       - !reference [.install-k6, before_script]
#     script:
#       - k6 run ...

.install-k6:
  before_script:
    - |
      set -euo pipefail
      K6_VERSION="0.56.0"
      K6_SHA256="f90877b2721dbc607853ff785433c9a471e5aafdee788e78f6c833413541d649"
      if command -v k6 >/dev/null 2>&1; then
        echo "k6 already installed"
        exit 0
      fi
      TMP_DIR=$(mktemp -d)
      trap 'rm -rf "$TMP_DIR"' EXIT
      curl -fsSL "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
        -o "$TMP_DIR/k6.tar.gz"
      printf '%s  %s\n' "$K6_SHA256" "$TMP_DIR/k6.tar.gz" | sha256sum -c -
      tar xz --strip-components=1 -C /usr/local/bin "k6-v${K6_VERSION}-linux-amd64/k6" -f "$TMP_DIR/k6.tar.gz"
      command -v k6 >/dev/null 2>&1

.install-bitwarden-cli:
  before_script:
    - |
      set -euo pipefail
      BW_VERSION="2025.12.0"
      BW_SHA256="0a5ea0c81aedae91f29a5a316d01c73af4a7275db4fad56d069eb90e28b1c55f"
      if command -v bw >/dev/null 2>&1; then
        echo "bw already installed"
        exit 0
      fi
      TMP_DIR=$(mktemp -d)
      trap 'rm -rf "$TMP_DIR"' EXIT
      curl -fsSL "https://github.com/bitwarden/clients/releases/download/cli-v${BW_VERSION}/bw-linux-${BW_VERSION}.zip" \
        -o "$TMP_DIR/bw.zip"
      printf '%s  %s\n' "$BW_SHA256" "$TMP_DIR/bw.zip" | sha256sum -c -
      unzip -q "$TMP_DIR/bw.zip" -d /usr/local/bin
      chmod +x /usr/local/bin/bw
      command -v bw >/dev/null 2>&1

.install-infisical-cli:
  before_script:
    - |
      set -euo pipefail
      INFISICAL_VERSION="0.43.100"
      INFISICAL_SHA256="aeec395676ae8fe51fd00368a79da58e5a1aa3b21d50da65fdf445834be702ef"
      if command -v infisical >/dev/null 2>&1; then
        echo "infisical already installed"
        exit 0
      fi
      TMP_DIR=$(mktemp -d)
      trap 'rm -rf "$TMP_DIR"' EXIT
      curl -fsSL "https://github.com/Infisical/cli/releases/download/v${INFISICAL_VERSION}/cli_${INFISICAL_VERSION}_linux_amd64.tar.gz" \
        -o "$TMP_DIR/infisical.tar.gz"
      printf '%s  %s\n' "$INFISICAL_SHA256" "$TMP_DIR/infisical.tar.gz" | sha256sum -c -
      tar -xzf "$TMP_DIR/infisical.tar.gz" -C /usr/local/bin infisical
      chmod +x /usr/local/bin/infisical
      command -v infisical >/dev/null 2>&1

.install-cosign-windows:
  before_script:
    - |
      set -euo pipefail
      $COSIGN_VERSION = "v3.0.5"
      $COSIGN_SHA256 = "44e9e44202b67ddfaaf5ea1234f5a265417960c4ae98c5b57c35bc40ba9dd714"
      $TMP_DIR = New-Item -ItemType Directory -Path "$env:TEMP\cosign-install-$([Guid]::NewGuid())"
      try {
        curl.exe -fSL -o "$TMP_DIR\cosign.exe" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-windows-amd64.exe"
        $Actual = (Get-FileHash "$TMP_DIR\cosign.exe" -Algorithm SHA256).Hash
        if ($Actual -ne $COSIGN_SHA256) {
          Write-Error "cosign SHA-256 mismatch: expected $COSIGN_SHA256, got $Actual"
          exit 1
        }
        Move-Item -Force "$TMP_DIR\cosign.exe" "cosign.exe"
      } finally {
        Remove-Item -Recurse -Force $TMP_DIR
      }

# Lightweight Python 3 bootstrap for templates that need humble_check.py or
# other Python ratchets but may run on a minimal image. Exits early if python3
# is already present.
.install-python3:
  before_script:
    - |
      set -euo pipefail
      if command -v python3 >/dev/null 2>&1; then
        echo "python3 already available"
        exit 0
      fi
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -qq
        apt-get install -y --no-install-recommends python3
      elif command -v apk >/dev/null 2>&1; then
        # The Alpine CDN fails intermittently and a bare `apk add` turns
        # that into a red job for a check that never ran. Retry, and fail
        # loudly rather than continuing without the tools.
        for attempt in 1 2 3; do
            apk add --no-cache python3 && installed=yes && break
            echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
            sleep 5
        done
        if [ "${installed:-}" != yes ]; then
            echo "apk add failed after 3 attempts" >&2
            exit 1
        fi
      else
        echo "ERROR: cannot install python3 — no apt-get or apk found" >&2
        exit 1
      fi

.install-shellcheck:
  before_script:
    - |
      set -euo pipefail
      SHELLCHECK_VERSION="0.11.0"
      SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      if command -v shellcheck >/dev/null 2>&1; then
        echo "shellcheck already available"
        exit 0
      fi
      TMP_DIR=$(mktemp -d)
      trap 'rm -rf "$TMP_DIR"' EXIT
      curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
        -o "$TMP_DIR/shellcheck.tar.xz"
      printf '%s  %s\n' "$SHELLCHECK_SHA256" "$TMP_DIR/shellcheck.tar.xz" | sha256sum -c -
      tar -xJf "$TMP_DIR/shellcheck.tar.xz" -C "$TMP_DIR" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
      install -m 755 "$TMP_DIR/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
      command -v shellcheck >/dev/null 2>&1

# linuxdeploy and its GTK plugin, for AppImage packaging. The release and
# the plugin commit are pinned, not `continuous` and `master`. They go into
# the job's own directory because the shell runner's user cannot write
# /usr/local/bin (linux-gtk v0.6.0 tag pipeline, curl exit 23). Extract-and-
# run spares the runner FUSE, which an AppImage otherwise needs.
.install-linuxdeploy:
  variables:
    APPIMAGE_EXTRACT_AND_RUN: "1"
  before_script:
    - |
      set -euo pipefail
      LINUXDEPLOY_RELEASE="1-alpha-20251107-1"
      LINUXDEPLOY_SHA256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
      LINUXDEPLOY_GTK_COMMIT="3b67a1d1c1b0c8268f57f2bce40fe2d33d409cea"
      LINUXDEPLOY_GTK_SHA256="b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171"
      TOOLS_DIR="${CI_PROJECT_DIR}/.ci-tools/bin"
      mkdir -p "$TOOLS_DIR"
      fetch_verified() {
          url=$1
          out=$2
          sum=$3
          status=$(curl -sSL --retry 3 --retry-max-time 60 --max-time 120 \
              -o "$out" -w '%{http_code}' "$url") || status="000"
          if [ "$status" != "200" ]; then
              echo "ERROR: $url -> HTTP $status" >&2
              exit 1
          fi
          printf '%s  %s\n' "$sum" "$out" | sha256sum -c -
          chmod +x "$out"
      }
      fetch_verified \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_RELEASE}/linuxdeploy-x86_64.AppImage" \
          "$TOOLS_DIR/linuxdeploy" "$LINUXDEPLOY_SHA256"
      fetch_verified \
          "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${LINUXDEPLOY_GTK_COMMIT}/linuxdeploy-plugin-gtk.sh" \
          "$TOOLS_DIR/linuxdeploy-plugin-gtk.sh" "$LINUXDEPLOY_GTK_SHA256"
    - export PATH="${CI_PROJECT_DIR}/.ci-tools/bin:${PATH}"
    - command -v linuxdeploy
