# Shared, verified humble_check.py runner.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: ci-templates-v2026.07.2
#       file:
#         - '/ci-templates/verified-fetch.yml'
#         - '/ci-templates/tool-install.yml'
#         - '/ci-templates/cross-cutting-lint.yml'
#
#   lint:humble:
#     extends: .cross-cutting-lint
#     variables:
#       REPO_PATH: "${CI_PROJECT_DIR}"
#       CHECK_ARGS: ""
#       ARTIFACTS: ".ratchet-scripts/"
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.cross-cutting-lint:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  variables:
    REPO_PATH: "${CI_PROJECT_DIR}"
    CHECK_ARGS: ""
    ARTIFACTS: ".ratchet-scripts/"
  before_script:
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y --no-install-recommends curl coreutils
      mkdir -p .ratchet-scripts
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check.py"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check.py"
      export FETCH_SCRIPT_SHA256="39b99463f1eb789d128ea6801f04fcf58ea7a36d666e1e345715b1d40a4ee54b"
    - !reference [.verified-fetch-script, before_script]
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check_rules.json"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check_rules.json"
      export FETCH_SCRIPT_SHA256="0a4b119557251d096e6d98881369cbc4b7156fc34c1e95e7cc74014252b06c90"
    - !reference [.verified-fetch-script, before_script]
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check.baseline.json"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check.baseline.json"
      export FETCH_SCRIPT_SHA256="305d920ea854589756acd2c4bdce5608b68320876bec5216a0db1e6ecb364062"
    - !reference [.verified-fetch-script, before_script]
    - !reference [.install-python3, before_script]
  script:
    - |
      set -euo pipefail
      python3 .ratchet-scripts/humble_check.py \
        --repo "${CI_PROJECT_NAME}" \
        --repo-path "${REPO_PATH}" \
        --config .ratchet-scripts/humble_check_rules.json \
        --check .ratchet-scripts/humble_check.baseline.json \
        ${CHECK_ARGS}
  artifacts:
    paths:
      - "${ARTIFACTS}"
    when: on_failure
    expire_in: 1 week

# Exact-zero release gate (ADR-066).  MR ratchets let existing debt stay
# while it shrinks; a release tag may carry none, and TODO(HUMBLE) markers
# do not excuse it.  Consumers instantiate it as `release:ratchet-zero` and
# list it in the `needs:` of the job their publish jobs already wait on —
# publish jobs are DAG-ordered, so a failing gate outside that chain turns
# the pipeline red without stopping the publish.
.release-ratchet-zero:
  extends: .cross-cutting-lint
  interruptible: false
  variables:
    CHECK_ARGS: "--require-zero"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
