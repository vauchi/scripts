# Shared, verified humble_check.py runner.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: ci-templates-v2026.07.2
#       file:
#         - '/ci-templates/verified-fetch.yml'
#         - '/ci-templates/tool-install.yml'
#         - '/ci-templates/cross-cutting-lint.yml'
#
#   lint:humble:
#     extends: .cross-cutting-lint
#     variables:
#       REPO_PATH: "${CI_PROJECT_DIR}"
#       CHECK_ARGS: ""
#       ARTIFACTS: ".ratchet-scripts/"
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.cross-cutting-lint:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
  tags: [docker]
  needs: []
  allow_failure: false
  variables:
    REPO_PATH: "${CI_PROJECT_DIR}"
    CHECK_ARGS: ""
    ARTIFACTS: ".ratchet-scripts/"
  before_script:
    - |
      set -euo pipefail
      apt-get update -qq
      apt-get install -y --no-install-recommends curl coreutils
      mkdir -p .ratchet-scripts
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check.py"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check.py"
      export FETCH_SCRIPT_SHA256="d9d725bb9e93668c948074c59839bbad229951ca77a098fdb132793f3a939ff2"
    - !reference [.verified-fetch-script, before_script]
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check_rules.json"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check_rules.json"
      export FETCH_SCRIPT_SHA256="f68f1f5ff577e5f51d088633c624285c6ad2c313066e177a1102c13e927ff06e"
    - !reference [.verified-fetch-script, before_script]
    - |
      export FETCH_SCRIPT_PATH="scripts/humble_check.baseline.json"
      export FETCH_SCRIPT_OUTPUT=".ratchet-scripts/humble_check.baseline.json"
      export FETCH_SCRIPT_SHA256="bfe1db7cdea120a8df853db9f5a2bffed55eb32082287e33962b6fb5c078d94b"
    - !reference [.verified-fetch-script, before_script]
    - !reference [.install-python3, before_script]
  script:
    - |
      set -euo pipefail
      python3 .ratchet-scripts/humble_check.py \
        --repo "${CI_PROJECT_NAME}" \
        --repo-path "${REPO_PATH}" \
        --config .ratchet-scripts/humble_check_rules.json \
        --check .ratchet-scripts/humble_check.baseline.json \
        ${CHECK_ARGS}
  artifacts:
    paths:
      - "${ARTIFACTS}"
    when: on_failure
    expire_in: 1 week
