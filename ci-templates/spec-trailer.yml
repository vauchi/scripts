# VGT12 re-check: every feat:, fix: or refactor: commit of a merge request
# that touches a protocol path carries a Spec: trailer (vauchi/private#950).
#
# The commit-msg hook asks the same question locally; this job is what a
# commit made with --no-verify, in the web editor or by another tool still
# has to pass. Page: _private/docs/lint-errors/vgt12-spec-trailer.md
#
# Usage, in the repositories that have protocol paths (core, relay,
# ohttp-relay):
#   include:
#     - project: 'vauchi/scripts'
#       ref: ci-templates-vYYYY.MM.N
#       file: '/ci-templates/spec-trailer.yml'
#   variables:
#     SPEC_TRAILER_SCRIPTS_REF: ci-templates-vYYYY.MM.N   # the same tag
#
# Needs a `lint` stage. Reads only the merge request's own commits. Exit 2
# (git could not read the range) fails the job: a check that could not
# look has not passed.

lint:spec-trailer:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  timeout: 5m
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - apk add --no-cache bash git > /dev/null
    - |
      if [ "$CI_PROJECT_PATH" = "vauchi/scripts" ]; then
        ln -s "$CI_PROJECT_DIR" /tmp/vauchi-scripts
      else
        # The consumer pins this job's scripts with SPEC_TRAILER_SCRIPTS_REF
        # (the tag it includes this template from); its VAUCHI_SCRIPTS_REF
        # may be an older tag that has no checker yet.
        ref="${SPEC_TRAILER_SCRIPTS_REF:-${VAUCHI_SCRIPTS_REF:-main}}"
        git clone --quiet --depth=1 --branch "$ref" https://gitlab.com/vauchi/scripts.git /tmp/vauchi-scripts
      fi
      git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      base=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" HEAD)
      bash /tmp/vauchi-scripts/scripts/check-spec-trailer.sh --range "$base" HEAD "$CI_PROJECT_NAME"
