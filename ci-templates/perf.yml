# Build Performance Template
# Shared configuration for build performance CI jobs
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/perf.yml'
#
# Provides:
#   - .lint-duplicates-job: Detect duplicate dependencies (MR lint stage)
#   - .lint-machete-job: Detect unused dependencies (MR lint stage)
#   - .binary-size-tracking-job: Track release binary size via Pushgateway (main/tags)
#   - .mobile-size-tracking-job: Track APK/AAB/IPA size via Pushgateway (main/tags)
#   - .app-size-gate-job: Fail MR if app artifact exceeds size limit
#
# Consumer jobs must extend a runner template (.linux-runner, .rust-runner, etc.)
#
# Example:
#   lint:duplicates:
#     extends: [.lint-duplicates-job, .linux-runner-readonly]
#
#   perf:binary-size:
#     extends: [.binary-size-tracking-job, .linux-runner]
#     variables:
#       BINARY_SIZE_PACKAGES: "vauchi-core vauchi-platform"
#       BINARY_SIZE_REPO_LABEL: "core"

# ============================================================
# Duplicate Dependency Check (MR lint stage)
# ============================================================
# Detects multiple versions of the same crate in the dependency tree.
# Fast (~5s) — just parses Cargo.lock, no compilation needed.
# Runs on MRs when Cargo.toml or Cargo.lock changes.

.lint-duplicates-job:
  stage: lint
  needs: []
  allow_failure: true
  variables:
    DUPLICATES_THRESHOLD: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-duplicates >/dev/null 2>&1 || cargo binstall cargo-duplicates --no-confirm 2>/dev/null || true
  script:
    - |
      echo "=== Duplicate Dependency Check ==="
      OUTPUT=$(cargo duplicates 2>&1) || true

      if [ -z "$OUTPUT" ] || echo "$OUTPUT" | grep -q "no duplicates"; then
        echo "✓ No duplicate dependencies found"
        exit 0
      fi

      echo "$OUTPUT"

      # Count duplicate crate groups
      COUNT=$(echo "$OUTPUT" | grep -c "^[a-zA-Z]" || true)
      echo ""
      echo "Found $COUNT crate(s) with duplicate versions"

      if [ "$COUNT" -gt "${DUPLICATES_THRESHOLD}" ]; then
        echo "⚠ Exceeds threshold of ${DUPLICATES_THRESHOLD} — review dependency tree"
        echo "  Run locally: just perf-duplicates"
        # Advisory — don't fail the pipeline
      fi

# ============================================================
# Unused Dependency Check (MR lint stage)
# ============================================================
# Detects unused crate dependencies via cargo-machete.
# Fast (~10s) — uses heuristic analysis, no compilation needed.
# Runs on MRs when Cargo.toml or Cargo.lock changes.

.lint-machete-job:
  stage: lint
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v cargo-machete >/dev/null 2>&1 || cargo binstall cargo-machete --no-confirm 2>/dev/null || true
  script:
    - cargo machete

# ============================================================
# Binary Size Tracking (main merges + release tags)
# ============================================================
# Builds release binaries and pushes size metrics to Pushgateway
# for Grafana dashboards. Detects size regressions over time.
#
# Variables:
#   BINARY_SIZE_PACKAGES:   Space-separated list of -p flags (e.g. "vauchi-core vauchi-platform")
#   BINARY_SIZE_REPO_LABEL: Label for Pushgateway metrics (defaults to CI_PROJECT_NAME)
#   BINARY_SIZE_EXTRA_FLAGS: Additional cargo build flags

.binary-size-tracking-job:
  stage: test
  needs: []
  rules:
    # Skip MR pipelines (release build is too slow for per-push feedback)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Allow API-triggered pipelines when METRICS_REFRESH is set (manual dashboard refresh)
    - if: ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $METRICS_REFRESH == null
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $METRICS_REFRESH == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    BINARY_SIZE_PACKAGES: ""
    BINARY_SIZE_REPO_LABEL: ""
    BINARY_SIZE_EXTRA_FLAGS: ""
  script:
    - |
      echo "=== Binary Size Tracking ==="

      # Build release binaries
      PACKAGE_FLAGS=""
      for pkg in ${BINARY_SIZE_PACKAGES}; do
        PACKAGE_FLAGS="${PACKAGE_FLAGS} -p ${pkg}"
      done

      echo "Building release binaries... (${BINARY_SIZE_PACKAGES:-workspace})"
      cargo build --release ${PACKAGE_FLAGS} ${BINARY_SIZE_EXTRA_FLAGS}

      # Collect binary sizes
      REPO_LABEL="${BINARY_SIZE_REPO_LABEL:-${CI_PROJECT_NAME}}"
      METRICS_TEXT=""
      FOUND=false

      echo ""
      echo "Release binary sizes:"
      echo "─────────────────────"

      for bin in target/release/*; do
        # Skip non-executable files and build artifacts
        if [ ! -f "$bin" ] || [ ! -x "$bin" ]; then continue; fi
        case "$bin" in
          *.d|*.o|*.rmeta|*.so|*.dylib|*.rlib) continue ;;
          */build/*|*/deps/*|*/.fingerprint/*) continue ;;
        esac

        BIN_NAME=$(basename "$bin")

        # Skip test binaries and build scripts (noise in metrics)
        case "$BIN_NAME" in
          test-*|*_test|*_tests|test|tests|build-script-*) continue ;;
        esac
        SIZE_BYTES=$(stat -c%s "$bin" 2>/dev/null || stat -f%z "$bin" 2>/dev/null)
        SIZE_HUMAN=$(ls -lh "$bin" | awk '{print $5}')

        echo "  ${BIN_NAME}: ${SIZE_HUMAN} (${SIZE_BYTES} bytes)"
        METRICS_TEXT+="vauchi_eng_binary_size_bytes{repo=\"${REPO_LABEL}\",binary=\"${BIN_NAME}\"} ${SIZE_BYTES}"$'\n'
        FOUND=true
      done

      # Also check for library outputs (.so, .dylib, .a)
      for lib in target/release/*.{so,dylib,a} target/release/lib*.{so,dylib,a}; do
        if [ ! -f "$lib" ]; then continue; fi

        LIB_NAME=$(basename "$lib")
        SIZE_BYTES=$(stat -c%s "$lib" 2>/dev/null || stat -f%z "$lib" 2>/dev/null)
        SIZE_HUMAN=$(ls -lh "$lib" | awk '{print $5}')

        echo "  ${LIB_NAME}: ${SIZE_HUMAN} (${SIZE_BYTES} bytes)"
        METRICS_TEXT+="vauchi_eng_binary_size_bytes{repo=\"${REPO_LABEL}\",binary=\"${LIB_NAME}\"} ${SIZE_BYTES}"$'\n'
        FOUND=true
      done

      if ! $FOUND; then
        echo "  (no release binaries found)"
        exit 0
      fi

      echo ""

      # Push via shared helper (tries: direct URL → full SSH → restricted SSH)
      if [ -z "$METRICS_TEXT" ]; then
        echo "No metrics to push"
        exit 0
      fi

      if fetch_vauchi_script scripts/ci/setup-ssh-pushgateway.sh /tmp/setup-ssh-pushgateway.sh 2>/dev/null; then
        # shellcheck source=/dev/null
        source /tmp/setup-ssh-pushgateway.sh
        setup_ssh_pushgateway
        if pushgateway_push "$METRICS_TEXT" "/metrics/job/vauchi_binary_size/repo/${REPO_LABEL}"; then
          echo "✓ Binary size metrics pushed for ${REPO_LABEL} (${PUSHGATEWAY_SSH_MODE:-direct})"
        else
          echo "⚠ Pushgateway push failed (non-fatal) — metrics logged above"
        fi
      else
        echo "⚠ Could not download pushgateway helper — metrics not pushed"
        echo "  Binary sizes logged above for manual review"
      fi

# ============================================================
# Mobile App Size Tracking (main merges + release tags)
# ============================================================
# Measures APK/AAB/IPA sizes from a configurable directory and
# pushes metrics to Pushgateway for Grafana dashboards.
# Follows the same SSH/HTTP push pattern as .binary-size-tracking-job.
#
# Variables:
#   MOBILE_SIZE_ARTIFACT_DIR: Directory containing mobile artifacts (required)
#   MOBILE_SIZE_PLATFORM:     "android" or "ios" (required)
#   MOBILE_SIZE_FORMAT:       "apk", "aab", or "ipa" (required)

.mobile-size-tracking-job:
  stage: test
  needs: []
  rules:
    # Skip MR pipelines (tracking runs on main/tags only)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Allow API-triggered pipelines when METRICS_REFRESH is set (manual dashboard refresh)
    - if: ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $METRICS_REFRESH == null
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $METRICS_REFRESH == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    MOBILE_SIZE_ARTIFACT_DIR: ""
    MOBILE_SIZE_PLATFORM: ""
    MOBILE_SIZE_FORMAT: ""
  script:
    - |
      echo "=== Mobile App Size Tracking ==="

      if [ -z "${MOBILE_SIZE_ARTIFACT_DIR}" ]; then
        echo "ERROR: MOBILE_SIZE_ARTIFACT_DIR is not set"
        exit 1
      fi
      if [ -z "${MOBILE_SIZE_PLATFORM}" ]; then
        echo "ERROR: MOBILE_SIZE_PLATFORM is not set"
        exit 1
      fi
      if [ -z "${MOBILE_SIZE_FORMAT}" ]; then
        echo "ERROR: MOBILE_SIZE_FORMAT is not set"
        exit 1
      fi

      if [ ! -d "${MOBILE_SIZE_ARTIFACT_DIR}" ]; then
        echo "ERROR: Directory ${MOBILE_SIZE_ARTIFACT_DIR} does not exist"
        exit 1
      fi

      METRICS_TEXT=""
      FOUND=false

      echo ""
      echo "Mobile artifact sizes (${MOBILE_SIZE_PLATFORM}/${MOBILE_SIZE_FORMAT}):"
      echo "─────────────────────"

      for artifact in "${MOBILE_SIZE_ARTIFACT_DIR}"/*.${MOBILE_SIZE_FORMAT}; do
        if [ ! -f "$artifact" ]; then continue; fi

        ARTIFACT_NAME=$(basename "$artifact")
        SIZE_BYTES=$(stat -c%s "$artifact" 2>/dev/null || stat -f%z "$artifact" 2>/dev/null)
        SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES} / 1048576}")

        echo "  ${ARTIFACT_NAME}: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
        METRICS_TEXT+="vauchi_eng_app_size_bytes{platform=\"${MOBILE_SIZE_PLATFORM}\",format=\"${MOBILE_SIZE_FORMAT}\",artifact=\"${ARTIFACT_NAME}\"} ${SIZE_BYTES}"$'\n'
        FOUND=true
      done

      if ! $FOUND; then
        echo "  (no .${MOBILE_SIZE_FORMAT} artifacts found in ${MOBILE_SIZE_ARTIFACT_DIR})"
        exit 0
      fi

      echo ""

      # Push via shared helper (tries: direct URL → full SSH → restricted SSH)
      if [ -z "$METRICS_TEXT" ]; then
        echo "No metrics to push"
        exit 0
      fi

      PUSH_JOB="vauchi_app_size"
      # Pushgateway forced-command allowlist requires single-segment label
      # values per `/key/value/key/value/...`; "android/apk" would split.
      # Encode platform+format as one segment so the restricted-key path
      # accepts it (matches push-proxy.sh regex `[a-z0-9_.-]+`).
      PUSH_INSTANCE="${MOBILE_SIZE_PLATFORM}_${MOBILE_SIZE_FORMAT}"

      if fetch_vauchi_script scripts/ci/setup-ssh-pushgateway.sh /tmp/setup-ssh-pushgateway.sh 2>/dev/null; then
        # shellcheck source=/dev/null
        source /tmp/setup-ssh-pushgateway.sh
        setup_ssh_pushgateway
        if pushgateway_push "$METRICS_TEXT" "/metrics/job/${PUSH_JOB}/instance/${PUSH_INSTANCE}"; then
          echo "✓ App size metrics pushed for ${PUSH_INSTANCE} (${PUSHGATEWAY_SSH_MODE:-direct})"
        else
          echo "⚠ Pushgateway push failed (non-fatal) — metrics logged above"
        fi
      else
        echo "⚠ Could not download pushgateway helper — metrics not pushed"
        echo "  App sizes logged above for manual review"
      fi

# ============================================================
# App Size Gate (MR pipelines)
# ============================================================
# Fails the pipeline if any mobile artifact exceeds a hard size limit.
# Warns (without failing) if an artifact exceeds a soft warning threshold.
# Consumers define their own rules: — this template has no rules: block.
#
# Variables:
#   APP_SIZE_GATE_DIR:       Directory containing artifacts to check (required)
#   APP_SIZE_GATE_FORMAT:    File extension to match — "apk", "aab", or "ipa" (required)
#   APP_SIZE_GATE_MAX_BYTES: Hard limit — pipeline fails if exceeded (required)
#   APP_SIZE_GATE_WARN_BYTES: Soft limit — warning if exceeded (optional, default: 0 = disabled)
#
# Example:
#   gate:app-size:
#     extends: [.app-size-gate-job, .linux-runner-readonly]
#     variables:
#       APP_SIZE_GATE_DIR: "build/outputs/apk/release"
#       APP_SIZE_GATE_FORMAT: "apk"
#       APP_SIZE_GATE_MAX_BYTES: "41943040"   # 40 MB
#       APP_SIZE_GATE_WARN_BYTES: "36700160"  # 35 MB
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.app-size-gate-job:
  stage: test
  needs: []
  variables:
    APP_SIZE_GATE_DIR: ""
    APP_SIZE_GATE_FORMAT: ""
    APP_SIZE_GATE_MAX_BYTES: ""
    APP_SIZE_GATE_WARN_BYTES: "0"
  script:
    - |
      echo "=== App Size Gate ==="

      if [ -z "${APP_SIZE_GATE_DIR}" ]; then
        echo "ERROR: APP_SIZE_GATE_DIR is not set"
        exit 1
      fi
      if [ -z "${APP_SIZE_GATE_FORMAT}" ]; then
        echo "ERROR: APP_SIZE_GATE_FORMAT is not set"
        exit 1
      fi
      if [ -z "${APP_SIZE_GATE_MAX_BYTES}" ]; then
        echo "ERROR: APP_SIZE_GATE_MAX_BYTES is not set"
        exit 1
      fi

      if [ ! -d "${APP_SIZE_GATE_DIR}" ]; then
        echo "ERROR: Directory ${APP_SIZE_GATE_DIR} does not exist"
        exit 1
      fi

      MAX_MB=$(awk "BEGIN {printf \"%.2f\", ${APP_SIZE_GATE_MAX_BYTES} / 1048576}")
      WARN_MB=$(awk "BEGIN {printf \"%.2f\", ${APP_SIZE_GATE_WARN_BYTES} / 1048576}")

      echo "Hard limit:    ${MAX_MB} MB (${APP_SIZE_GATE_MAX_BYTES} bytes)"
      if [ "${APP_SIZE_GATE_WARN_BYTES}" != "0" ]; then
        echo "Warning limit: ${WARN_MB} MB (${APP_SIZE_GATE_WARN_BYTES} bytes)"
      fi
      echo ""

      FOUND=false
      FAILED=false
      WARNED=false

      for artifact in "${APP_SIZE_GATE_DIR}"/*.${APP_SIZE_GATE_FORMAT}; do
        if [ ! -f "$artifact" ]; then continue; fi

        ARTIFACT_NAME=$(basename "$artifact")
        SIZE_BYTES=$(stat -c%s "$artifact" 2>/dev/null || stat -f%z "$artifact" 2>/dev/null)
        SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES} / 1048576}")
        FOUND=true

        if [ "${SIZE_BYTES}" -gt "${APP_SIZE_GATE_MAX_BYTES}" ]; then
          echo "✗ FAIL  ${ARTIFACT_NAME}: ${SIZE_MB} MB (${SIZE_BYTES} bytes) — exceeds ${MAX_MB} MB limit"
          FAILED=true
        elif [ "${APP_SIZE_GATE_WARN_BYTES}" != "0" ] && [ "${SIZE_BYTES}" -gt "${APP_SIZE_GATE_WARN_BYTES}" ]; then
          echo "⚠ WARN  ${ARTIFACT_NAME}: ${SIZE_MB} MB (${SIZE_BYTES} bytes) — exceeds ${WARN_MB} MB warning"
          WARNED=true
        else
          echo "✓ OK    ${ARTIFACT_NAME}: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
        fi
      done

      if ! $FOUND; then
        echo "(no .${APP_SIZE_GATE_FORMAT} artifacts found in ${APP_SIZE_GATE_DIR})"
        exit 0
      fi

      echo ""

      if $FAILED; then
        echo "FAILED: One or more artifacts exceed the size limit of ${MAX_MB} MB"
        exit 1
      fi

      if $WARNED; then
        echo "WARNING: One or more artifacts exceed the warning threshold of ${WARN_MB} MB"
        echo "  Consider optimizing before the hard limit is reached"
      fi

      echo "All artifacts within size limits"
