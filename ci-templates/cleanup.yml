# Prerelease Cleanup Template
#
# Scheduled job that deletes stale dev/rc/alpha/beta tags and packages
# across all vauchi repos. Runs weekly, retains last 14 days.
#
# Prerequisites:
#   - CLEANUP_TOKEN CI variable (api scope, group-level) or CI_JOB_TOKEN
#     with cross-project access
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/cleanup.yml'
#
# Provides:
#   - .cleanup-prerelease: Hidden job for scheduled tag/package cleanup

.cleanup-prerelease:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.12-slim
  tags: [docker]
  needs: []
  variables:
    RETENTION_DAYS: "14"
  before_script:
    - apt-get update -qq && apt-get install -yqq curl >/dev/null
  script:
    - |
      export GITLAB_TOKEN="${CLEANUP_TOKEN:-${CI_JOB_TOKEN}}"
      fetch_vauchi_script scripts/cleanup-prerelease.sh /tmp/cleanup.sh
      /tmp/cleanup.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CLEANUP_PRERELEASE == "true"
