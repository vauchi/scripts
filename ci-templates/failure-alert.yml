# Reusable failure alerting for jobs whose failure would otherwise be silent.
#
# Why this exists: a job marked `allow_failure: true`, or one whose failure is
# collateral to another job, leaves no usable signal. The pipeline reports
# green and the log goes unread. core `v0.59.1` published a tag with no mobile
# bindings behind it because `trigger:windows` failed at the very end, and the
# identical failure on `v0.59.0` sat unnoticed for an entire release.
#
# Pipeline-email does not cover this: it is branch-scoped (release pipelines
# run on tag refs) and fires on pipeline status, which `allow_failure: true`
# keeps green by design.
#
# Compose it into a job's existing `after_script` with `!reference`. Do NOT
# use `extends:` — that REPLACES the job's own `after_script`, and the shared
# runner classes already define one:
#
#   after_script:
#     - !reference [.rust-base, after_script]
#     - !reference [.failure-alert, after_script]
#
# `CI_ALERT_TOKEN` needs `api` scope. `CI_JOB_TOKEN` is NOT sufficient — it
# cannot create issues, the same limit that produced the original 403 when
# `trigger:windows` tried to open a merge request. Without the token the
# banner still prints, so the failure stays greppable in the job log rather
# than disappearing entirely.
.failure-alert:
  after_script:
    - |
      if [ "${CI_JOB_STATUS:-success}" = "success" ]; then
        exit 0
      fi

      ALERT_TITLE="CI failure: ${CI_PROJECT_NAME}/${CI_JOB_NAME} (${CI_COMMIT_REF_NAME})"
      echo ""
      echo "=============================================================="
      echo "  FAILURE ALERT"
      echo "  project : ${CI_PROJECT_PATH}"
      echo "  job     : ${CI_JOB_NAME}  (${CI_JOB_URL})"
      echo "  ref     : ${CI_COMMIT_REF_NAME}"
      echo "  status  : ${CI_JOB_STATUS}"
      echo "=============================================================="
      echo ""

      if [ -z "${CI_ALERT_TOKEN:-}" ]; then
        echo "CI_ALERT_TOKEN unset — cannot file an issue, banner only."
        echo "Set a project/group access token with api scope to enable."
        exit 0
      fi

      # Re-use one open issue per job+ref instead of filing a duplicate on
      # every retry — an alert channel that spams gets muted, which is the
      # failure mode this template exists to prevent.
      ENCODED_TITLE=$(printf '%s' "$ALERT_TITLE" | sed 's/ /%20/g; s/:/%3A/g; s|/|%2F|g; s/(/%28/g; s/)/%29/g')
      EXISTING=$(curl -fsS --header "PRIVATE-TOKEN: ${CI_ALERT_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues?state=opened&search=${ENCODED_TITLE}&in=title" \
        2>/dev/null || printf '[]')

      EXISTING_IID=$(printf '%s' "$EXISTING" | sed -n 's/.*"iid":\([0-9]*\).*/\1/p' | head -1)

      ALERT_BODY="Job [\`${CI_JOB_NAME}\`](${CI_JOB_URL}) failed on \`${CI_COMMIT_REF_NAME}\` (commit ${CI_COMMIT_SHORT_SHA}), status \`${CI_JOB_STATUS}\`.

      This job does not fail its pipeline, so nothing else reports it. Filed by the shared \`.failure-alert\` template."

      if [ -n "$EXISTING_IID" ]; then
        curl -fsS --request POST \
          --header "PRIVATE-TOKEN: ${CI_ALERT_TOKEN}" \
          --data-urlencode "body=Recurred: ${CI_JOB_URL}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues/${EXISTING_IID}/notes" \
          >/dev/null 2>&1 \
          && echo "Recurrence noted on existing issue #${EXISTING_IID}." \
          || echo "WARNING: could not comment on issue #${EXISTING_IID}."
        exit 0
      fi

      curl -fsS --request POST \
        --header "PRIVATE-TOKEN: ${CI_ALERT_TOKEN}" \
        --data-urlencode "title=${ALERT_TITLE}" \
        --data-urlencode "description=${ALERT_BODY}" \
        --data-urlencode "labels=ci-failure" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues" \
        >/dev/null 2>&1 \
        && echo "Filed a CI failure issue." \
        || echo "WARNING: could not file a CI failure issue."
