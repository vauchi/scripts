# Documentation Linting Template
# Markdown and content validation for documentation repos
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/lint-docs.yml'
#
# Provides:
#   - check:doc-naming: Validate YYYY-MM-DD-name.md naming convention
#   - lint:markdown: Markdown syntax and style checking
#   - lint:links: Check for broken links (lychee)
#   - check:license-text: Catch wrong license references in prose
#   - lint:gherkin: Validate Gherkin feature files (for features repo)

stages:
  - lint

# ============================================================
# Documentation Naming Convention
# ============================================================

# Check that documentation files follow YYYY-MM-DD-name.md convention
check:doc-naming:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git curl
  script:
    - |
      # VDC05 — the check body lives in ONE place now:
      # ci-templates/check-doc-naming.sh. The previous four inline
      # copies (this job, _private helper, gate-push, pre-push)
      # drifted apart — 7 CI failures in the 2026-03..07 sample.
      # Local-checkout copy first (the scripts repo itself, and the
      # only way the script's own MR can test its changes); fetch from
      # scripts@main for consumer repos.
      if [ -f ci-templates/check-doc-naming.sh ]; then
        bash ci-templates/check-doc-naming.sh
      else
        if ! command -v fetch_vauchi_script >/dev/null 2>&1; then
          fetch_vauchi_script() {
            src_path="$1"; dest="$2"
            encoded_path=$(printf '%s' "$src_path" | sed 's|/|%2F|g')
            curl -fsSL -u "gitlab-ci-token:${CI_JOB_TOKEN}" \
              "${CI_API_V4_URL}/projects/77957857/repository/files/${encoded_path}/raw?ref=main" \
              -o "$dest"
            chmod +x "$dest"
          }
        fi
        fetch_vauchi_script ci-templates/check-doc-naming.sh check-doc-naming.sh
        bash check-doc-naming.sh
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Markdown Linting
# ============================================================

# Lint markdown files with markdownlint
# Uses self-hosted shell runner where markdownlint is pre-installed (< 5s)
# instead of Docker node:20-alpine + npm install (~30s overhead).
lint:markdown:
  stage: lint
  tags:
    - self-hosted
    - markdownlint
  needs: []
  timeout: 2m
  resource_group: markdown-lint
  variables:
    GIT_DEPTH: 0
  before_script:
    # Fetch the shared custom rules (backtick-path-exempt line length,
    # VDC01 no-abs-paths)
    - |
      RULE_FILE="/tmp/markdownlint-rule-line-length.js"
      fetch_vauchi_script ci-templates/markdownlint-rule-line-length.js "$RULE_FILE" 2>/dev/null || true
      ABS_RULE_FILE="/tmp/markdownlint-rule-no-abs-paths.js"
      fetch_vauchi_script ci-templates/markdownlint-rule-no-abs-paths.js "$ABS_RULE_FILE" 2>/dev/null || true
  script:
    - |
      # Build markdownlint args: use custom rules if available
      RULE_ARGS=""
      if [ -f /tmp/markdownlint-rule-line-length.js ]; then
        RULE_ARGS="-r /tmp/markdownlint-rule-line-length.js"
      fi
      if [ -f /tmp/markdownlint-rule-no-abs-paths.js ]; then
        RULE_ARGS="$RULE_ARGS -r /tmp/markdownlint-rule-no-abs-paths.js"
      fi

      # Lint only files changed in this MR (avoids pre-existing errors).
      # Falls back to full scan on non-MR pipelines.
      BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}}"
      if [ -n "$BASE" ]; then
        FILES=$(git diff --name-only "$BASE"...HEAD -- '*.md' | grep -v '^$' || true)
        if [ -z "$FILES" ]; then
          echo "No .md files changed — skipping"
          exit 0
        fi
        echo "Linting $(echo "$FILES" | wc -l) changed .md file(s):"
        echo "$FILES"
        echo "$FILES" | xargs markdownlint $RULE_ARGS
      else
        markdownlint $RULE_ARGS '**/*.md' --ignore node_modules --ignore target
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"

# ============================================================
# Private-reference check (VDC02)
# ============================================================

# _private is inaccessible to contributors; a public doc pointing into
# it is a dead link for every reader and leaks internal planning
# layout. Skipped in vauchi/private itself (self-references are fine).
# Page: _private/docs/lint-errors/vdc02-private-refs.md
check:no-private-refs:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      HITS=$(grep -rn '_private/' --include='*.md' . 2>/dev/null | grep -v '^\./\.git/' || true)
      if [ -n "$HITS" ]; then
        echo "$HITS"
        echo ""
        echo "VDC02: public docs reference _private/ paths — fix: inline the needed content or drop the pointer; _private cross-references belong only in _private."
        exit 1
      fi
      echo "No _private references in public docs."
  rules:
    - if: $CI_PROJECT_PATH == "vauchi/private"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Link Checking (lychee)
# ============================================================

# MR pipeline: check local file links only (fast, no network)
# Scheduled pipeline: check ALL links including external URLs (weekly)
# Uses lychee (Rust) — fast, single binary, good local file resolution

.lint-links-base:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache curl bash
    # Download to a file with fail-fast (-f) + retries so a transient GitHub
    # CDN error (e.g. 504) errors out and retries instead of piping an error
    # page into `tar` (which fails opaquely with "tar: invalid magic").
    - curl --fail --location --show-error --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-musl.tar.gz
    - tar xzf /tmp/lychee.tar.gz -C /usr/local/bin

lint:links:
  extends: .lint-links-base
  script:
    - |
      set -o pipefail
      lychee --offline --no-progress \
        --exclude-path node_modules \
        --exclude-path target \
        --exclude-path .git \
        '**/*.md' 2>&1 | sed 's/Excluded/External (checked weekly by lint:links-external)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"

lint:links-external:
  extends: .lint-links-base
  script:
    - |
      lychee --no-progress --max-retries 2 --timeout 30 \
        --exclude-path node_modules \
        --exclude-path target \
        --exclude-path .git \
        '**/*.md'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# ============================================================
# License Text Check
# ============================================================

# Catch wrong license references in prose (e.g., "licensed under MIT"
# when the project uses GPL-3.0-or-later). REUSE checks SPDX headers
# but not body text — this fills the gap.
check:license-text:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  before_script:
    - apk add --no-cache grep
  script:
    - |
      ERRORS=0

      # Check for patterns that indicate this project claims to be MIT-licensed
      # (not references to third-party MIT-licensed dependencies)
      for pattern in "licensed under MIT" "License: MIT"; do
        MATCHES=$(grep -rn --include="*.md" -i "$pattern" . \
          --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
          --exclude-dir=knowledge --exclude-dir=problems --exclude-dir=strategy 2>/dev/null \
          | grep -iv "catppuccin\|dracula\|nord\|solarized\|gruvbox\|third.party\|external\|dependency" || true)
        if [ -n "$MATCHES" ]; then
          echo "$MATCHES"
          echo "ERROR: Found wrong license reference: '$pattern'"
          ERRORS=$((ERRORS + 1))
        fi
      done

      if [ $ERRORS -gt 0 ]; then
        echo ""
        echo "Found $ERRORS wrong license reference(s) in documentation."
        echo "This project is licensed under GPL-3.0-or-later."
        exit 1
      fi

      echo "No wrong license references found."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Gherkin Linting (for features repo)
# ============================================================

# Validate Gherkin feature files
# Uses self-hosted shell runner with pre-installed Node.js.
# npm package still installed at runtime (not worth a global install for one job).
lint:gherkin:
  stage: lint
  tags:
    - self-hosted
    - node
  needs: []
  timeout: 2m
  resource_group: gherkin-lint
  before_script:
    - npm install --prefer-offline --no-audit --no-fund @cucumber/gherkin-utils
  script:
    - |
      if ls *.feature 1> /dev/null 2>&1 || ls **/*.feature 1> /dev/null 2>&1; then
        echo "Validating Gherkin feature files..."
        ERRORS=0
        for file in $(find . -name "*.feature" -type f); do
          echo "Checking: $file"
          npx gherkin-utils format "$file" > /dev/null 2>&1 || {
            echo "ERROR: Invalid Gherkin syntax in $file"
            ERRORS=$((ERRORS + 1))
          }
        done
        if [ $ERRORS -gt 0 ]; then
          echo "Found $ERRORS file(s) with Gherkin syntax errors."
          exit 1
        fi
        echo "Gherkin validation complete."
      else
        echo "No .feature files found."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.feature"

