# Documentation Linting Template
# Markdown and content validation for documentation repos
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/lint-docs.yml'
#
# Provides:
#   - check-doc-naming: Validate YYYY-MM-DD-name.md naming convention
#   - lint-markdown: Markdown syntax and style checking
#   - lint-links: Check for broken links (lychee)
#   - check-license-text: Catch wrong license references in prose
#   - lint-gherkin: Validate Gherkin feature files (for features repo)

stages:
  - lint

# ============================================================
# Documentation Naming Convention
# ============================================================

# Check that documentation files follow YYYY-MM-DD-name.md convention
check-doc-naming:
  stage: lint
  image: alpine:3.21
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git 2>/dev/null || true
  script:
    - |
      # Check for files that should have date prefix but don't
      # Exceptions: well-known filenames, problem record artifacts,
      # diagrams/, ideas/, strategy/, infra/, knowledge/
      ERRORS=0

      for file in $(git diff --name-only origin/$CI_DEFAULT_BRANCH...HEAD -- '*.md' 2>/dev/null || find . -name "*.md" -type f); do
        filename=$(basename "$file")
        dirname=$(dirname "$file")

        # Skip well-known filenames that don't need date prefixes
        case "$filename" in
          README.md|CLAUDE.md|CONTRIBUTING.md|roadmap.md|PRINCIPLES.md|VISIBILITY_POLICY.md)
            continue
            ;;
          assumptions.md|master-plan.plan.md)
            continue
            ;;
          STRUCTURE.md|ARCHITECTURE.md|SECURITY.md|CHECKLIST.md)
            continue
            ;;
          investigation.md|implementation-plan.md|retrospective.md|post-mortem.md|rejected-solutions.md)
            continue
            ;;
        esac

        # Skip directories where date prefix convention doesn't apply
        if echo "$dirname" | grep -q "diagrams"; then
          continue
        fi
        if echo "$dirname" | grep -q "ideas"; then
          continue
        fi
        if echo "$dirname" | grep -q "strategy"; then
          continue
        fi
        if echo "$dirname" | grep -q "infra"; then
          continue
        fi
        if echo "$dirname" | grep -q "knowledge"; then
          continue
        fi
        if echo "$dirname" | grep -q "audit-review-frameworks"; then
          continue
        fi
        if echo "$dirname" | grep -q "decisions"; then
          continue
        fi

        # Skip root level files
        if [ "$dirname" = "." ]; then
          continue
        fi

        # Check for date prefix (YYYY-MM-DD-)
        if ! echo "$filename" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-'; then
          echo "ERROR: $file does not follow YYYY-MM-DD-name.md convention"
          ERRORS=$((ERRORS + 1))
        fi
      done

      if [ $ERRORS -gt 0 ]; then
        echo ""
        echo "Found $ERRORS file(s) not following naming convention."
        echo "Files must be named: YYYY-MM-DD-description.md"
        exit 1
      fi

      echo "All documentation files follow naming convention."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Markdown Linting
# ============================================================

# Lint markdown files with markdownlint
# Uses self-hosted shell runner where markdownlint is pre-installed (< 5s)
# instead of Docker node:20-alpine + npm install (~30s overhead).
lint-markdown:
  stage: lint
  tags:
    - self-hosted
    - markdownlint
  needs: []
  timeout: 2m
  script:
    - markdownlint '**/*.md' --ignore node_modules --ignore target
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"
  allow_failure: true

# ============================================================
# Link Checking (lychee)
# ============================================================

# MR pipeline: check local file links only (fast, no network)
# Scheduled pipeline: check ALL links including external URLs (weekly)
# Uses lychee (Rust) — fast, single binary, good local file resolution

.lint-links-base:
  stage: lint
  image: alpine:3.21
  before_script:
    - apk add --no-cache curl bash
    - curl -sL https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin

lint-links:
  extends: .lint-links-base
  script:
    - |
      set -o pipefail
      lychee --offline --no-progress \
        --exclude-path node_modules \
        --exclude-path target \
        --exclude-path .git \
        '**/*.md' 2>&1 | sed 's/Excluded/External (checked weekly by lint-links-external)/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.md"

lint-links-external:
  extends: .lint-links-base
  script:
    - |
      lychee --no-progress --max-retries 2 --timeout 30 \
        --exclude-path node_modules \
        --exclude-path target \
        --exclude-path .git \
        '**/*.md'
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# ============================================================
# License Text Check
# ============================================================

# Catch wrong license references in prose (e.g., "licensed under MIT"
# when the project uses GPL-3.0-or-later). REUSE checks SPDX headers
# but not body text — this fills the gap.
check-license-text:
  stage: lint
  image: alpine:3.21
  before_script:
    - apk add --no-cache grep 2>/dev/null || true
  script:
    - |
      ERRORS=0

      # Check for patterns that indicate this project claims to be MIT-licensed
      # (not references to third-party MIT-licensed dependencies)
      for pattern in "licensed under MIT" "License: MIT"; do
        MATCHES=$(grep -rn --include="*.md" -i "$pattern" . \
          --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
          --exclude-dir=knowledge --exclude-dir=problems --exclude-dir=strategy 2>/dev/null \
          | grep -iv "catppuccin\|dracula\|nord\|solarized\|gruvbox\|third.party\|external\|dependency" || true)
        if [ -n "$MATCHES" ]; then
          echo "$MATCHES"
          echo "ERROR: Found wrong license reference: '$pattern'"
          ERRORS=$((ERRORS + 1))
        fi
      done

      if [ $ERRORS -gt 0 ]; then
        echo ""
        echo "Found $ERRORS wrong license reference(s) in documentation."
        echo "This project is licensed under GPL-3.0-or-later."
        exit 1
      fi

      echo "No wrong license references found."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Gherkin Linting (for features repo)
# ============================================================

# Validate Gherkin feature files
# Uses self-hosted shell runner with pre-installed Node.js.
# npm package still installed at runtime (not worth a global install for one job).
lint-gherkin:
  stage: lint
  tags:
    - self-hosted
    - node
  needs: []
  timeout: 2m
  before_script:
    - npm install --prefer-offline --no-audit --no-fund @cucumber/gherkin-utils
  script:
    - |
      if ls *.feature 1> /dev/null 2>&1 || ls **/*.feature 1> /dev/null 2>&1; then
        echo "Validating Gherkin feature files..."
        ERRORS=0
        for file in $(find . -name "*.feature" -type f); do
          echo "Checking: $file"
          npx gherkin-utils format "$file" > /dev/null 2>&1 || {
            echo "ERROR: Invalid Gherkin syntax in $file"
            ERRORS=$((ERRORS + 1))
          }
        done
        if [ $ERRORS -gt 0 ]; then
          echo "Found $ERRORS file(s) with Gherkin syntax errors."
          exit 1
        fi
        echo "Gherkin validation complete."
      else
        echo "No .feature files found."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.feature"

