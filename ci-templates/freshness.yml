# Core Dependency Freshness Check Template
# Advisory check that warns when Cargo.lock vauchi-core git dependency
# is behind main. Never blocks the pipeline.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/freshness.yml'
#
# Provides:
#   - .check-core-freshness: Advisory job that checks core dependency staleness
#
# Example:
#   check:core-freshness:
#     extends: .check-core-freshness

# Runs on self-hosted runner (~3s) instead of Docker (~290s).
# Requires rust-base.yml (provides .linux-runner-nocache).
.check-core-freshness:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  allow_failure: true
  script:
    - |
      LOCKED_SHA=$(grep -A1 'source = "git+.*vauchi/core' Cargo.lock | sed -n 's/.*#\([a-f0-9]\{40\}\).*/\1/p' | head -1 || true)
      if [ -z "$LOCKED_SHA" ]; then
        echo "Cargo.lock uses path override — no git SHA to check"
        echo "This is normal for local dev (.cargo/config.toml path patch)"
        exit 0
      fi
      LATEST_SHA=$(git ls-remote "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/core.git" refs/heads/main | cut -f1)
      if [ -z "$LATEST_SHA" ]; then
        echo "Could not fetch latest core SHA"
        exit 0
      fi
      LOCKED_SHORT="${LOCKED_SHA:0:8}"
      LATEST_SHORT="${LATEST_SHA:0:8}"
      if [ "$LOCKED_SHA" != "$LATEST_SHA" ]; then
        echo ""
        echo "###############################################"
        echo "#                                             #"
        echo "#   CORE DEPENDENCY IS OUT OF DATE            #"
        echo "#                                             #"
        echo "#   Cargo.lock: $LOCKED_SHORT                       #"
        echo "#   core main:  $LATEST_SHORT                       #"
        echo "#                                             #"
        echo "#   Run: cargo update -p vauchi-core          #"
        echo "#                                             #"
        echo "###############################################"
        echo ""
        exit 1
      else
        echo "Cargo.lock is up to date with core main ($LATEST_SHORT)"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Git Dependency Branch Ref Guard
# Blocks MRs targeting main when Cargo.toml contains non-main branch refs.
# This prevents dead branch refs from reaching main after an upstream
# feature branch is merged and deleted.
#
# Provides:
#   - .check-git-branch-refs: Blocking job that rejects non-main branch refs
#
# Example:
#   check:branch-refs:
#     extends: .check-git-branch-refs

.check-git-branch-refs:
  extends: .linux-runner-nocache
  stage: lint
  needs: []
  script:
    - |
      # Extract non-main branch refs from Cargo.toml git dependencies
      BAD_REFS=$(grep -E 'branch\s*=\s*"' Cargo.toml 2>/dev/null \
        | grep -v 'branch = "main"' || true)
      if [ -z "$BAD_REFS" ]; then
        echo "All git dependency branch refs point to main"
        exit 0
      fi
      echo ""
      echo "###################################################"
      echo "#                                                 #"
      echo "#   BLOCKED: Non-main branch refs in Cargo.toml  #"
      echo "#                                                 #"
      echo "###################################################"
      echo ""
      echo "$BAD_REFS"
      echo ""
      echo "Fix: restore all branch refs to main before merging:"
      echo ""
      echo "  sed -i 's/branch = \"[^\"]*\"/branch = \"main\"/g' Cargo.toml"
      echo "  cargo update"
      echo "  git add Cargo.toml Cargo.lock && git commit -m 'fix: restore git dep branch to main'"
      echo ""
      exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
