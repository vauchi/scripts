# Consistent security gate rules for GitLab Ultimate analyzers.
#
# GitLab's !reference keyword cannot reference scalar keys such as
# interruptible and allow_failure on the GitLab version used by vauchi,
# so those values are inlined in consumer jobs. Tags, retry and rules are
# shared via !reference to keep the gates DRY.
#
# Usage:
#   include:
#     - template: Security/SAST.gitlab-ci.yml
#     - template: Security/Secret-Detection.gitlab-ci.yml
#     - project: 'vauchi/scripts'
#       ref: ci-templates-v2026.07.2
#       file: '/ci-templates/security-gates.yml'
#
#   semgrep-sast:
#     stage: security
#     tags: !reference [.security-gate-sast-tags, tags]
#     interruptible: false
#     allow_failure: false
#     retry: !reference [.security-gate-sast-retry, retry]
#     rules: !reference [.security-gate-sast-rules, rules]
#     needs:
#       - job: lint:format
#         optional: true
#
#   secret_detection:
#     stage: security
#     tags: !reference [.security-gate-secret-tags, tags]
#     interruptible: false
#     allow_failure: false
#     rules: !reference [.security-gate-secret-rules, rules]

.security-gate-sast-tags:
  tags: [docker]

.security-gate-sast-retry:
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

.security-gate-sast-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

.security-gate-secret-tags:
  tags: [docker]

.security-gate-secret-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
