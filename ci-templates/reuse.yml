# Shared REUSE compliance check
#
# REUSE verifies ALL files have proper SPDX headers, so it must run
# whenever any file is added or modified to catch missing headers.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/reuse.yml'
#
# Requires: lint stage defined in the consuming pipeline.
#
# Performance: Uses self-hosted shell runners where reuse is pre-installed
# (< 5s) instead of Docker (fsfe/reuse:latest = 4-6 min Docker overhead).
# Falls back to uv tool install if reuse is not available.
#
# Runner requirement: any self-hosted runner tagged with "reuse".
# Currently: allyson (linux) and nell (macOS).
#
# NOTE: This template is self-contained — it does NOT depend on rust-base.yml
# so that non-Rust repos (android, ios, features, etc.) can include it.

lint:reuse:
  tags:
    - self-hosted
    - reuse
  stage: lint
  needs: []
  # 4m allows the bounded fetch-with-retry (3 × 60s) to complete within the
  # job budget while still failing fast on a genuinely broken runner.
  timeout: 4m
  resource_group: reuse-lint
  variables:
    GIT_STRATEGY: none
  before_script:
    # Inline checkout — avoids Runner's get_sources .tmp race on
    # concurrent shell runners. Self-contained (no rust-base.yml dep).
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
        rm -f .git/shallow.lock 2>/dev/null || true
      fi
      # Bounded fetch with retry — prevents silent hangs that consume the
      # full job timeout (seen in ios lint:reuse #2462683169). macOS lacks
      # GNU `timeout`, so prefer gtimeout (coreutils) and fall back to a
      # pure-bash background+kill shim.
      # Timeout reduced 60s → 20s (2026-04-26 speedup): on healthy
      # network the fetch completes in <5s; the 60s budget made the
      # job dominate lint stage critical path even on green runs. With
      # 20s × 3 retries (60s worst-case) plus 5s sleep between, we still
      # cover transient blips while letting the median run finish in <8s.
      if command -v timeout >/dev/null 2>&1; then
        _git_fetch_bounded() { timeout 20 git fetch "$@"; }
      elif command -v gtimeout >/dev/null 2>&1; then
        _git_fetch_bounded() { gtimeout 20 git fetch "$@"; }
      else
        _git_fetch_bounded() {
          ( git fetch "$@" ) & local pid=$!
          ( sleep 20 && kill -TERM "$pid" 2>/dev/null ) & local killer=$!
          wait "$pid" 2>/dev/null; local rc=$?
          kill "$killer" 2>/dev/null; wait "$killer" 2>/dev/null || true
          return "$rc"
        }
      fi
      fetch_with_retry() {
        local ref="$1"
        local attempt
        for attempt in 1 2 3; do
          if _git_fetch_bounded origin "$ref" --depth 20; then
            return 0
          fi
          echo "git fetch attempt ${attempt}/3 failed — retrying in 5s"
          sleep 5
        done
        return 1
      }
      fetch_ref() {
        if [ "${CI_MERGE_REQUEST_EVENT_TYPE:-}" = "merge_train" ]; then
          # Lint the car GitLab merges, as rust-base's fetch_ref does: the
          # branch head is what the train rebases past (private#1214).
          fetch_with_retry "refs/merge-requests/${CI_MERGE_REQUEST_IID}/train" || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        elif [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          fetch_with_retry "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" || return 1
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          fetch_with_retry "${CI_COMMIT_REF_NAME}" || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }
      if [ ! -d ".git" ]; then
        git init
        git remote add origin "$REPO_URL"
      fi
      if ! fetch_ref 2>/dev/null; then
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        if ! fetch_ref; then
          echo "ERROR: source checkout failed after clean-clone recovery" >&2
          exit 1
        fi
      fi
      git show -s --format='Checked out %H' HEAD
      git clean -ffd -e node_modules/ -e .cache/
    # Self-hosted runners cache the reuse binary. Stale cached versions have
    # mis-parsed .gitignore (scanning node_modules) and missed HTML-comment
    # SPDX headers in markdown. Upgrade with the charset-normalizer extra so
    # encoding detection works on all runner images.
    - uv tool install --upgrade --quiet "reuse[charset-normalizer]"
  script:
    - reuse lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Contributor License Agreement check (private#804)
#
# The MR author must have a row in docs/src/developers/cla-signatures.md.
# The logic lives in ci-templates/check-cla.sh; this job only gathers its
# two inputs. The author comes from the MR itself, not GITLAB_USER_LOGIN:
# a maintainer re-running a contributor's pipeline must not sign for them.
# Public projects only — the MR API answers anonymously there, and a
# private project takes no outside contributions.
#
# In a contributor's fork the pipeline runs in the fork, where vauchi's
# self-hosted runners and the group dependency proxy do not exist. There
# the job takes a gitlab.com shared runner and Docker Hub's alpine, so the
# contributor learns about the CLA before review instead of seeing a job
# that never starts.
check:cla:
  stage: lint
  image: $CLA_IMAGE
  tags: [$CLA_RUNNER_TAG]
  needs: []
  timeout: 3m
  variables:
    GIT_STRATEGY: fetch
    CLA_IMAGE: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
    CLA_RUNNER_TAG: docker
  before_script:
    - |
      for attempt in 1 2 3; do
          apk add --no-cache curl jq && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
  script:
    - |
      set -eu
      fetch() { # $1 = URL, $2 = output file; fails with the HTTP status
        status=$(curl -sS -o "$2" -w '%{http_code}' "$1") || status="000"
        if [ "$status" != "200" ]; then
          echo "check:cla: $1 → HTTP $status" >&2
          cat "$2" >&2 2>/dev/null || true
          exit 2
        fi
      }

      fetch "${CI_API_V4_URL}/projects/${CI_MERGE_REQUEST_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}" mr.json
      author=$(jq -r '.author.username // empty' mr.json)

      # An MR into vauchi/docs may be the signature itself, so read the
      # list from its own checkout. The target path, not CI_PROJECT_PATH:
      # a contributor signs from a fork, whose pipeline runs in the fork.
      if [ "$CI_MERGE_REQUEST_PROJECT_PATH" = "vauchi/docs" ]; then
        signatures=src/developers/cla-signatures.md
      else
        signatures=cla-signatures.md
        fetch "${CI_API_V4_URL}/projects/vauchi%2Fdocs/repository/files/src%2Fdevelopers%2Fcla-signatures.md/raw?ref=main" "$signatures"
      fi

      # The scripts repo tests its own copy; consumers fetch the pinned one.
      if [ -f ci-templates/check-cla.sh ]; then
        check=ci-templates/check-cla.sh
      else
        check=check-cla.sh
        fetch "${CI_API_V4_URL}/projects/77957857/repository/files/ci-templates%2Fcheck-cla.sh/raw?ref=${VAUCHI_SCRIPTS_REF:-main}" "$check"
      fi
      sh "$check" "$signatures" "$author"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_ROOT_NAMESPACE != "vauchi"
      variables:
        CLA_IMAGE: alpine:3.21
        CLA_RUNNER_TAG: saas-linux-small-amd64
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_PROJECT_VISIBILITY == "public"
