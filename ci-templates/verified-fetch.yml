# Verified fetch templates for scripts fetched from vauchi/scripts at runtime.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: ci-templates-v2026.07.2
#       file: '/ci-templates/verified-fetch.yml'
#
#   my_job:
#     extends: .verified-fetch-script
#     variables:
#       FETCH_SCRIPT_PATH: "scripts/ci/vet-autofix.sh"
#       FETCH_SCRIPT_OUTPUT: "vet-autofix.sh"
#       FETCH_SCRIPT_SHA256: "<sha256>"
#     script:
#       - ./vet-autofix.sh

.verified-fetch-script:
  variables:
    FETCH_SCRIPT_PATH: ""
    FETCH_SCRIPT_OUTPUT: "fetched-script.sh"
    FETCH_SCRIPT_SHA256: ""
    GITLAB_TOKEN: "${CI_JOB_TOKEN}"
  before_script:
    - |
      set -euo pipefail
      : "${FETCH_SCRIPT_PATH:?FETCH_SCRIPT_PATH must be set}"
      : "${FETCH_SCRIPT_SHA256:?FETCH_SCRIPT_SHA256 must be set}"
      for cmd in curl sha256sum; do
        if ! command -v "$cmd" >/dev/null 2>&1; then
          echo "Required command not found: $cmd" >&2
          exit 1
        fi
      done
    - |
      set -euo pipefail
      # GitLab expects the file path segment to be URL-encoded (%2F for /).
      # Prefer python3 for full encoding; fall back to sed for paths that only
      # contain slashes (the normal case for scripts/ci/...).
      if command -v python3 >/dev/null 2>&1; then
        ENCODED_PATH=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$FETCH_SCRIPT_PATH")
      else
        ENCODED_PATH=$(printf '%s' "$FETCH_SCRIPT_PATH" | sed 's|/|%2F|g')
      fi
      URL="${CI_API_V4_URL}/projects/vauchi%2Fscripts/repository/files/${ENCODED_PATH}/raw?ref=${VAUCHI_SCRIPTS_REF}"
      curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "$URL" -o "${FETCH_SCRIPT_OUTPUT}"
    - |
      set -euo pipefail
      printf '%s  %s\n' "${FETCH_SCRIPT_SHA256}" "${FETCH_SCRIPT_OUTPUT}" | sha256sum -c -
      chmod +x "${FETCH_SCRIPT_OUTPUT}"
