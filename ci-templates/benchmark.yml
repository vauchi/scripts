# Benchmark Template
# Shared Criterion benchmark configuration for CI jobs
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/benchmark.yml'
#
# Provides:
#   - .bench-save-baseline: Save Criterion baseline (scheduled pipeline)
#   - .bench-compare:       Compare against baseline (scheduled + release tags)
#   - .bench-cache:         Shared cache for benchmark baselines
#
# Variables (set by consumer jobs):
#   BENCH_PACKAGE:   -p flag value (omit for whole crate)
#   BENCH_TARGETS:   --bench flags (e.g. "--bench crypto_benchmarks --bench perf")
#
# Consumer jobs must also extend a runner template (.linux-runner, .rust-runner, etc.)
# and a timeout template (.timeout-standard).
#
# Example:
#   bench:save-baseline:
#     extends: [.bench-save-baseline, .linux-runner, .timeout-standard, .bench-cache]
#     variables:
#       BENCH_PACKAGE: "vauchi-core"
#       BENCH_TARGETS: "--bench crypto_benchmarks --bench performance_regression"

# Shared cache for benchmark baselines
.bench-cache:
  cache:
    key: bench-baseline-${CI_PROJECT_NAME}-main
    paths:
      - target/criterion/

# Save baseline on scheduled pipeline (nightly)
.bench-save-baseline:
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    BENCH_PACKAGE: ""
    BENCH_TARGETS: ""
  script:
    - |
      PACKAGE_FLAG="${BENCH_PACKAGE:+-p ${BENCH_PACKAGE}}"
      cargo bench ${PACKAGE_FLAG} ${BENCH_TARGETS} -- --save-baseline main
  artifacts:
    paths:
      - target/criterion/
    expire_in: 30 days

# Compare against baseline (scheduled + release tags).
# Fails the pipeline on regression > 20% — the gate is no longer advisory.
# Reasoning: an advisory gate that only echoes WARNING does not affect
# any pipeline outcome, so neither scheduled drift nor release-tag
# regressions can ever block. Audit `_private/docs/audit-review-frameworks/
# results/2026-05-21-09-performance-regression-review.md` C2 + record
# `_private/docs/problems/2026-05-21-argon2-no-bench-no-floor-test/`.
.bench-compare:
  stage: test
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    BENCH_PACKAGE: ""
    BENCH_TARGETS: ""
  cache:
    key: bench-baseline-${CI_PROJECT_NAME}-main
    paths:
      - target/criterion/
    policy: pull
  script:
    - |
      PACKAGE_FLAG="${BENCH_PACKAGE:+-p ${BENCH_PACKAGE}}"
      # Check for actual baseline data, not just the cache directory.
      # Criterion stores baselines under target/criterion/*/main/ — the
      # directory can exist from cache without containing a saved baseline.
      BASELINE_COUNT=$(find target/criterion -path '*/main/estimates.json' 2>/dev/null | head -1 | wc -l || echo 0)
      if [ "$BASELINE_COUNT" -gt 0 ]; then
        echo "Found baseline — comparing..."
        # GitLab runners default to `set -eo pipefail`, so a bare
        # `cargo bench ...; BENCH_RC=$?` exits the script the moment
        # cargo returns non-zero — `BENCH_RC=$?` and the subsequent
        # `cat` never run. Use `|| BENCH_RC=$?` so the right side
        # captures cargo's real exit code AND returns 0 itself
        # (set -e is satisfied). On success the `||` branch is
        # short-circuited and BENCH_RC stays 0.
        BENCH_RC=0
        cargo bench ${PACKAGE_FLAG} ${BENCH_TARGETS} -- --baseline main > bench-results.txt 2>&1 || BENCH_RC=$?
        cat bench-results.txt
        # Edge case: a new benchmark added since the last nightly --save-baseline
        # run has no baseline; criterion 0.5 panics with
        # "Baseline 'main' must exist before comparison is allowed". Treat that as
        # "no comparable baseline for this run" and degrade to non-comparison mode
        # rather than blocking the release. The next scheduled --save-baseline run
        # will capture the new bench so subsequent releases can compare it.
        if [ "$BENCH_RC" -ne 0 ] && grep -q "Baseline 'main' must exist" bench-results.txt; then
          echo "WARNING: One or more benchmarks lack a baseline (new bench added since last nightly run)."
          echo "Falling back to no-comparison mode — re-running to record current values."
          BENCH_RC=0
          cargo bench ${PACKAGE_FLAG} ${BENCH_TARGETS} > bench-results.txt 2>&1 || BENCH_RC=$?
          cat bench-results.txt
        fi
        if [ "$BENCH_RC" -ne 0 ]; then
          echo "ERROR: bench failed (not a missing-baseline panic)"
          exit "$BENCH_RC"
        fi
        # Check for regressions > 100% (2x slower).
        # Criterion output format:
        #   change: [+18.2% +25.4% +32.5%] (p = 0.00 < 0.05)
        #   Performance has regressed.
        # Percentages and "regressed" are on different lines. We look at
        # change: lines adjacent to regression markers for values > 100%.
        #
        # TEMPORARY TOLERANCE — original threshold was > 20%
        # (scripts@958a59a per audit C2). Empirically that fires on hardware-
        # variance noise: the bench-baseline cache is captured on the nightly
        # scheduled runner; release tags run on a different VM with different
        # CPU/sccache/co-tenant state. v0.51.9 release pipeline (#3412 / job
        # 14484026955) detected 57 regressions vs 24 improvements on the
        # SAME code, including same benchmark in both directions
        # (key_generation/signing_keypair: +70% AND -37%) — diagnostic of
        # cross-runner variance, not real code regression. The proper fix
        # requires same-runner baseline+compare in one pipeline run; until
        # that lands, > 100% catches catastrophic regressions (2x+ slower)
        # while tolerating the observed hardware-variance band (max +191%).
        # Investigation: v0.51.9 cascade hold 2026-05-21.
        if grep -B1 'Performance has regressed' bench-results.txt 2>/dev/null \
           | grep -qE 'change:.*\+[1-9][0-9]{2}\.|change:.*\+[1-9][0-9]{3,}'; then
          echo "ERROR: Performance regression > 100% detected!"
          grep -B2 'Performance has regressed' bench-results.txt || true
          exit 1
        else
          echo "No significant regressions detected (threshold: >100% — temporary, see comment)"
        fi
      else
        echo "No baseline found — running benchmarks without comparison"
        BENCH_RC=0
        cargo bench ${PACKAGE_FLAG} ${BENCH_TARGETS} > bench-results.txt 2>&1 || BENCH_RC=$?
        cat bench-results.txt
        if [ "$BENCH_RC" -ne 0 ]; then
          exit "$BENCH_RC"
        fi
      fi
  artifacts:
    paths:
      - bench-results.txt
    expire_in: 1 week
    when: always
