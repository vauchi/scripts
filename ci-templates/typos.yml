# Shared spell-check template using typos (crate-ci/typos)
#
# Fast source-code-aware spell checker with curated dictionary.
# Low false positives — designed for code, not prose.
# Config: _typos.toml in the repo root.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/typos.yml'
#
# Requires: lint stage defined in the consuming pipeline.
#
# NOTE: Self-contained — does not extend rust-base.yml.
# Handles PATH setup internally because pipelines that include
# rust-base.yml set CARGO_HOME=${CI_PROJECT_DIR}/.cargo,
# which redirects cargo-binstall output away from $HOME/.cargo/bin.

typos-check:
  tags:
    - self-hosted
  stage: lint
  needs: []
  timeout: 2m
  script:
    - export PATH="$HOME/.cargo/bin${CARGO_HOME:+:$CARGO_HOME/bin}:$PATH"
    - command -v typos >/dev/null 2>&1 || cargo binstall typos-cli --no-confirm 2>/dev/null || cargo install typos-cli
    - typos .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
