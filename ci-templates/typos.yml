# Shared spell-check template using typos (crate-ci/typos)
#
# Fast source-code-aware spell checker with curated dictionary.
# Low false positives — designed for code, not prose.
# Config: _typos.toml in the repo root.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/typos.yml'
#
# Requires: lint stage defined in the consuming pipeline.
#
# NOTE: Self-contained — does not extend rust-base.yml.
# Downloads pre-built binary from GitHub so it works on any runner
# (Docker, shell, macOS, Linux) without requiring cargo.

lint:typos:
  tags:
    - self-hosted
  stage: lint
  needs: []
  # The scan itself is seconds; the budget is mostly get_sources, which
  # on the co-located shell runner exceeded 2m under load (4 spurious
  # job_execution_timeouts on 2026-07-02). 5m keeps fail-fast intent
  # vs the 1h default while absorbing fetch variance.
  timeout: 5m
  resource_group: typos-install
  variables:
    TYPOS_VERSION: "1.33.1"
  script:
    - |
      # Use system typos if available (e.g. self-hosted shell runners)
      if command -v typos >/dev/null 2>&1; then
        echo "Using system typos: $(typos --version)"
      else
        # Download pre-built binary — works on any runner:
        #   - Docker with curl (Debian/Ubuntu images)
        #   - Docker without curl (Alpine/DinD — use wget)
        #   - Shell runners (no write to /usr/local/bin — use ~/.local/bin)
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) TARGET="x86_64-unknown-linux-musl" ;;
          aarch64|arm64) TARGET="aarch64-unknown-linux-musl" ;;
          *) echo "Unsupported arch: $ARCH"; exit 1 ;;
        esac
        URL="https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-${TARGET}.tar.gz"
        echo "Downloading typos v${TYPOS_VERSION} for ${TARGET}..."

        # Pick a download command (curl preferred, wget as fallback for Alpine)
        if command -v curl >/dev/null 2>&1; then
          DL="curl -sSfL"
        elif command -v wget >/dev/null 2>&1; then
          DL="wget -qO-"
        else
          echo "Neither curl nor wget available — installing wget..."
          apk add --no-cache wget >/dev/null 2>&1 || apt-get update -qq && apt-get install -y -qq wget >/dev/null 2>&1
          DL="wget -qO-"
        fi

        # Extract to temp dir, then move binary to install dir.
        # Avoids tar path-matching issues (./typos vs typos across implementations).
        TMPDIR=$(mktemp -d)
        $DL "$URL" | tar xz -C "$TMPDIR"
        INSTALL_DIR="/usr/local/bin"
        if ! mv "$TMPDIR/typos" "$INSTALL_DIR/typos" 2>/dev/null; then
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          mv "$TMPDIR/typos" "$INSTALL_DIR/typos"
        fi
        rm -rf "$TMPDIR"
        export PATH="$INSTALL_DIR:$PATH"
      fi
      typos .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
