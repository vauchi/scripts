# Downstream Trigger Template
# Trigger downstream repository pipelines
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/downstream.yml'
#
# Provides:
#   - .trigger-on-merge: Trigger downstream when merged to main
#   - .trigger-on-tag: Trigger downstream on version tags
#   - .trigger-parallel: Trigger multiple repos in parallel via matrix
#   - .on-upstream-trigger: Rule for jobs triggered by upstream
#
# Mobile distribution repos (vauchi-mobile-swift, vauchi-mobile-android) are
# triggered via core/scripts/trigger-downstream.sh using the Pipeline Trigger
# API, not the GitLab trigger: keyword. This allows passing UPSTREAM_VERSION.

# ============================================================
# Trigger Templates
# ============================================================

# Trigger downstream on merge to main (with change detection)
.trigger-on-merge:
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Trigger downstream on version tags
.trigger-on-tag:
  stage: trigger
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# ============================================================
# Mobile Distribution Triggers
# ============================================================
#
# NOTE: Mobile distribution repos (vauchi-mobile-swift, vauchi-mobile-android)
# are triggered via core/scripts/trigger-downstream.sh on release tags.
# The script uses the Pipeline Trigger API to pass UPSTREAM_VERSION, which
# the distribution repos need to download and update their bindings.
#
# The GitLab trigger: keyword approach is NOT used for mobile distributions
# because it doesn't pass variables and sets CI_PIPELINE_SOURCE to "pipeline"
# instead of "trigger", causing rule mismatches in downstream repos.
#
# Generic trigger templates (.trigger-on-merge, .trigger-on-tag) above
# remain available for other downstream repos that don't need variables.

# ============================================================
# Multi-Repo Trigger (using parallel matrix)
# ============================================================

# Trigger multiple downstream repos in parallel
# Usage:
#   trigger:all-downstream:
#     extends: .trigger-parallel
#     parallel:
#       matrix:
#         - DOWNSTREAM: [vauchi/repo1, vauchi/repo2]
.trigger-parallel:
  stage: trigger
  trigger:
    project: $DOWNSTREAM
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Upstream Trigger Handling
# ============================================================

# Job that runs when triggered from upstream (core)
# Accepts all trigger sources:
#   "trigger" = Pipeline Trigger API (trigger-downstream.sh from CI)
#   "pipeline" = GitLab trigger: keyword (multi-project pipeline)
#   "api" = Pipeline API with PRIVATE-TOKEN (trigger-downstream.sh locally, or glab)
.on-upstream-trigger:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api") && $UPSTREAM_VERSION

# Rebuild bindings when triggered from upstream
.rebuild-from-upstream:
  extends: .on-upstream-trigger
  variables:
    UPSTREAM_TAG: $CI_COMMIT_TAG
  script:
    - echo "Triggered by upstream with tag ${UPSTREAM_TAG:-none}"
    - echo "Rebuilding bindings..."

# ============================================================
# Upstream Compatibility Verification
# ============================================================
#
# For Rust consumer repos (desktop, cli, tui) that depend on vauchi-core
# via git dependency (branch = "main"). When core merges to main, these
# repos are triggered to verify they still build and pass tests.
#
# Unlike mobile distribution repos, these don't need UPSTREAM_VERSION —
# they just need to rebuild against the updated core main branch.

# Rule for jobs triggered by upstream for compatibility verification.
# Does NOT require UPSTREAM_VERSION (unlike .on-upstream-trigger).
.verify-on-upstream:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
