# Downstream Trigger Template
# Trigger downstream repository pipelines
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/downstream.yml'
#
# Provides:
#   - .trigger-on-merge: Trigger downstream when merged to main
#   - .trigger-on-tag: Trigger downstream on version tags
#   - .trigger-parallel: Trigger multiple repos in parallel via matrix
#   - .on-upstream-trigger: Rule for jobs triggered by upstream (requires UPSTREAM_VERSION)
#   - .verify-on-upstream: Rule for upstream compat verification (no version required)
#   - .verify-on-upstream-prerelease: Rule for upstream pre-release verification (requires UPSTREAM_CORE_VERSION)
#   - .verify-nextest-artifacts: Junit artifact template for nextest verify jobs
#
# Mobile distribution: core triggers consumer repos (ios, macos, android) directly.
# vauchi-platform-swift is updated via core's update:swift-bindings (git push).
# vauchi-platform-kotlin is archived — Maven AAR published from core's publish:maven.

# ============================================================
# Trigger Templates
# ============================================================

# Trigger downstream on merge to main (with change detection)
# Note: bridge jobs (trigger:) do not support timeout: — downstream jobs
# must set their own timeouts via .timeout-standard/.timeout-extended.
.trigger-on-merge:
  stage: trigger
  allow_failure: true
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Trigger downstream on version tags
.trigger-on-tag:
  stage: trigger
  allow_failure: true
  variables:
    DOWNSTREAM_PROJECT: ""
  trigger:
    project: $DOWNSTREAM_PROJECT
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ============================================================
# Mobile Distribution Triggers
# ============================================================
#
# Core triggers consumer repos (ios, macos, android) directly via trigger: keyword.
# vauchi-platform-swift receives bindings via core's update:swift-bindings job (git push).
# vauchi-platform-kotlin is archived — Maven AAR published from core's publish:maven.
#
# Downstream repos see CI_PIPELINE_SOURCE == "pipeline" and use the
# .on-upstream-trigger rule to detect upstream-initiated pipelines.
#
# scripts/trigger-downstream.sh remains for local/manual use with
# GITLAB_TOKEN (personal access token) — triggers platform-swift only.

# ============================================================
# Multi-Repo Trigger (using parallel matrix)
# ============================================================

# Trigger multiple downstream repos in parallel
# Usage:
#   trigger:all-downstream:
#     extends: .trigger-parallel
#     parallel:
#       matrix:
#         - DOWNSTREAM: [vauchi/repo1, vauchi/repo2]
.trigger-parallel:
  stage: trigger
  allow_failure: true
  trigger:
    project: $DOWNSTREAM
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Upstream Trigger Handling
# ============================================================

# Job that runs when triggered from upstream (core)
# Accepts all trigger sources:
#   "trigger" = Pipeline Trigger API (trigger-downstream.sh from CI)
#   "pipeline" = GitLab trigger: keyword (multi-project pipeline)
#   "api" = Pipeline API with PRIVATE-TOKEN (trigger-downstream.sh locally, or glab)
.on-upstream-trigger:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api") && $UPSTREAM_VERSION

# Rebuild bindings when triggered from upstream
.rebuild-from-upstream:
  extends: .on-upstream-trigger
  variables:
    UPSTREAM_TAG: $CI_COMMIT_TAG
  script:
    - echo "Triggered by upstream with tag ${UPSTREAM_TAG:-none}"
    - echo "Rebuilding bindings..."

# ============================================================
# Pre-Release Downstream Triggers
# ============================================================
# Trigger downstream repos on pre-release tags (dev/RC) to verify
# compatibility before committing to a PROD release.

# Trigger multiple downstream repos in parallel on pre-release tags
# Usage:
#   verify:downstream-dev:
#     extends: .trigger-parallel-prerelease
#     parallel:
#       matrix:
#         - DOWNSTREAM: [vauchi/cli, vauchi/tui, vauchi/desktop]
.trigger-parallel-prerelease:
  stage: trigger
  allow_failure: true
  variables:
    UPSTREAM_CORE_VERSION: $CI_COMMIT_TAG
  trigger:
    project: $DOWNSTREAM
    strategy: depend

# ============================================================
# Upstream Compatibility Verification
# ============================================================
#
# For Rust consumer repos (desktop, cli, tui) that depend on vauchi-core
# via git dependency (branch = "main"). When core merges to main, these
# repos are triggered to verify they still build and pass tests.
#
# Unlike mobile distribution repos, these don't need UPSTREAM_VERSION —
# they just need to rebuild against the updated core main branch.

# Rule for jobs triggered by upstream for compatibility verification.
# Does NOT require UPSTREAM_VERSION (unlike .on-upstream-trigger).
.verify-on-upstream:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"

# Rule for jobs triggered by upstream pre-release tags (dev/RC).
# Requires UPSTREAM_CORE_VERSION (set by .trigger-parallel-prerelease).
.verify-on-upstream-prerelease:
  rules:
    - if: ($CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api") && $UPSTREAM_CORE_VERSION

# ============================================================
# Verify Job Artifacts
# ============================================================
# Reusable artifact templates for upstream verification jobs.
# Extend these alongside runner + rule templates to get consistent
# junit reporting across all consumer repos.
#
# Example:
#   verify:upstream-compat:
#     extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
#     stage: verify
#     needs: []
#     script:
#       - cargo nextest run --profile ci --all-targets

# Nextest junit artifacts (for repos using cargo-nextest with --profile ci)
.verify-nextest-artifacts:
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week
