# Design Drift Template
# Checks that a platform repo implements all Component variants from design specs
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/design-drift.yml'
#
# Provides:
#   - .design-drift-job: Checks component implementation coverage against design specs
#
# Variables (set by consumer jobs):
#   DESIGN_DRIFT_COMPONENT_DIR:  Path to component implementation dir (required for file mode)
#   DESIGN_DRIFT_FILE_EXT:       File extension for component files (default: ".rs")
#   DESIGN_DRIFT_REPO_LABEL:     Label for Pushgateway metrics (defaults to CI_PROJECT_NAME)
#   DESIGN_DRIFT_FILE_PREFIX:    Prefix added to filenames when matching (default: "")
#   DESIGN_DRIFT_FILE_SUFFIX:    Suffix added before extension (default: "")
#   DESIGN_DRIFT_CASE:           Filename case: "kebab", "snake" (default), "pascal", "lower"
#   DESIGN_DRIFT_MATCH_MODE:     "file" (default) = one file per component, "grep" = grep in renderer file
#   DESIGN_DRIFT_GREP_FILE:      Path to renderer file (required when MATCH_MODE=grep)
#   DESIGN_DRIFT_PROTOCOL:       "component" (design specs) or "presentation"
#   CORE_REF:                    Core ref used in presentation mode
#   CORE_PIN_FILE / CORE_PIN_KIND: the consumer's own Core pin (e.g.
#                   cabi-version.json / cabi-json). When set, CORE_REF is
#                   read from it through scripts/core-pins.py, so the check
#                   runs against the Core the app ships with (ADR-026
#                   amendment, #434). Prefer this over a CORE_REF constant.
#
# Match modes:
#   file  — Looks for a file per component in DESIGN_DRIFT_COMPONENT_DIR.
#           Uses exact match first, then prefix-glob (handles iOS mixed suffixes).
#   grep  — Searches for PascalCase variant name in DESIGN_DRIFT_GREP_FILE.
#           Useful for CLI/TUI that handle all components in one match block.
#
# Case conventions and platform mapping:
#   snake  — field_list.rs        (Rust: linux-gtk, tui)
#   kebab  — field-list.rs        (rare)
#   pascal — FieldListComponent.kt (Kotlin, Swift, TypeScript, C#)
#   lower  — fieldlistcomponent.cpp (C++: linux-qt)
#
# ── Examples ─────────────────────────────────────────────────────
#
# Rust / snake_case (linux-gtk):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "src/core_ui/components"
#
# Kotlin / PascalCase (android):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "app/src/main/kotlin/app/vauchi/ui/coreui/components"
#       DESIGN_DRIFT_FILE_EXT: ".kt"
#       DESIGN_DRIFT_FILE_SUFFIX: "Component"
#       DESIGN_DRIFT_CASE: "pascal"
#
# Swift / PascalCase (ios, macos — glob handles mixed suffixes):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "Vauchi/CoreUI/Components"
#       DESIGN_DRIFT_FILE_EXT: ".swift"
#       DESIGN_DRIFT_CASE: "pascal"
#
# C++ / lowercase (linux-qt):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "src/coreui/components"
#       DESIGN_DRIFT_FILE_EXT: ".cpp"
#       DESIGN_DRIFT_FILE_SUFFIX: "component"
#       DESIGN_DRIFT_CASE: "lower"
#
# TypeScript / PascalCase (web-demo):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "src/core-ui/components"
#       DESIGN_DRIFT_FILE_EXT: ".tsx"
#       DESIGN_DRIFT_FILE_SUFFIX: "Component"
#       DESIGN_DRIFT_CASE: "pascal"
#
# C# / PascalCase (windows):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_COMPONENT_DIR: "Vauchi/CoreUI/Components"
#       DESIGN_DRIFT_FILE_EXT: ".xaml.cs"
#       DESIGN_DRIFT_FILE_SUFFIX: "Component"
#       DESIGN_DRIFT_CASE: "pascal"
#
# Grep mode (cli, tui — single renderer file):
#   check:design-drift:
#     extends: .design-drift-job
#     variables:
#       DESIGN_DRIFT_MATCH_MODE: "grep"
#       DESIGN_DRIFT_GREP_FILE: "src/ui/screen_renderer.rs"

.design-drift-job:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  timeout: 10 minutes
  allow_failure: true
  # Retry on runner system failures — primarily transient 404s from the
  # GitLab dependency proxy (observed 2026-04-22: windows main 19/20 red
  # with failure_reason=runner_system_failure from failed image pull).
  # Only retries on system-level failures, never on script failures.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DESIGN_DRIFT_COMPONENT_DIR: ""
    DESIGN_DRIFT_FILE_EXT: ".rs"
    DESIGN_DRIFT_REPO_LABEL: ""
    DESIGN_DRIFT_FILE_PREFIX: ""
    DESIGN_DRIFT_FILE_SUFFIX: ""
    DESIGN_DRIFT_CASE: "snake"
    DESIGN_DRIFT_MATCH_MODE: "file"
    DESIGN_DRIFT_GREP_FILE: ""
    DESIGN_DRIFT_PROTOCOL: "component"
    CORE_REF: "main"
    CORE_PIN_FILE: ""
    CORE_PIN_KIND: ""
    CORE_PINS_SCRIPT_REF: "main"
  before_script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache curl openssh-client bash grep git python3 && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi

      # This job replaces any inherited before_script, so it does not get
      # fetch_vauchi_script from rust-base. Without a definition here the
      # helper download below was "command not found" and no repository's
      # design-drift numbers were ever pushed (private#470). Plain sh: the
      # job's shell is alpine's.
      fetch_vauchi_script() {
        src_path="$1"; dest="$2"
        encoded_path=$(printf '%s' "$src_path" | sed 's|/|%2F|g')
        mkdir -p "$(dirname "$dest")"
        curl -fsSL -u "gitlab-ci-token:${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/77957857/repository/files/${encoded_path}/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o "$dest"
        chmod +x "$dest"
      }
  script:
    - |
      set -euo pipefail

      if [ "$DESIGN_DRIFT_MATCH_MODE" = "file" ] && [ -z "$DESIGN_DRIFT_COMPONENT_DIR" ]; then
        echo "ERROR: DESIGN_DRIFT_COMPONENT_DIR must be set in file mode" >&2
        exit 1
      fi
      if [ "$DESIGN_DRIFT_MATCH_MODE" = "grep" ] && [ -z "$DESIGN_DRIFT_GREP_FILE" ]; then
        echo "ERROR: DESIGN_DRIFT_GREP_FILE must be set in grep mode" >&2
        exit 1
      fi

      REPO_LABEL="${DESIGN_DRIFT_REPO_LABEL:-${CI_PROJECT_NAME}}"

      # ── Fetch canonical variant list ──
      # CI_JOB_TOKEN does not support the Repository Tree API, so we use
      # a sparse git clone instead (CI_JOB_TOKEN supports git operations).
      PLANNED=""
      EXPECTED_COMPONENTS=""
      EXPECTED_COUNT=0
      if [ "$DESIGN_DRIFT_PROTOCOL" = "presentation" ]; then
        # Same step as parser-parity.yml: the pin, not a constant, names Core.
        if [ -n "$CORE_PIN_FILE" ]; then
          curl --fail-with-body -sS -o /tmp/core-pins.py \
            "https://gitlab.com/vauchi/scripts/-/raw/${CORE_PINS_SCRIPT_REF}/scripts/core-pins.py"
          CORE_REF=$(python3 /tmp/core-pins.py read --kind "$CORE_PIN_KIND" "$CORE_PIN_FILE")
          echo "Core ref from $CORE_PIN_FILE: $CORE_REF"
        fi
        CORE_DIR=$(mktemp -d)
        git -C "$CORE_DIR" init -q
        git -C "$CORE_DIR" remote add origin https://gitlab.com/vauchi/core.git
        git -C "$CORE_DIR" sparse-checkout init --no-cone
        git -C "$CORE_DIR" sparse-checkout set vauchi-core/src/platform/presentation/surface/nodes.rs
        git -C "$CORE_DIR" fetch -q --depth 1 origin "$CORE_REF"
        git -C "$CORE_DIR" checkout -q FETCH_HEAD
        ENUM_FILE="$CORE_DIR/vauchi-core/src/platform/presentation/surface/nodes.rs"
        for name in $(awk '
          /^pub enum PresentationNode / { in_enum=1; next }
          in_enum && /^}/ { exit }
          in_enum && /^    [A-Z][A-Za-z0-9_]*[ {(,]/ {
            name=$1
            sub(/[ {(,].*$/, "", name)
            print name
          }
        ' "$ENUM_FILE" | sed -E 's/([a-z0-9])([A-Z])/\1-\2/g' | tr 'A-Z' 'a-z' | sort -u); do
          EXPECTED_COMPONENTS="${EXPECTED_COMPONENTS} ${name}"
          EXPECTED_COUNT=$((EXPECTED_COUNT + 1))
        done
      else
        PRIVATE_REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/vauchi/private.git"
        COMPONENTS_DIR="/tmp/private-designs"
        git clone --depth=1 --filter=blob:none --sparse \
          "$PRIVATE_REPO_URL" "$COMPONENTS_DIR" 2>/dev/null \
          && git -C "$COMPONENTS_DIR" sparse-checkout set designs/components 2>/dev/null \
          || true

        if [ ! -d "${COMPONENTS_DIR}/designs/components" ]; then
          echo "WARNING: Could not clone component list from vauchi/private — skipping check"
          exit 0
        fi
        for name in $(ls "${COMPONENTS_DIR}/designs/components/"*.md 2>/dev/null | xargs -n1 basename | sed 's/\.md$//' | sort); do
          case "$name" in README|INDEX) continue ;; esac
          SKIP=false
          for p in $PLANNED; do
            if [ "$name" = "$p" ]; then SKIP=true; break; fi
          done
          if $SKIP; then continue; fi
          EXPECTED_COMPONENTS="${EXPECTED_COMPONENTS} ${name}"
          EXPECTED_COUNT=$((EXPECTED_COUNT + 1))
        done
      fi

      echo "Design spec components (${EXPECTED_COUNT}):"
      for c in $EXPECTED_COMPONENTS; do echo "  - $c"; done
      echo ""

      # ── Name conversion helpers ──
      to_pascal() {
        echo "$1" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1' | tr -d ' '
      }
      to_snake() {
        echo "$1" | tr '-' '_'
      }
      to_lower() {
        echo "$1" | tr -d '-'
      }

      # ── Check each component ──
      IMPLEMENTED=0
      MISSING=""
      MISSING_COUNT=0

      for component in $EXPECTED_COMPONENTS; do
        FOUND=false
        pascal=$(to_pascal "$component")

        if [ "$DESIGN_DRIFT_MATCH_MODE" = "grep" ]; then
          # Grep mode: search for Component::Variant or .variant pattern in renderer
          if grep -rq "PresentationNode::${pascal}\b\|Component::${pascal}\b\|\.${pascal}\b\|is ${pascal}\b\|case.*${pascal}\|\"${pascal}\"" "$DESIGN_DRIFT_GREP_FILE" 2>/dev/null; then
            echo "  OK: $component → found in $DESIGN_DRIFT_GREP_FILE"
            FOUND=true
          fi
        else
          # File mode: convert name to platform convention
          case "$DESIGN_DRIFT_CASE" in
            kebab)  base="$component" ;;
            snake)  base=$(to_snake "$component") ;;
            pascal) base="$pascal" ;;
            lower)  base=$(to_lower "$component") ;;
            *)      base="$component" ;;
          esac

          # Try exact filename match
          filename="${DESIGN_DRIFT_FILE_PREFIX}${base}${DESIGN_DRIFT_FILE_SUFFIX}${DESIGN_DRIFT_FILE_EXT}"
          filepath="${DESIGN_DRIFT_COMPONENT_DIR}/${filename}"

          if [ -f "$filepath" ]; then
            echo "  OK: $component → $filepath"
            FOUND=true
          else
            # Glob: prefix match (handles iOS mixed suffixes like TextComponentView vs TextInputView)
            for candidate in "${DESIGN_DRIFT_COMPONENT_DIR}/${DESIGN_DRIFT_FILE_PREFIX}${base}"*"${DESIGN_DRIFT_FILE_EXT}"; do
              if [ -f "$candidate" ]; then
                echo "  OK: $component → $candidate"
                FOUND=true
                break
              fi
            done
          fi
        fi

        if $FOUND; then
          IMPLEMENTED=$((IMPLEMENTED + 1))
        else
          if [ "$DESIGN_DRIFT_MATCH_MODE" = "grep" ]; then
            echo "  MISSING: $component (${pascal}) → not found in $DESIGN_DRIFT_GREP_FILE"
          else
            echo "  MISSING: $component → expected ${DESIGN_DRIFT_COMPONENT_DIR}/${DESIGN_DRIFT_FILE_PREFIX}${base}*${DESIGN_DRIFT_FILE_EXT}"
          fi
          MISSING="${MISSING}${MISSING:+,}${component}"
          MISSING_COUNT=$((MISSING_COUNT + 1))
        fi
      done

      echo ""
      echo "Design drift: ${IMPLEMENTED}/${EXPECTED_COUNT} components implemented (${MISSING_COUNT} missing)"

      # ── Push metrics ──
      # Build Prometheus exposition format inline (avoids SSH issues from alpine)
      SCORE="100.00"
      if [ "$EXPECTED_COUNT" -gt 0 ]; then
        SCORE=$(awk "BEGIN { printf \"%.2f\", (100.0 * $IMPLEMENTED / $EXPECTED_COUNT) }")
      fi
      METRICS_TEXT=""
      METRICS_TEXT="${METRICS_TEXT}vauchi_eng_design_drift_expected{repo=\"${REPO_LABEL}\"} ${EXPECTED_COUNT}\n"
      METRICS_TEXT="${METRICS_TEXT}vauchi_eng_design_drift_implemented{repo=\"${REPO_LABEL}\"} ${IMPLEMENTED}\n"
      METRICS_TEXT="${METRICS_TEXT}vauchi_eng_design_drift_missing{repo=\"${REPO_LABEL}\"} ${MISSING_COUNT}\n"
      METRICS_TEXT="${METRICS_TEXT}vauchi_eng_design_drift_score{repo=\"${REPO_LABEL}\"} ${SCORE}\n"

      # Push via shared helper (tries: direct URL → full SSH → restricted SSH)
      if fetch_vauchi_script scripts/ci/setup-ssh-pushgateway.sh /tmp/setup-ssh-pushgateway.sh; then
        . /tmp/setup-ssh-pushgateway.sh
        setup_ssh_pushgateway
        METRICS_FLAT=$(printf '%b' "$METRICS_TEXT")
        if pushgateway_push "$METRICS_FLAT" "/metrics/job/vauchi_design_drift/repo/${REPO_LABEL}"; then
          echo "✓ Design drift metrics pushed for ${REPO_LABEL} (${PUSHGATEWAY_SSH_MODE:-direct})"
        else
          echo "⚠ Pushgateway push failed (non-fatal)"
          printf '%b' "$METRICS_TEXT"
        fi
      else
        echo "⚠ Could not download pushgateway helper — metrics skipped"
        printf '%b' "$METRICS_TEXT"
      fi

      # ── Exit code ──
      if [ "$MISSING_COUNT" -gt 0 ]; then
        echo ""
        echo "DRIFT: Missing components: ${MISSING}"
        exit 1
      else
        echo ""
        echo "PASS: All design-specified components are implemented."
      fi
