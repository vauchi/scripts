# Rust Base Template
# Shared configuration for Rust projects
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/rust-base.yml'
#
# Provides:
#   - .rust-cache: Cargo caching with Cargo.lock-based keys
#   - .self-hosted: Self-hosted runner with HTTPS git clone
#   - .linux-runner: Linux VM runner configuration (pull-push cache)
#   - .linux-runner-readonly: Linux VM runner (pull-only cache)
#   - .linux-runner-nocache: Linux VM runner (no cache)
#   - .rust-runner: Platform-agnostic Rust runner (pull-push cache, load-balanced)
#   - .rust-runner-readonly: Platform-agnostic Rust runner (pull-only cache)
#   - .rust-runner-nocache: Platform-agnostic Rust runner (no cache)
#   - .macos-runner: macOS VM runner configuration
#   - .docker-runner: Docker executor for containers
#   - Variables: CARGO_HOME, CARGO_INCREMENTAL

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"
  # Minimal clone depth — lint/test/build jobs don't need history.
  # Release/verify jobs override with deeper depth where needed.
  GIT_DEPTH: "1"
  # Keep sccache daemon alive between jobs (avoids restart overhead).
  # SCCACHE_DIR/SCCACHE_CACHE_SIZE are runner-owned, not set here: the
  # persistent daemon reads env only at startup, so per-job CI variables
  # are silently ignored. Linux runners inherit them from the
  # gitlab-runner systemd unit (ansible `runner` role); nell (macOS)
  # sets them in config.toml `environment`.
  SCCACHE_IDLE_TIMEOUT: "0"
  # Use faster zstd compression for CI artifacts/cache
  ARTIFACT_COMPRESSION_LEVEL: fastest
  FF_USE_FASTZIP: "true"
  # Note: CARGO_INCREMENTAL is set to 0 for self-hosted runners via .self-hosted
  # to reduce target/ directory size and improve cache efficiency

# ============================================================
# Default Job Configuration
# ============================================================
# These defaults apply to all jobs unless overridden

default:
  # Auto-cancel jobs when new commits are pushed (saves runner resources)
  interruptible: true
  # Retry on runner system failures (not script failures).
  # job_execution_timeout is its own failure_reason — NOT covered by
  # stuck_or_timeout_failure — so timed-out jobs never retried before
  # (core job 15493965238 died at the ceiling with no retry). The retry
  # is warm-biased: the killed attempt's on-disk slot target/ and
  # sccache deposits make the second attempt much faster.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - job_execution_timeout
      - unknown_failure

# ============================================================
# Workflow Rules
# ============================================================
# Controls which pipeline sources are accepted and auto-cancel behavior.
# Repos using this template should NOT define their own workflow rules
# unless they want to override this behavior.
#
# Accepted sources:
#   - push: Branch pushes (main, tags)
#   - merge_request_event: MR pipelines (primary validation path)
#   - pipeline: GitLab trigger: keyword (upstream verification triggers)
#   - trigger: Pipeline Trigger API (trigger-downstream.sh)
#   - api: Pipeline API (manual triggers via glab/curl)
#   - schedule: Scheduled pipelines (cleanup, periodic checks)
#   - web: Manual "Run pipeline" from GitLab UI

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Suppress push pipelines when an MR is already open (prevents ghost duplicates)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    # A default-branch pipeline ends in the release tag (core's
    # auto-tag:version runs in the last stage, behind every blocking job),
    # so a merge landing mid-run must not cancel it: with the interruptible
    # policy core main was canceled three runs in a row on 2026-09-12 and
    # v0.67.1 waited hours for a quiet main. Only MR pipelines are cheap to
    # cancel; every other source on the default branch runs to completion.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ============================================================
# Rust Cache Configuration
# ============================================================

# Optimized Rust cache using Cargo.lock for smart invalidation
# Fallback keys allow reuse of caches from other branches/jobs when exact key misses,
# avoiding cold builds on Cargo.lock changes (saves 15-25 min per cold build).
.rust-cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
    policy: pull-push

# Read-only cache (for lint jobs that don't produce new build artifacts)
.rust-cache-readonly:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_PROJECT_NAME}-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
    policy: pull

# Minimal cache (for quick jobs like format check)
.rust-cache-minimal:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_PROJECT_NAME}-minimal
    fallback_keys:
      - rust-${CI_PROJECT_NAME}-minimal-${CI_DEFAULT_BRANCH}
      - rust-${CI_PROJECT_NAME}-minimal
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
    policy: pull

# ============================================================
# Tool Installation Helper
# ============================================================
# Uses cargo-binstall for pre-built binaries (5-10s vs 60-90s compile).
# Falls back to cargo install if binstall is unavailable or fails.

.ensure-binstall:
  before_script:
    - |
      # Install cargo-binstall if not present (one-time, ~5s)
      if ! command -v cargo-binstall >/dev/null 2>&1; then
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      fi

# ============================================================
# Shell Checkout Template (non-Rust jobs)
# ============================================================
# Lightweight GIT_STRATEGY:none checkout for shell-executor jobs
# that don't need Rust/sccache/cargo. Avoids Runner's built-in
# get_sources and its .tmp directory race on concurrent slots.
#
# Usage: extend .shell-checkout in lint/reuse/markdown jobs
# that run on self-hosted shell runners.

.shell-checkout:
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
        rm -f .git/shallow.lock 2>/dev/null || true
      fi

      fetch_ref() {
        if [ "${CI_MERGE_REQUEST_EVENT_TYPE:-}" = "merge_train" ]; then
          # The train car is main, the cars ahead and this branch: the tree
          # GitLab merges. The branch head is what the train rebases past,
          # and testing it let a car go green on a tree that never merged
          # (private#1214).
          git fetch origin "refs/merge-requests/${CI_MERGE_REQUEST_IID}/train" --depth 20 || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        elif [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20 || return 1
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20 || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }

      if [ ! -d ".git" ]; then
        git init
        git remote add origin "$REPO_URL"
      fi

      if ! fetch_ref 2>/dev/null; then
        echo "Fetch failed — resetting .git for clean clone"
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        if ! fetch_ref; then
          echo "ERROR: source checkout failed after clean-clone recovery" >&2
          exit 1
        fi
      fi

      git show -s --format='Checked out %H' HEAD
      git clean -ffd -e node_modules/ -e .cache/

# ============================================================
# Self-Hosted Runner Templates
# ============================================================

# Base configuration for self-hosted runners
# - Uses HTTPS git clone with CI_JOB_TOKEN (no SSH keys needed)
# - Disables incremental compilation to reduce target/ size
.self-hosted:
  variables:
    GIT_STRATEGY: none
    # Disable incremental compilation — reduces target/ directory size significantly,
    # improving cache upload/download times on CI where builds are rarely incremental.
    CARGO_INCREMENTAL: "0"
    # sccache: shared compilation cache across jobs (30-50% faster recompilation).
    # SCCACHE_DIR and SCCACHE_CACHE_SIZE come from the runner, not from here —
    # the persistent daemon (SCCACHE_IDLE_TIMEOUT=0) only reads env vars at
    # startup, so per-job CI variables are silently ignored. Linux runners get
    # them from the gitlab-runner systemd unit (ansible `runner` role, which
    # also runs a health-check timer that kills a stats-dead daemon); nell
    # (macOS) sets them in config.toml `environment`.
    #
    # KNOWN LIMITATION: On shared shell runners (allyson, nell), concurrent jobs
    # share the same sccache daemon. If Job A compiles while Job B's git clean
    # deletes registry/src, sccache crashes with "No such file or directory".
    # This is transient — retry resolves it. A proper fix would use per-job
    # SCCACHE_DIR but costs 15-25 min cold builds per job.
    RUSTC_WRAPPER: "sccache"
    # Pinned so CI never inherits the port from the runner account's shell
    # profile. nell's shell runner sources ~/.zshrc, which exports
    # SCCACHE_SERVER_PORT for interactive use — so a maintainer's session and
    # every CI job were pointed at one daemon, and core!1548 failed on
    # "server on port 4227 did not answer within 30s" while that daemon was
    # restarting. Unlike SCCACHE_DIR, the port IS read per client invocation,
    # so setting it here works.
    SCCACHE_SERVER_PORT: "4228"
  before_script:
    # Ensure user-installed cargo tools are in PATH (CARGO_HOME is overridden
    # to ${CI_PROJECT_DIR}/.cargo for caching, so ~/.cargo/bin isn't automatic)
    - export PATH="$HOME/.cargo/bin:${PATH}"
    # Re-export CARGO_HOME at runtime — YAML variable expansion of
    # ${CI_PROJECT_DIR} can resolve to empty in triggered pipelines,
    # causing cargo to write to /.cargo/ (read-only on macOS).
    - export CARGO_HOME="${CI_PROJECT_DIR:-.}/.cargo"
    - |
      # host-cpu-lock: entry
      # Every self-hosted job holds the host's CPU lock shared while it
      # runs; a benchmark takes it exclusively (benchmark.yml,
      # .bench-host-exclusive), so criterion never samples beside another
      # repo's build on the same host (private#554). Passing the gate first
      # lets a waiting benchmark stop new jobs, so a steady stream of them
      # cannot starve it. A holder process keeps the lock rather than a
      # shell fd: an fd would be inherited by daemons the job starts
      # (sccache) and outlive the job. macOS (nell) has no flock(1).
      if command -v flock >/dev/null 2>&1; then
        VAUCHI_LOCK_DIR="${HOME}/.cache/vauchi-ci-locks"
        export VAUCHI_LOCK_DIR
        mkdir -p "$VAUCHI_LOCK_DIR"
        flock -s "$VAUCHI_LOCK_DIR/gate" true
        rm -f "$VAUCHI_LOCK_DIR/shared.$$"
        flock -o -s "$VAUCHI_LOCK_DIR/cpu" sh -c \
          "touch '$VAUCHI_LOCK_DIR/shared.$$'; while kill -0 $$ 2>/dev/null; do sleep 1; done" \
          </dev/null >/dev/null 2>&1 &
        VAUCHI_CPU_HOLDER=$!
        while [ ! -e "$VAUCHI_LOCK_DIR/shared.$$" ] && kill -0 "$VAUCHI_CPU_HOLDER" 2>/dev/null; do
          sleep 1
        done
        rm -f "$VAUCHI_LOCK_DIR/shared.$$"
      fi
    - |
      # Clone/fetch via HTTPS using CI_JOB_TOKEN (no SSH keys needed)
      # GIT_STRATEGY: none preserves .git/ across runs. If the state is
      # corrupt (force push, stale shallow refs), nuke and start fresh.
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
        rm -f .git/shallow.lock 2>/dev/null || true
        # Self-healing: don't nuke .git on fsck failure — shallow clones
        # legitimately have missing objects beyond the depth boundary.
        # Instead, try the fetch. Only nuke if fetch itself fails.
      fi

      # Guarded git fetch: bound each fetch to 120s so a hung gitaly/TLS
      # handshake surfaces quickly instead of consuming the full job timeout
      # (seen in core prebuild:apple #2462577746 where the fetch hung silently
      # for 45 min). Three retries with 5s backoff handle transient failures
      # common on the shared nell runner.
      #
      # macOS has no GNU `timeout` by default — prefer `gtimeout` (coreutils)
      # and fall back to a background+kill shim. The shim is pure bash and
      # works everywhere.
      if command -v timeout >/dev/null 2>&1; then
        _git_fetch_bounded() { timeout 120 git fetch "$@"; }
      elif command -v gtimeout >/dev/null 2>&1; then
        _git_fetch_bounded() { gtimeout 120 git fetch "$@"; }
      else
        _git_fetch_bounded() {
          ( git fetch "$@" ) & local pid=$!
          ( sleep 120 && kill -TERM "$pid" 2>/dev/null ) & local killer=$!
          wait "$pid" 2>/dev/null; local rc=$?
          kill "$killer" 2>/dev/null; wait "$killer" 2>/dev/null || true
          return "$rc"
        }
      fi
      fetch_with_retry() {
        local ref="$1"
        local attempt
        for attempt in 1 2 3; do
          if _git_fetch_bounded origin "$ref" --depth 20; then
            return 0
          fi
          echo "git fetch attempt ${attempt}/3 failed — retrying in 5s"
          sleep 5
        done
        return 1
      }

      fetch_ref() {
        if [ "${CI_MERGE_REQUEST_EVENT_TYPE:-}" = "merge_train" ]; then
          # The train car is main, the cars ahead and this branch: the tree
          # GitLab merges. The branch head is what the train rebases past,
          # and testing it let a car go green on a tree that never merged
          # (private#1214).
          fetch_with_retry "refs/merge-requests/${CI_MERGE_REQUEST_IID}/train" || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        elif [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          fetch_with_retry "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" || return 1
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          fetch_with_retry "${CI_COMMIT_REF_NAME}" || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }

      if [ ! -d ".git" ]; then
        git init
        git remote add origin "$REPO_URL"
      fi

      # Try fetch; if it fails (force push, corrupt objects), start fresh
      if ! fetch_ref 2>/dev/null; then
        echo "Fetch failed — resetting .git for clean clone"
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        if ! fetch_ref; then
          echo "ERROR: source checkout failed after clean-clone recovery" >&2
          exit 1
        fi
      fi

      git show -s --format='Checked out %H' HEAD
      # Remove stale untracked files left from previous checkouts.
      # GIT_STRATEGY:none + fetch/checkout doesn't clean deleted files,
      # so renamed modules (e.g. foo.rs → foo/mod.rs) leave the old file
      # on disk, breaking rustfmt ("file for module found at both").
      # Exclude build artifacts to preserve sccache/cargo incremental state.
      git clean -ffd -e target/ -e .cargo/ -e .cache/ -e .smoke-bin/

      # Remove .cargo/config.toml if it contains [patch] path overrides.
      # Local-dev configs (e.g. ../core/vauchi-core) resolve to stale
      # sibling directories on shell runners — CI must use git deps.
      # Safe: downstream repos only put [patch] overrides in this file;
      # build/linker settings live in $HOME/.cargo/config.toml or core's config.
      if [ -f .cargo/config.toml ] && grep -q '\[patch\.' .cargo/config.toml 2>/dev/null; then
        echo "Removing .cargo/config.toml (contains local-dev [patch] overrides)"
        rm .cargo/config.toml
      fi

      # Fail if Cargo.toml has committed [patch] with local SIBLING path
      # overrides (path = "../…"). These belong in gitignored
      # .cargo/config.toml (via: just setup-path-overrides) — committed
      # sibling overrides break Docker builds and create fragile CI that
      # only passes when stale sibling checkouts exist on shell runners.
      # In-repo vendored patches (path = "vendor/…", e.g. the rqrr fork)
      # are committed IN the repo and present in every build, so exempt them.
      # Capture into a variable (no `grep -q` mid-pipe — early-exit SIGPIPE
      # makes the upstream grep flaky across implementations and could let a
      # forbidden line through). A non-empty result = a path override that is
      # NOT an in-repo vendor/ patch → fail.
      FORBIDDEN_PATCH=$(sed -n '/^\[patch\./,/^\[/p' Cargo.toml 2>/dev/null | grep -v '^[[:space:]]*#' | grep -E 'path[[:space:]]*=' | grep -vE 'path[[:space:]]*=[[:space:]]*"?vendor/' || true)
      if [ -n "$FORBIDDEN_PATCH" ]; then
        echo "ERROR: Cargo.toml contains [patch] with local sibling path overrides"
        echo "Move to .cargo/config.toml (gitignored). See: just setup-path-overrides"
        exit 1
      fi

    # Reproducible builds: pin timestamps to commit time (G3).
    # SOURCE_DATE_EPOCH makes Rust's __DATE__/__TIME__ and any build-time
    # timestamp use the commit date instead of wall clock. Required for
    # bit-identical rebuilds from the same source.
    - export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
    # Reproducible builds: remap absolute paths so binaries don't embed
    # runner-specific directory names. Combined with strip=true in the
    # release profile, this eliminates path-based non-determinism.
    - export RUSTFLAGS="${RUSTFLAGS:+$RUSTFLAGS }--remap-path-prefix=$CI_PROJECT_DIR=/build --remap-path-prefix=$HOME/.cargo/registry/src=/registry"
    # Ensure a Rust toolchain is configured (self-hosted runners may not have a default)
    - rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
    # Clear project-local extracted crate sources (shell runners persist registry
    # across jobs; interrupted extractions leave partial source dirs that fail to
    # compile). Cargo re-extracts from cached .crate tarballs — fast, no download.
    # NOTE: Only clear the project-local .cargo/registry/src, NOT $HOME/.cargo/registry/src.
    # On shared shell runners (nell, allyson), $HOME is shared across concurrent jobs —
    # deleting the global registry races with sccache in parallel jobs.
    - rm -rf .cargo/registry/src 2>/dev/null || true
    # Ensure sccache is available and start the daemon.
    #
    # Fails loudly on purpose. These lines used to end in `2>/dev/null || true`,
    # so a server that never came up was invisible — and every rustc call is
    # wrapped in an sccache client that then blocks forever waiting for it, with
    # no timeout. On 2026-08-17 that hung core's builds for the full 60-minute
    # job budget, three pipelines running, at 0.8 load on 24 cores, with no
    # error in the log. The cause was simply a missing cache directory.
    #
    # A cold cache costs minutes; a wedged client costs the whole job and says
    # nothing. So: create the directory, refuse to continue without a server,
    # and prove it answers before handing it the build.
    - mkdir -p "${SCCACHE_DIR:-$HOME/.cache/sccache}"
    - command -v sccache >/dev/null 2>&1 || cargo binstall sccache --no-confirm 2>/dev/null || true
    - |
      if command -v sccache >/dev/null 2>&1; then
        # --start-server exits 2 with "Address in use" when a server is
        # ALREADY running — the normal case when a concurrent job on this
        # runner started one first. That is a healthy shared server, not a
        # dead one, so only --show-stats decides liveness.
        #
        # --show-stats must be bounded: a wedged server accepts the
        # connection and never answers, which spends the whole job timeout
        # (core!1548, 5m0s, against a 14-day-old server). Same
        # timeout/gtimeout/shim ladder as _git_fetch_bounded above.
        if command -v timeout >/dev/null 2>&1; then
          _sccache_stats_bounded() { timeout 30 sccache --show-stats; }
        elif command -v gtimeout >/dev/null 2>&1; then
          _sccache_stats_bounded() { gtimeout 30 sccache --show-stats; }
        else
          _sccache_stats_bounded() {
            ( sccache --show-stats ) & local pid=$!
            ( sleep 30 && kill -TERM "$pid" 2>/dev/null ) & local killer=$!
            wait "$pid" 2>/dev/null; local rc=$?
            kill -TERM "$killer" 2>/dev/null
            return "$rc"
          }
        fi
        # `--stop-server` needs the same bound: it talks to the same
        # unresponsive socket that `--show-stats` just hung on.
        if command -v timeout >/dev/null 2>&1; then
          _sccache_stop_bounded() { timeout 30 sccache --stop-server; }
        elif command -v gtimeout >/dev/null 2>&1; then
          _sccache_stop_bounded() { gtimeout 30 sccache --stop-server; }
        else
          _sccache_stop_bounded() {
            ( sccache --stop-server ) & local pid=$!
            ( sleep 30 && kill -TERM "$pid" 2>/dev/null ) & local killer=$!
            wait "$pid" 2>/dev/null; local rc=$?
            kill -TERM "$killer" 2>/dev/null
            return "$rc"
          }
        fi
        sccache --start-server >/dev/null 2>&1 || true
        if ! _sccache_stats_bounded >/dev/null; then
          # SCCACHE_IDLE_TIMEOUT=0 keeps this daemon alive between jobs on
          # purpose, which is also what lets one wedge outlive the job that
          # created it: on 2026-09-07 a wedged server on allyson:4228 failed
          # every Rust job workspace-wide from 06:13 until a human killed it.
          # Restarting only a server that has already failed its probe does
          # not fight the long-lived design — a wedged daemon serves nobody.
          echo "sccache: server on port ${SCCACHE_SERVER_PORT:-4226} did not answer within 30s; restarting it once."
          _sccache_stop_bounded >/dev/null 2>&1 || true
          sccache --start-server >/dev/null 2>&1 || true
          _sccache_stats_bounded >/dev/null || {
            echo "sccache: still unresponsive after a restart — kill it on the runner host."
            exit 1
          }
          echo "sccache: recovered after restart."
        fi
      else
        # No sccache at all is survivable — an uncached build is slow, not stuck.
        echo "sccache: not installed, building without it"
        export RUSTC_WRAPPER=
      fi
    - |
      # sccache-compile-probe: stats can answer while compilation stalls (#198).
      if [ "${RUSTC_WRAPPER:-}" = sccache ] && command -v sccache >/dev/null 2>&1; then
        _sccache_probe_timeout=()
        if command -v timeout >/dev/null 2>&1; then
          _sccache_probe_timeout=(timeout --kill-after=5s 30s)
        elif command -v gtimeout >/dev/null 2>&1; then
          _sccache_probe_timeout=(gtimeout --kill-after=5s 30s)
        fi
        if [ "${#_sccache_probe_timeout[@]}" -eq 0 ]; then
          echo "WARNING: cannot bound the sccache compile probe; building without the cache."
          export RUSTC_WRAPPER=
        else
          _sccache_probe_dir=$(mktemp -d)
          printf 'pub fn probe() {}\n' > "$_sccache_probe_dir/probe.rs"
          # Unique crate names prevent a cache hit from hiding a stalled compiler.
          if "${_sccache_probe_timeout[@]}" sccache "$(rustup which rustc)" \
              --crate-name "vauchi_cache_probe_${CI_JOB_ID:-$$}" \
              --crate-type rlib --emit link "$_sccache_probe_dir/probe.rs" \
              -o "$_sccache_probe_dir/probe.rlib"; then
            echo "sccache: compile probe passed."
          else
            echo "WARNING: sccache compile probe failed; building without the cache. Required checks remain enabled."
            export RUSTC_WRAPPER=
          fi
          rm -rf "$_sccache_probe_dir"
        fi
      fi
    # Helper: fetch a file from the vauchi/scripts repo (project 77957857).
    # Single point of change for URL pattern and auth. Uses HTTP Basic Auth
    # (same mechanism as git clone in before_script above). All templates
    # should call this instead of inlining curl patterns.
    #   fetch_vauchi_script <repo-relative-path> <destination>
    # Example: fetch_vauchi_script scripts/ci/vet-autofix.sh /tmp/vet-autofix.sh
    - |
      fetch_vauchi_script() {
        local src_path="$1" dest="$2"
        local encoded_path
        encoded_path=$(printf '%s' "$src_path" | sed 's|/|%2F|g')
        curl -fsSL -u "gitlab-ci-token:${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/77957857/repository/files/${encoded_path}/raw?ref=${VAUCHI_SCRIPTS_REF}" \
          -o "$dest"
        chmod +x "$dest"
      }
  after_script:
    # Clean up build artifacts to save disk space (keep cache intact)
    - rm -rf target/debug/deps/*.d target/debug/incremental 2>/dev/null || true
    # sccache telemetry: cross-job compile reuse is load-bearing on shell
    # runners, and a dead daemon is invisible when stats errors are
    # swallowed (a stats-dead zombie served allyson for days unnoticed).
    # Warn loudly instead so every job log across every repo asserts the
    # cache layer's health.
    #
    # The `timeout` is load-bearing, not defensive dressing. This block
    # handled a daemon that *errors*, but a daemon that *hangs* makes
    # `sccache --show-stats` block forever: after_script then consumes the
    # whole job timeout and GitLab fails the job — after its actual work
    # succeeded. Observed 2026-08-02 on core's allow-direct:check, which
    # compiles nothing and still died at the 5m ceiling, cancelling 23
    # sibling jobs. Telemetry must never be able to fail a green job.
    - |
      if command -v sccache >/dev/null 2>&1; then
        _sccache_stats=$(timeout 30 sccache --show-stats 2>&1)
        _sccache_rc=$?
        # 124 is GNU coreutils' timeout code; BusyBox reports the SIGTERM
        # it sent as 143. Accept both so this reads the same on a Debian
        # shell runner and in an alpine image.
        if [ "$_sccache_rc" -eq 124 ] || [ "$_sccache_rc" -eq 143 ]; then
          echo "WARNING: sccache --show-stats hung past 30s — daemon wedged; cross-job compile caching is NOT working on this runner"
        elif [ "$_sccache_rc" -eq 0 ]; then
          printf '%s\n' "$_sccache_stats"
          _sccache_requests=$(printf '%s\n' "$_sccache_stats" | awk '/^Compile requests[[:space:]]/ {print $NF; exit}')
          if [ "${_sccache_requests:-0}" = "0" ]; then
            echo "NOTICE: sccache saw 0 compile requests — expected only for jobs that compile nothing"
          fi
        else
          printf '%s\n' "$_sccache_stats"
          echo "WARNING: sccache stats unavailable — daemon dead or protocol-broken; cross-job compile caching is NOT working on this runner"
        fi
      else
        echo "WARNING: sccache not installed — cross-job compile caching is NOT working on this runner"
      fi

# Linux self-hosted runner (allyson)
# Tags: linux, self-hosted
# Resources: 16 CPU, 20GB RAM, Debian 13 (reinstalled 2026-07-20, was Arch)
# Use for: Rust builds, Android NDK, Node.js
.linux-runner:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    # Ensure mold linker is available (required by .cargo/config.toml for faster linking)
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache:
    # One shared registry cache per project, not per job: the archived
    # content is a pure function of Cargo.lock, so the old per-job prefix
    # stored the same registry archive once per compiling job (13x in
    # core) and cold-downloaded all 13 copies. Concurrent uploads are
    # last-write-wins with identical content (benign); a torn extract
    # self-heals on the next pull. Same key across all self-hosted
    # runner templates below.
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_PROJECT_NAME}-registry
    fallback_keys:
      - rust-${CI_PROJECT_NAME}-registry-${CI_DEFAULT_BRANCH}
      - rust-${CI_PROJECT_NAME}-registry
    paths:
      # Note: target/ is NOT cached here — shell runners persist it on disk
      # via GIT_STRATEGY:none. sccache handles compiled artifact reuse.
      # Caching target/ via GitLab added 65-259s of I/O overhead per job.
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull-push

# Linux self-hosted runner with read-only cache
# Use for: lint/security jobs that consume but don't produce build artifacts
.linux-runner-readonly:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_PROJECT_NAME}-registry
    fallback_keys:
      - rust-${CI_PROJECT_NAME}-registry-${CI_DEFAULT_BRANCH}
      - rust-${CI_PROJECT_NAME}-registry
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull

# Linux self-hosted runner with no cache
# Use for: jobs that don't need target/ at all (e.g., cargo fmt)
.linux-runner-nocache:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache: {}

# Git credentials helper for cross-repo Cargo fetches
# Configures git to use CI_JOB_TOKEN for HTTPS clones of vauchi/* repos
#
# WHY a credential helper and not url.insteadOf: the insteadOf section
# name embedded the (unique, per-job) token, so `git config --global`
# could never overwrite a previous job's entry — every Rust job APPENDED
# a section to the runner's shared ~/.gitconfig. By 2026-07-02 that file
# held 10k stale-token sections (8.8 MB); every git spawn parsed it and
# rewrote URLs to expired tokens, slowing runner fetches into
# job_execution_timeouts across all repos. The helper below is one
# FIXED-key entry: nothing accumulates, and the token is read from the
# calling job's environment at fetch time, so concurrent jobs cannot
# clobber each other's credentials either.
.git-credentials:
  before_script:
    - |
      # Self-heal: strip the legacy per-job token sections this template
      # used to append (10k of them by 2026-07-02). Runs as the runner
      # user, so no manual box access is needed; temp-file + rename keeps
      # concurrent readers safe, and a lost-update race with a concurrent
      # `git config` write is benign — the next job re-heals, and nothing
      # appends token sections anymore.
      if grep -q '^\[url "https://gitlab-ci-token:' "$HOME/.gitconfig" 2>/dev/null; then
        awk '/^\[url "https:\/\/gitlab-ci-token:/{skip=1; next} /^\[/{skip=0} !skip{print}' \
          "$HOME/.gitconfig" > "$HOME/.gitconfig.heal.$$" \
          && mv "$HOME/.gitconfig.heal.$$" "$HOME/.gitconfig"
        echo "gitconfig self-heal: stripped legacy per-job token sections"
      fi
      # Retry git config to handle .gitconfig lock races on shared shell runners
      for _attempt in 1 2 3; do
        git config --global --replace-all credential.helper '!f() { echo "username=gitlab-ci-token"; echo "password=${CI_JOB_TOKEN}"; }; f' && break
        echo "WARN: git config --global failed (attempt $_attempt), retrying in 2s..."
        sleep 2
      done

