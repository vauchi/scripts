# Rust Base Template
# Shared configuration for Rust projects
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/rust-base.yml'
#
# Provides:
#   - .rust-cache: Cargo caching with Cargo.lock-based keys
#   - .self-hosted: Self-hosted runner with HTTPS git clone
#   - .linux-runner: Linux VM runner configuration (pull-push cache)
#   - .linux-runner-readonly: Linux VM runner (pull-only cache)
#   - .linux-runner-nocache: Linux VM runner (no cache)
#   - .rust-runner: Platform-agnostic Rust runner (pull-push cache, load-balanced)
#   - .rust-runner-readonly: Platform-agnostic Rust runner (pull-only cache)
#   - .rust-runner-nocache: Platform-agnostic Rust runner (no cache)
#   - .macos-runner: macOS VM runner configuration
#   - .docker-runner: Docker executor for containers
#   - Variables: CARGO_HOME, CARGO_INCREMENTAL

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"
  # Minimal clone depth — lint/test/build jobs don't need history.
  # Release/verify jobs override with deeper depth where needed.
  GIT_DEPTH: "1"
  # Keep sccache daemon alive between jobs (avoids restart overhead).
  # SCCACHE_DIR is set in each runner's shell profile (not here) because
  # the persistent daemon only reads env vars at startup, not per-job.
  SCCACHE_IDLE_TIMEOUT: "0"
  # Use faster zstd compression for CI artifacts/cache
  ARTIFACT_COMPRESSION_LEVEL: fastest
  FF_USE_FASTZIP: "true"
  # Note: CARGO_INCREMENTAL is set to 0 for self-hosted runners via .self-hosted
  # to reduce target/ directory size and improve cache efficiency

# ============================================================
# Default Job Configuration
# ============================================================
# These defaults apply to all jobs unless overridden

default:
  # Auto-cancel jobs when new commits are pushed (saves runner resources)
  interruptible: true
  # Retry on runner system failures (not script failures)
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================
# Workflow Rules
# ============================================================
# Controls which pipeline sources are accepted and auto-cancel behavior.
# Repos using this template should NOT define their own workflow rules
# unless they want to override this behavior.
#
# Accepted sources:
#   - push: Branch pushes (main, tags)
#   - merge_request_event: MR pipelines (primary validation path)
#   - pipeline: GitLab trigger: keyword (upstream verification triggers)
#   - trigger: Pipeline Trigger API (trigger-downstream.sh)
#   - api: Pipeline API (manual triggers via glab/curl)
#   - schedule: Scheduled pipelines (cleanup, periodic checks)
#   - web: Manual "Run pipeline" from GitLab UI

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Suppress push pipelines when an MR is already open (prevents ghost duplicates)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ============================================================
# Rust Cache Configuration
# ============================================================

# Optimized Rust cache using Cargo.lock for smart invalidation
# Fallback keys allow reuse of caches from other branches/jobs when exact key misses,
# avoiding cold builds on Cargo.lock changes (saves 15-25 min per cold build).
.rust-cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
    policy: pull-push

# Read-only cache (for lint jobs that don't produce new build artifacts)
.rust-cache-readonly:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/
    policy: pull

# Minimal cache (for quick jobs like format check)
.rust-cache-minimal:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-minimal
    fallback_keys:
      - rust-minimal-${CI_DEFAULT_BRANCH}
      - rust-minimal
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
    policy: pull

# ============================================================
# Tool Installation Helper
# ============================================================
# Uses cargo-binstall for pre-built binaries (5-10s vs 60-90s compile).
# Falls back to cargo install if binstall is unavailable or fails.

.ensure-binstall:
  before_script:
    - |
      # Install cargo-binstall if not present (one-time, ~5s)
      if ! command -v cargo-binstall >/dev/null 2>&1; then
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      fi

# ============================================================
# Self-Hosted Runner Templates
# ============================================================

# Base configuration for self-hosted runners
# - Uses HTTPS git clone with CI_JOB_TOKEN (no SSH keys needed)
# - Disables incremental compilation to reduce target/ size
.self-hosted:
  variables:
    GIT_STRATEGY: none
    # Disable incremental compilation — reduces target/ directory size significantly,
    # improving cache upload/download times on CI where builds are rarely incremental.
    CARGO_INCREMENTAL: "0"
    # sccache: shared compilation cache across jobs (30-50% faster recompilation).
    # SCCACHE_DIR and SCCACHE_CACHE_SIZE are set in each runner's shell profile,
    # not here — the persistent daemon (SCCACHE_IDLE_TIMEOUT=0) only reads env
    # vars at startup, so per-job CI variables are silently ignored.
    RUSTC_WRAPPER: "sccache"
  before_script:
    # Ensure user-installed cargo tools are in PATH (CARGO_HOME is overridden
    # to ${CI_PROJECT_DIR}/.cargo for caching, so ~/.cargo/bin isn't automatic)
    - export PATH="$HOME/.cargo/bin:${PATH}"
    # Re-export CARGO_HOME at runtime — YAML variable expansion of
    # ${CI_PROJECT_DIR} can resolve to empty in triggered pipelines,
    # causing cargo to write to /.cargo/ (read-only on macOS).
    - export CARGO_HOME="${CI_PROJECT_DIR:-.}/.cargo"
    - |
      # Clone/fetch via HTTPS using CI_JOB_TOKEN (no SSH keys needed)
      # GIT_STRATEGY: none preserves .git/ across runs. If the state is
      # corrupt (force push, stale shallow refs), nuke and start fresh.
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
        rm -f .git/shallow .git/shallow.lock 2>/dev/null || true
        # Detect corrupted git objects before attempting fetch.
        # Shell runners persist .git/ across jobs; a partial fetch or
        # force push can leave unreachable/broken objects that cause
        # "Could not read <sha>" errors on subsequent fetches.
        if ! git fsck --no-dangling --connectivity-only 2>/dev/null; then
          echo "Corrupted .git detected (fsck failed) — resetting for clean clone"
          rm -rf .git
        fi
      fi

      fetch_ref() {
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }

      if [ ! -d ".git" ]; then
        git init
        git remote add origin "$REPO_URL"
      fi

      # Try fetch; if it fails (force push, corrupt objects), start fresh
      if ! fetch_ref 2>/dev/null; then
        echo "Fetch failed — resetting .git for clean clone"
        rm -rf .git
        git init
        git remote add origin "$REPO_URL"
        fetch_ref
      fi

      # Remove stale untracked files left from previous checkouts.
      # GIT_STRATEGY:none + fetch/checkout doesn't clean deleted files,
      # so renamed modules (e.g. foo.rs → foo/mod.rs) leave the old file
      # on disk, breaking rustfmt ("file for module found at both").
      # Exclude build artifacts to preserve sccache/cargo incremental state.
      git clean -ffd -e target/ -e .cargo/ -e .cache/

      # Remove .cargo/config.toml if it contains [patch] path overrides.
      # Local-dev configs (e.g. ../core/vauchi-core) resolve to stale
      # sibling directories on shell runners — CI must use git deps.
      # Safe: downstream repos only put [patch] overrides in this file;
      # build/linker settings live in $HOME/.cargo/config.toml or core's config.
      if [ -f .cargo/config.toml ] && grep -q '\[patch\.' .cargo/config.toml 2>/dev/null; then
        echo "Removing .cargo/config.toml (contains local-dev [patch] overrides)"
        rm .cargo/config.toml
      fi
    # Ensure a Rust toolchain is configured (self-hosted runners may not have a default)
    - rustup show active-toolchain >/dev/null 2>&1 || rustup default stable
    # Clear extracted crate sources (shell runners persist registry across jobs;
    # interrupted extractions leave partial source dirs that fail to compile).
    # Cargo re-extracts from cached .crate tarballs — fast, no re-download.
    - rm -rf "$HOME/.cargo/registry/src" .cargo/registry/src 2>/dev/null || true
    # Ensure sccache is available and start the daemon
    - command -v sccache >/dev/null 2>&1 || cargo binstall sccache --no-confirm 2>/dev/null || true
    - sccache --start-server 2>/dev/null || true
  after_script:
    # Clean up build artifacts to save disk space (keep cache intact)
    - rm -rf target/debug/deps/*.d target/debug/incremental 2>/dev/null || true
    # Show sccache hit/miss stats for debugging cache effectiveness
    - sccache --show-stats 2>/dev/null || true

# Linux self-hosted runner (allyson)
# Tags: linux, self-hosted
# Resources: 16 CPU, 20GB RAM, Arch Linux
# Use for: Rust builds, Android NDK, Node.js
.linux-runner:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    # Ensure mold linker is available (required by .cargo/config.toml for faster linking)
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      # Note: target/ is NOT cached here — shell runners persist it on disk
      # via GIT_STRATEGY:none. sccache handles compiled artifact reuse.
      # Caching target/ via GitLab added 65-259s of I/O overhead per job.
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull-push

# Linux self-hosted runner with read-only cache
# Use for: lint/security jobs that consume but don't produce build artifacts
.linux-runner-readonly:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull

# Linux self-hosted runner with no cache
# Use for: jobs that don't need target/ at all (e.g., cargo fmt)
.linux-runner-nocache:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - command -v mold >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq mold)
  cache: {}

# Git credentials helper for cross-repo Cargo fetches
# Configures git to use CI_JOB_TOKEN for HTTPS clones of vauchi/* repos
.git-credentials:
  before_script:
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"

# Platform-agnostic Rust runner (load-balanced across allyson + nell)
# Tags: rust, self-hosted
# Use for: Rust builds, tests, mutation testing in downstream repos
.rust-runner:
  extends: .self-hosted
  tags:
    - rust
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull-push

# Platform-agnostic Rust runner with read-only cache
# Use for: lint/security jobs that consume but don't produce build artifacts
.rust-runner-readonly:
  extends: .self-hosted
  tags:
    - rust
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull

# Platform-agnostic Rust runner with no cache
# Use for: quick jobs that don't need target/ (e.g., cargo fmt)
.rust-runner-nocache:
  extends: .self-hosted
  tags:
    - rust
    - self-hosted
  variables:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  cache: {}

# macOS self-hosted runner (nell)
# Tags: macos, self-hosted
# Resources: 8 CPU, 16GB RAM, Apple Silicon
# Use for: iOS, Xcode, Swift builds
.macos-runner:
  extends: .self-hosted
  tags:
    - macos
    - self-hosted
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
    policy: pull-push

# Docker executor runner (for container-based jobs)
# Tags: docker
# Use for: SAST scanning, container builds, security scans
.docker-runner:
  tags:
    - docker

# ============================================================
# Rust Job Templates
# ============================================================

# Standard Rust job using GitLab shared runners
# Pin image version to match rust-toolchain.toml in each repo.
# Update both together when bumping the Rust version.
.rust-job:
  image: rust:1.93.1
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    fallback_keys:
      - rust-${CI_JOB_NAME}-${CI_DEFAULT_BRANCH}
      - rust-${CI_JOB_NAME}
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# Rust format check (cargo fmt)
.lint-format:
  stage: lint
  needs: []
  script:
    - cargo fmt --all -- --check

# Rust clippy linter (cargo clippy)
.lint-clippy:
  stage: lint
  needs: []
  script:
    - cargo clippy --all-targets -- -D warnings

# Clone locales repository (for TUI/desktop i18n)
.clone-locales:
  before_script:
    - |
      if [ ! -d ../locales ]; then
        (git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales || \
         (sleep 2 && git clone --depth=1 https://gitlab.com/vauchi/locales.git ../locales))
      else
        git -C ../locales pull --ff-only 2>/dev/null || true
      fi

# Clone themes repository (for desktop UI theming)
.clone-themes:
  before_script:
    - |
      if [ ! -d ../themes ]; then
        (git clone --depth=1 https://gitlab.com/vauchi/themes.git ../themes || \
         (sleep 2 && git clone --depth=1 https://gitlab.com/vauchi/themes.git ../themes))
      else
        git -C ../themes pull --ff-only 2>/dev/null || true
      fi

# ============================================================
# Cleanup Job Templates
# ============================================================
# Use these to clean up runner disk space after pipelines

# Cleanup job for self-hosted runners
# Cleans cargo target directory and old artifacts
.cleanup-runner:
  stage: .post
  extends: .linux-runner
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Cleaning up runner disk space..."
    # Clean stale cargo artifacts with cargo-sweep (smarter than find -mtime)
    - |
      if [ -d "target" ]; then
        echo "Target size before: $(du -sh target 2>/dev/null | cut -f1)"
        if command -v cargo-sweep >/dev/null 2>&1; then
          cargo sweep --time 7 . 2>&1 || true
        else
          # Fallback: remove debug builds older than 7 days
          find target/debug -type f -mtime +7 -delete 2>/dev/null || true
          find target -name "incremental" -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true
        fi
        echo "Target size after: $(du -sh target 2>/dev/null | cut -f1)"
      fi
    # Clean old cargo registry cache
    - |
      if [ -d ".cargo/registry/cache" ]; then
        echo "Cargo cache size: $(du -sh .cargo/registry/cache 2>/dev/null | cut -f1)"
        # Remove crate files older than 30 days
        find .cargo/registry/cache -type f -mtime +30 -delete 2>/dev/null || true
      fi
    # Show disk usage
    - df -h . || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  # Cleanup should not be interruptible
  interruptible: false

# Cleanup job for Docker runners
# Prunes unused Docker images and containers
.cleanup-docker:
  stage: .post
  image: docker:latest
  services:
    - docker:dind
  tags:
    - docker
  variables:
    GIT_STRATEGY: none
  script:
    - echo "Cleaning up Docker resources..."
    # Remove stopped containers older than 24 hours
    - docker container prune -f --filter "until=24h" || true
    # Remove dangling images
    - docker image prune -f || true
    # Remove unused images older than 7 days
    - docker image prune -a -f --filter "until=168h" || true
    # Remove unused volumes
    - docker volume prune -f || true
    # Show disk usage
    - docker system df || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual
      allow_failure: true
  interruptible: false

# ============================================================
# Timeout Templates
# ============================================================
# Use these to set appropriate timeouts for different job types.
# Also available as standalone include: /ci-templates/timeouts.yml
# (for non-Rust repos that don't include rust-base.yml).

# Quick jobs (lint, format check) - 10 minutes
# Keep in sync with ci-templates/timeouts.yml (canonical source for non-Rust repos)
.timeout-quick:
  timeout: 10 minutes

# Standard jobs (unit tests, build) - 30 minutes
.timeout-standard:
  timeout: 30 minutes

# Long jobs (full test suite, coverage, cross-compile) - 1 hour
.timeout-long:
  timeout: 1 hour

# Very long jobs (iOS build, Android multi-arch) - 2 hours
.timeout-extended:
  timeout: 2 hours
