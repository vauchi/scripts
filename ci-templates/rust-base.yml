# Rust Base Template
# Shared configuration for Rust projects
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/rust-base.yml'
#
# Provides:
#   - .rust-cache: Cargo caching with Cargo.lock-based keys
#   - .self-hosted: Self-hosted runner with SSH git clone and sccache
#   - .linux-runner: Linux VM runner configuration
#   - .macos-runner: macOS VM runner configuration
#   - .docker-runner: Docker executor for containers
#   - Variables: CARGO_HOME, RUSTC_WRAPPER, SCCACHE_DIR

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"
  # Note: RUSTC_WRAPPER is only set for self-hosted runners that have sccache installed
  # Shared GitLab runners don't have sccache, so we don't set it globally

# ============================================================
# Rust Cache Configuration
# ============================================================

# Optimized Rust cache using Cargo.lock for smart invalidation
.rust-cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .sccache/
      - target/
    policy: pull-push

# Read-only cache (for jobs that don't produce new artifacts)
.rust-cache-readonly:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .sccache/
      - target/
    policy: pull

# ============================================================
# Self-Hosted Runner Templates
# ============================================================

# Base configuration for self-hosted runners
# - Uses SSH git clone (avoids CI job token issues)
# - Initializes sccache for faster builds
.self-hosted:
  variables:
    GIT_STRATEGY: none
    # sccache is available on self-hosted runners
    RUSTC_WRAPPER: sccache
    SCCACHE_DIR: ${CI_PROJECT_DIR}/.sccache
  before_script:
    - |
      if [ ! -d ".git" ]; then
        git init
        git remote add origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
      else
        git remote set-url origin "git@gitlab.com:${CI_PROJECT_PATH}.git"
      fi
      # For MR pipelines, fetch the source branch (merge refs aren't fetchable via SSH)
      if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
        git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20
        git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      else
        git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20
        git checkout -f "${CI_COMMIT_SHA}"
      fi
    # Ensure sccache is available
    - command -v sccache >/dev/null || cargo install sccache --locked
    - sccache --start-server || true
  after_script:
    - sccache --show-stats || true

# Linux self-hosted runner (QEMU VM)
# Tags: linux, self-hosted
# Resources: 4 CPU, 8GB RAM, 150GB disk
# Use for: Rust builds, Android NDK, Node.js
.linux-runner:
  extends: .self-hosted
  tags:
    - linux
    - self-hosted
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .sccache/
      - target/
    policy: pull-push

# macOS self-hosted runner (QEMU VM)
# Tags: macos, self-hosted
# Resources: 8 CPU, 16GB RAM
# Use for: iOS, Xcode, Swift builds
.macos-runner:
  extends: .self-hosted
  tags:
    - macos
    - self-hosted
  cache:
    key:
      files:
        - Cargo.lock
      prefix: rust-${CI_JOB_NAME}
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .sccache/
      - target/
    policy: pull-push

# Docker executor runner (for container-based jobs)
# Tags: docker
# Use for: SAST scanning, container builds, security scans
.docker-runner:
  tags:
    - docker

# ============================================================
# Rust Job Templates
# ============================================================

# Standard Rust job using GitLab shared runners
.rust-job:
  image: rust:latest
  cache:
    key: ${CI_COMMIT_REF_SLUG}-rust
    paths:
      - .cargo/bin/
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# Rust lint job template
.rust-lint:
  extends: .linux-runner
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings

# Rust test job template
.rust-test:
  extends: .linux-runner
  stage: test
  before_script:
    - !reference [.self-hosted, before_script]
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked || true
  script:
    - cargo llvm-cov --workspace --lcov --output-path lcov.info
    - cargo llvm-cov report
  coverage: '/Total:\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lcov.info
    paths:
      - lcov.info
    expire_in: 1 week

# Rust build job template
.rust-build:
  extends: .linux-runner
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/*
    expire_in: 1 week
