# Timeout Templates
# Standard timeout definitions for CI jobs
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/timeouts.yml'
#
# Provides:
#   - .timeout-quick: 10 minutes (lint, format check)
#   - .timeout-standard: 30 minutes (unit tests, build)
#   - .timeout-long: 1 hour (coverage, full test suite, cross-compile)
#   - .timeout-extended: 90 minutes (iOS/macOS build, Android multi-arch)

# Quick jobs (lint, format check) - 10 minutes
.timeout-quick:
  timeout: 10 minutes

# Standard jobs (unit tests, build) - 30 minutes
.timeout-standard:
  timeout: 30 minutes

# Long jobs (full test suite, coverage, cross-compile) - 1 hour
.timeout-long:
  timeout: 1 hour

# Very long jobs (iOS build, Android multi-arch) - 90 minutes
# Raised from 60 to 90 minutes: cold-cache SPM builds (swift-syntax
# 602.0.0 from source) can take >60min. DerivedData caching (.derived-data/)
# makes warm builds ~30s, but first run after cache bust needs headroom.
# Still well below 2h to catch genuine hangs (post-mortem 2026-03-28).
.timeout-extended:
  timeout: 90 minutes
