# Timeout Templates
# Standard timeout definitions for CI jobs
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/timeouts.yml'
#
# Provides:
#   - .timeout-quick: 10 minutes (lint, format check)
#   - .timeout-standard: 30 minutes (unit tests, build)
#   - .timeout-long: 1 hour (coverage, full test suite, cross-compile)
#   - .timeout-extended: 2 hours (iOS build, Android multi-arch)

# Quick jobs (lint, format check) - 10 minutes
.timeout-quick:
  timeout: 10 minutes

# Standard jobs (unit tests, build) - 30 minutes
.timeout-standard:
  timeout: 30 minutes

# Long jobs (full test suite, coverage, cross-compile) - 1 hour
.timeout-long:
  timeout: 1 hour

# Very long jobs (iOS build, Android multi-arch) - 60 minutes
# Reduced from 2 hours to avoid masking runner hangs and resource_group
# deadlocks (see post-mortem 2026-03-28). Raised from 45 to 60 minutes:
# cold-cache SPM builds (swift-syntax from source) take 40-55 min on
# shared runners. Warm builds still complete in 15-20 min.
.timeout-extended:
  timeout: 60 minutes
