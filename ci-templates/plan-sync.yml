# Plan-Sync: Auto-update plans and problem records after merge
#
# Triggered post-merge to main with 5-minute debounce.
# Parses Plan-Task: trailers from merged commits, builds changeset,
# creates an MR with plan updates.
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/plan-sync.yml'
#
# Provides:
#   - .plan-sync: Post-merge plan synchronisation job
#
# Required CI variables:
#   PROJECT_ACCESS_TOKEN: GitLab token with api + write_repository scope

.plan-sync:
  stage: .post
  image: node:20-slim
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: delayed
  start_in: 5 minutes
  interruptible: true
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl python3 > /dev/null 2>&1
    - cd drift-detector && npm ci --silent && npm run build && cd ..
  script:
    - |
      set -euo pipefail

      # --- Read sync cursor ---
      SINCE=$(git rev-parse refs/plan-sync/last-processed 2>/dev/null || echo "")
      if [ -z "$SINCE" ]; then
        SINCE=$(git rev-list --max-count=50 HEAD | tail -1)
        echo "First sync run — scanning from $SINCE"
      else
        echo "Resuming sync from cursor $SINCE"
      fi

      # --- Run drift-detector sync ---
      cd drift-detector
      node dist/index.js sync --since "$SINCE" --output ../changeset.json --root ..
      cd ..

      # --- Check if changeset is empty ---
      UPDATES=$(python3 -c "
      import json, sys
      c = json.load(open('changeset.json'))
      total = len(c.get('planUpdates',[])) + len(c.get('statusTransitions',[])) + len(c.get('fileMoves',[]))
      print(total)
      " 2>/dev/null || echo "0")

      if [ "$UPDATES" = "0" ]; then
        echo "No plan updates needed"
        exit 0
      fi

      echo "Found $UPDATES update(s) — creating sync MR"

      # --- Configure git ---
      git config user.name "vauchi-gitlab-runner"
      git config user.email "noreply@vauchi.app"
      git remote set-url origin "https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"

      # --- Apply changeset ---
      cd drift-detector
      node dist/index.js sync --since "$SINCE" --apply --root ..
      cd ..

      # --- Build MR description from changeset ---
      MR_BODY=$(python3 << 'PYEOF'
      import json

      c = json.load(open("changeset.json"))
      lines = []

      explicit = [u for u in c.get("planUpdates", []) if u["source"] == "trailer"]
      inferred = [u for u in c.get("planUpdates", []) if u["source"] == "inferred"]

      if explicit:
          lines.append("## Explicit updates (from Plan-Task trailers)\n")
          for u in explicit:
              fname = u["file"].rsplit("/", 1)[-1]
              lines.append(f"- [x] {fname}#{u['taskNumber']}")
          lines.append("")

      if inferred:
          lines.append("## Inferred updates (drift-detector, please verify)\n")
          for u in inferred:
              fname = u["file"].rsplit("/", 1)[-1]
              lines.append(f"- [x] {fname}#{u['taskNumber']} (confidence: {u['confidence']})")
          lines.append("")

      transitions = c.get("statusTransitions", [])
      if transitions:
          lines.append("## Status transitions\n")
          for t in transitions:
              lines.append(f"- {t['problem']}: {t['from']} -> {t['to']}")
          lines.append("")

      reminders = c.get("reminders", [])
      if reminders:
          lines.append("## Reminders\n")
          for r in reminders:
              lines.append(f"- [ ] {r}")
          lines.append("")

      lines.append("---")
      lines.append("Auto-generated by plan-sync CI.")
      print("\n".join(lines))
      PYEOF
      )

      # --- Create branch and MR ---
      TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      BRANCH="chore/plan-sync-${TIMESTAMP}"

      # Check for existing open plan-sync MR
      EXISTING_BRANCH=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?state=opened&search=chore%3A+sync+plans" \
        | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['source_branch'] if mrs else '')" 2>/dev/null || true)

      if [ -n "$EXISTING_BRANCH" ]; then
        BRANCH="$EXISTING_BRANCH"
        echo "Updating existing MR branch: $BRANCH"
        git checkout -B "$BRANCH" origin/main
      else
        git checkout -b "$BRANCH"
      fi

      git add -A _private/docs/
      git diff --cached --quiet && { echo "No file changes to commit"; exit 0; }

      git commit -m "chore: sync plans and problem records

      Auto-generated by plan-sync CI.

      Co-Authored-By: vauchi-gitlab-runner <noreply@vauchi.app>"

      git push -u origin "$BRANCH" --force-with-lease

      if [ -z "$EXISTING_BRANCH" ]; then
        MR_RESP=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{
            \"source_branch\": \"${BRANCH}\",
            \"target_branch\": \"main\",
            \"title\": \"chore: sync plans and problem records\",
            \"description\": $(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" <<< "$MR_BODY"),
            \"remove_source_branch\": true
          }" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")

        MR_IID=$(echo "$MR_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('iid',''))" 2>/dev/null || true)
        if [ -n "$MR_IID" ]; then
          echo "Created plan-sync MR !${MR_IID}"
        fi
      else
        echo "Updated existing plan-sync MR on branch $BRANCH"
      fi

      # --- Update sync cursor ---
      git checkout "$CI_DEFAULT_BRANCH"
      git update-ref refs/plan-sync/last-processed "$CI_COMMIT_SHA"
      git push origin refs/plan-sync/last-processed 2>/dev/null || true
      echo "Sync cursor updated to $CI_COMMIT_SHA"
