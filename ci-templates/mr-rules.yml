# MR Workflow Rules Template
# Consistent pipeline rules across all repositories
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/mr-rules.yml'
#
# Provides:
#   - .validation-only: Run on MRs only (main validated via MR pipeline)
#   - .release-only: Run on version tags only
#   - .main-only: Run on main branch only
#   - .scheduled-only: Run on scheduled pipelines only
#   - .mr-or-main: Run on MRs and main branch
#   - .on-changes: Template for change-based rules

# ============================================================
# Pipeline Rules
# ============================================================

# MR validation only (main branch is validated via MR pipeline)
# Use this for lint, test, and security jobs
.validation-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Release pipeline (version tags only)
# Tags must be created on commits that are on main branch
.release-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

# Main branch only (post-merge jobs)
# Use for benchmark, e2e-full, downstream triggers
.main-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Scheduled pipelines only
# Use for weekly security scans, dependency updates
.scheduled-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# MR or main branch (both)
# Use when you need validation on both
.mr-or-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Manual trigger only
.manual-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ============================================================
# Change-Based Rules
# ============================================================

# Run on Cargo dependency changes
.on-cargo-changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"

# Run on source code changes
.on-src-changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*"
        - "Cargo.toml"
        - "Cargo.lock"

# Run on mobile binding changes
.on-mobile-changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/mobile/**/*"
        - "vauchi-mobile/**/*"

# ============================================================
# Combined Rules Templates
# ============================================================

# Validation with cargo change detection
.validation-cargo:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Full validation (MR) with optional main branch run
.validation-full:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
