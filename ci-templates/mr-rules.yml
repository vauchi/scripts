# MR Workflow Rules Template
# Consistent pipeline rules across all repositories
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/mr-rules.yml'
#
# Provides:
#   - .validation-only: Run on MRs only (main validated via MR pipeline)
#   - .release-only: Run on version tags only
#   - .release-or-rc: Run on stable + RC + dev tags (binding builds)
#   - .main-only: Run on main branch only
#   - .scheduled-only: Run on scheduled pipelines only
#   - .mr-or-main: Run on MRs and main branch
#   - .dev-tag-only: Run on dev tags only (lightweight pipeline)
#   - .rc-tag-only: Run on RC tags only (full quality gate)
#   - .prerelease-tag-only: Run on any pre-release tag
#   - .on-changes: Template for change-based rules

# ============================================================
# Pipeline Rules
# ============================================================

# MR validation only (main branch is validated via MR pipeline)
# Use this for lint, test, and security jobs
.validation-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Release pipeline (version tags only)
# Tags must be created on commits that are on main branch
.release-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Dev tag pipeline (lightweight — lint + test only)
# For fast iteration during development
.dev-tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

# Release candidate pipeline (full quality gate — no publish/deploy)
# For pre-release validation
.rc-tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/

# Any pre-release tag (dev OR rc) — for jobs that run on both tiers
.prerelease-tag-only:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-(dev|rc)\.\d+$/

# Release or dev tag — for verification jobs on any tagged commit
# Note: .release-or-rc now also includes dev tags (for binding builds)
.release-or-dev:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

# Any version tag — for binding builds (stable, RC, and dev)
# Dev tags build + publish bindings but do NOT trigger downstream app repos.
.release-or-rc:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/

# Main branch only (post-merge jobs)
# Use for benchmark, e2e-full, downstream triggers
.main-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Scheduled pipelines only
# Use for weekly security scans, dependency updates
.scheduled-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# MR or main branch (both)
# Use when you need validation on both
.mr-or-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Manual trigger only
.manual-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ============================================================
# Change-Based Rules for MRs
# ============================================================
# These rules optimize CI by only running jobs when relevant files change.
# All rules include .gitlab-ci.yml changes to catch CI config issues.

# Run on Rust source code changes (for lint:clippy, lint:format, test)
.validation-rust:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"
          - "rust-toolchain.toml"

# Run on dependency changes only (for security:audit)
.validation-deps:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - ".gitlab-ci.yml"

# Run on any file change (for lint:reuse)
# REUSE verifies ALL files have proper SPDX headers, so it must run
# when any file is added or modified to catch missing headers.
# This template exists for semantic clarity - it's equivalent to .validation-full
.validation-reuse:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Run on license policy changes (for security:licenses / cargo-deny)
.validation-licenses:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "deny.toml"
          - ".gitlab-ci.yml"

# Run on mobile binding changes
.validation-mobile:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
          - "vauchi-mobile/**/*"
          - "scripts/build-bindings.sh"
          - ".gitlab-ci.yml"

# Run on script changes
.validation-scripts:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "scripts/**/*"
          - ".gitlab-ci.yml"

# ============================================================
# Combined Rules Templates
# ============================================================

# Full validation (always run on MR) - use when change detection is impractical
.validation-full:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Validation with cargo change detection
.validation-cargo:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "**/Cargo.toml"
          - "**/Cargo.lock"
    - if: $CI_PIPELINE_SOURCE == "schedule"
