# Mutation Testing Template
# Shared configuration for cargo-mutants CI jobs
#
# Dependencies: cargo-mutants, cargo-nextest (for parallel test execution)
#
# Usage:
#   include:
#     - project: 'vauchi/scripts'
#       ref: main
#       file: '/ci-templates/mutation.yml'
#
# Provides:
#   - .mutation-nightly: Full mutation testing (scheduled pipeline, advisory, pushes metrics)
#
# Variables (set by consumer jobs):
#   MUTATION_PACKAGE:              -p flag value (omit for whole crate)
#   MUTATION_EXTRA_FLAGS:          additional cargo-mutants flags (e.g. --no-default-features)
#   MUTATION_TIMEOUT_NIGHTLY:      per-mutant timeout in seconds for nightly (default: 30)
#   MUTATION_WORKDIR:              subdirectory to cd into before running (default: ".", e.g. "src-tauri")
#   MUTATION_TEST_TOOL:            test runner for cargo-mutants (default: "nextest", alt: "cargo")
#
# Consumer jobs must also extend a runner template (.linux-runner, .rust-runner, etc.)
# and .timeout-extended for the job timeout.
#
# Example:
#   mutation:nightly:
#     extends: [.mutation-nightly, .linux-runner, .timeout-extended]
#     variables:
#       MUTATION_PACKAGE: "vauchi-core"

# Nightly full mutation testing (scheduled pipeline)
.mutation-nightly:
  stage: mutation
  needs: []
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    MUTATION_PACKAGE: ""
    MUTATION_EXTRA_FLAGS: ""
    MUTATION_TIMEOUT_NIGHTLY: "30"
    MUTATION_WORKDIR: "."
    MUTATION_TEST_TOOL: "nextest"
  script:
    - command -v cargo-mutants >/dev/null 2>&1 || cargo binstall cargo-mutants --no-confirm 2>/dev/null || true
    - command -v cargo-nextest >/dev/null 2>&1 || cargo binstall cargo-nextest --no-confirm 2>/dev/null || true
    - |
      for script in mutation-progress.sh push-mutation.sh; do
        fetch_vauchi_script "scripts/ci/${script}" "${script}"
      done
    - |
      PROGRESS_SCRIPT="$(pwd)/mutation-progress.sh"
      PUSH_SCRIPT="$(pwd)/push-mutation.sh"
      cd "${MUTATION_WORKDIR}"
      MUTANTS_OUT="target/mutants"
      mkdir -p "$MUTANTS_OUT"
      PACKAGE_FLAG="${MUTATION_PACKAGE:+-p ${MUTATION_PACKAGE}}"
      cargo mutants --test-tool "${MUTATION_TEST_TOOL}" ${PACKAGE_FLAG} ${MUTATION_EXTRA_FLAGS} --timeout "${MUTATION_TIMEOUT_NIGHTLY}" --output "$MUTANTS_OUT" &
      MUTANTS_PID=$!
      trap 'kill $MUTANTS_PID 2>/dev/null; wait $MUTANTS_PID 2>/dev/null' EXIT
      "$PROGRESS_SCRIPT" "$MUTANTS_PID" "$MUTANTS_OUT"
      MUTATION_EXIT=$?
      # Push metrics to Grafana regardless of pass/fail, then exit with mutation status
      "$PUSH_SCRIPT" "$MUTANTS_OUT" "${CI_PROJECT_NAME}" || true

      # Generate JUnit XML from cargo-mutants text output for GitLab test tab.
      # Uses plain text files (missed.txt, caught.txt, unviable.txt) instead of
      # jq+outcomes.json since jq may not be installed on all runners.
      MUTANTS_DIR="$MUTANTS_OUT/mutants.out"
      JUNIT="$MUTANTS_OUT/mutation-junit.xml"
      MISSED=$(wc -l < "$MUTANTS_DIR/missed.txt" 2>/dev/null | tr -d ' ' || echo 0)
      CAUGHT=$(wc -l < "$MUTANTS_DIR/caught.txt" 2>/dev/null | tr -d ' ' || echo 0)
      UNVIABLE=$(wc -l < "$MUTANTS_DIR/unviable.txt" 2>/dev/null | tr -d ' ' || echo 0)
      TOTAL=$((MISSED + CAUGHT + UNVIABLE))
      cat > "$JUNIT" <<JUNIT_HEAD
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuites name="mutation:nightly" tests="$TOTAL" failures="$MISSED">
        <testsuite name="cargo-mutants" tests="$TOTAL" failures="$MISSED">
      JUNIT_HEAD
      for f in "$MUTANTS_DIR/caught.txt" "$MUTANTS_DIR/unviable.txt"; do
        while IFS= read -r line; do
          safe=$(echo "$line" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
          echo "    <testcase name=\"${safe}\" classname=\"mutants\"/>" >> "$JUNIT"
        done < "$f" 2>/dev/null || true
      done
      while IFS= read -r line; do
        safe=$(echo "$line" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g')
        echo "    <testcase name=\"${safe}\" classname=\"mutants\"><failure message=\"Mutant survived\"/></testcase>" >> "$JUNIT"
      done < "$MUTANTS_DIR/missed.txt" 2>/dev/null || true
      echo "  </testsuite>" >> "$JUNIT"
      echo "</testsuites>" >> "$JUNIT"

      exit $MUTATION_EXIT
  artifacts:
    when: always
    paths:
      - ${MUTATION_WORKDIR}/target/mutants/
    reports:
      junit: ${MUTATION_WORKDIR}/target/mutants/mutation-junit.xml
    expire_in: 1 week
