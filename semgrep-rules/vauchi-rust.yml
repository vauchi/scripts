# Custom Semgrep rules for vauchi Rust projects
# Enforces project-specific security and quality patterns.
#
# Test locally:
#   semgrep --config scripts/semgrep-rules/vauchi-rust.yml core/

rules:
  # ============================================================
  # Crypto policy enforcement
  # ============================================================

  - id: vauchi-no-ring-direct
    patterns:
      - pattern: use ring::$MOD
    message: >
      Direct use of `ring` is prohibited. Use `aws-lc-rs` instead
      (FIPS 140-3 compliance). See CLAUDE.md crypto rules.
      Allowed exceptions: ring is only acceptable as a transitive
      dependency via rustls or snow.
    severity: ERROR
    languages: [rust]
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-ring-dependency
    patterns:
      - pattern: ring = ...
    message: >
      Direct dependency on `ring` crate is prohibited. Use `aws-lc-rs`
      instead (FIPS 140-3 compliance). ring is only acceptable as a
      transitive dependency.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/Cargo.toml"

  # ============================================================
  # Test quality enforcement (CC rules)
  # ============================================================

  - id: vauchi-cc03-assert-is-ok
    patterns:
      - pattern: assert!($X.is_ok())
    message: >
      CC-03: Don't assert is_ok() without checking the value.
      Use `let val = result.unwrap();` then assert on val,
      or use `assert_eq!(result, Ok(expected))`.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: HIGH

  - id: vauchi-cc03-assert-is-err
    patterns:
      - pattern: assert!($X.is_err())
    message: >
      CC-03: Don't assert is_err() without checking the error.
      Use `let err = result.unwrap_err();` then assert on err,
      or match the specific error variant.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: MEDIUM

  - id: vauchi-cc03-assert-is-some
    patterns:
      - pattern: assert!($X.is_some())
    message: >
      CC-03: Don't assert is_some() without checking the value.
      Use `let val = option.unwrap();` then assert on val.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: MEDIUM

  - id: vauchi-cc06-no-sleep-in-tests
    patterns:
      - pattern: std::thread::sleep(...)
    message: >
      CC-06: Never use sleep() in tests. Use mockable time,
      event synchronization, or condition variables instead.
      sleep() causes flaky tests and slows CI.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/tests/**"
        - "**/*_test.rs"
    metadata:
      category: correctness
      confidence: HIGH

  - id: vauchi-cc06-no-tokio-sleep-in-tests
    patterns:
      - pattern: tokio::time::sleep(...)
    message: >
      CC-06: Never use tokio::time::sleep() in tests. Use
      tokio::time::pause() with advance() for deterministic
      time control, or use event synchronization.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/tests/**"
        - "**/*_test.rs"
    metadata:
      category: correctness
      confidence: HIGH

  # ============================================================
  # Security patterns
  # ============================================================

  - id: vauchi-no-println-in-lib
    patterns:
      - pattern: println!(...)
    message: >
      Do not use println!() in library code. Use proper logging
      (tracing/log crate) or return values. println!() bypasses
      structured logging and may leak information.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/src/**"
      exclude:
        - "**/src/main.rs"
        - "**/src/bin/**"
        - "**/examples/**"
    metadata:
      category: security
      confidence: MEDIUM

  - id: vauchi-no-dbg-macro
    patterns:
      - pattern: dbg!(...)
    message: >
      Remove dbg!() macro before committing. It writes to stderr
      and may expose sensitive data in production builds.
    severity: ERROR
    languages: [rust]
    paths:
      exclude:
        - "**/tests/**"
    metadata:
      category: security
      confidence: HIGH

  # Note: unwrap() linting is handled by Clippy (clippy::unwrap_used)
  # which has better context awareness than Semgrep for Rust.
  # A Semgrep rule produces too many false positives (~645 in core alone).
