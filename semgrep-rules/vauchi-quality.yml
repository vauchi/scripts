# Vauchi quality rules — NOT included in SAST
# These rules enforce CC coding standards but are not security issues.
# Run locally: semgrep --config scripts/semgrep-rules/vauchi-quality.yml core/
#
# These are intentionally NOT in sast-ruleset.toml because they would
# pollute the GitLab Security Dashboard with ~300 non-security findings.
# Enforcement: human review + pre-commit hooks.

rules:
  # ============================================================
  # CC-03: Specific assertions
  #
  # These fire on ANY bare assert!(x.is_ok()/is_err()/is_some()),
  # including cases where a specific check (unwrap_err().contains(...),
  # assert_eq!(x.unwrap(), ...)) follows on the next line — there, the
  # bare assert is merely redundant, not a real gap. The rule cannot
  # auto-distinguish the two: doing so needs statement-sequence matching
  # with a metavariable back-reference (assert!($X.is_err()); ...;
  # $X.unwrap_err()), which the opengrep/semgrep OSS engine does not
  # support for Rust (verified empirically 2026-07-04 — the positive
  # sequence pattern matched nothing). So treat a hit as: add a specific
  # check OR delete the redundant assert. Do not try to encode the
  # suppression in the pattern; it will not work with this engine.
  # ============================================================

  - id: vauchi-cc03-assert-is-ok
    patterns:
      - pattern: assert!($X.is_ok())
    message: >
      CC-03: Don't assert is_ok() without checking the value.
      Use `let val = result.unwrap();` then assert on val,
      or use `assert_eq!(result, Ok(expected))`.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: HIGH

  - id: vauchi-cc03-assert-is-err
    patterns:
      - pattern: assert!($X.is_err())
    message: >
      CC-03: Don't assert is_err() without checking the error.
      Use `let err = result.unwrap_err();` then assert on err,
      or match the specific error variant.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: MEDIUM

  - id: vauchi-cc03-assert-is-some
    patterns:
      - pattern: assert!($X.is_some())
    message: >
      CC-03: Don't assert is_some() without checking the value.
      Use `let val = option.unwrap();` then assert on val.
    severity: WARNING
    languages: [rust]
    metadata:
      category: correctness
      confidence: MEDIUM

  # ============================================================
  # CC-06: No real-time waits in tests
  # ============================================================

  - id: vauchi-cc06-no-sleep-in-tests
    patterns:
      - pattern: std::thread::sleep(...)
    message: >
      CC-06: Never use sleep() in tests. Use mockable time,
      event synchronization, or condition variables instead.
      sleep() causes flaky tests and slows CI.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/tests/**"
        - "**/*_test.rs"
    metadata:
      category: correctness
      confidence: HIGH

  - id: vauchi-cc06-no-tokio-sleep-in-tests
    patterns:
      - pattern: tokio::time::sleep(...)
    message: >
      CC-06: Never use tokio::time::sleep() in tests. Use
      tokio::time::pause() with advance() for deterministic
      time control, or use event synchronization.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/tests/**"
        - "**/*_test.rs"
    metadata:
      category: correctness
      confidence: HIGH
