# Vauchi SAST rules — security-only
# These rules go into the GitLab Security Dashboard via sast-ruleset.toml.
# Only rules that represent actual security concerns belong here.
#
# For code quality rules (CC-03, CC-06), see vauchi-quality.yml
# which is run locally, not in SAST.

rules:
  # ============================================================
  # Crypto policy enforcement
  # ============================================================

  - id: vauchi-no-ring-direct
    patterns:
      - pattern: use ring::$MOD
    message: >
      Direct use of `ring` is prohibited. Use `aws-lc-rs` instead
      (FIPS 140-3 compliance). See CLAUDE.md crypto rules.
      Allowed exceptions: ring is only acceptable as a transitive
      dependency via rustls or snow.
    severity: ERROR
    languages: [rust]
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-ring-dependency
    patterns:
      - pattern: ring = ...
    message: >
      Direct dependency on `ring` crate is prohibited. Use `aws-lc-rs`
      instead (FIPS 140-3 compliance). ring is only acceptable as a
      transitive dependency.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/Cargo.toml"

  - id: vauchi-no-snow-in-core
    patterns:
      - pattern: use snow::$MOD
    message: >
      `snow` (Noise NK) is prohibited in vauchi-core / vauchi-app.
      Per ADR-002 it was removed from vauchi-core and now lives only in
      the relay for relay-to-relay federation. Client transport is
      HTTP v2 + `ohttp` (ADR-037). If you need a handshake in core,
      it is the wrong layer.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - "**/vauchi-core/**"
        - "**/vauchi-app/**"
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-manual-zeroize-on-drop
    pattern-regex: '(?m)^\s*impl\s+(?:zeroize::)?ZeroizeOnDrop\s+for\b'
    message: >
      A manual `ZeroizeOnDrop` marker implementation generates no drop
      behavior. Derive `ZeroizeOnDrop` or implement `Drop` explicitly so
      secret material is actually cleared. See VRS01.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/vauchi-core/**"
    metadata:
      category: security
      confidence: HIGH

  # ============================================================
  # Information leak prevention
  #
  # NOTE: The println/eprintln rules target library crates only.
  # Binary-only crates (no lib.rs) legitimately use println!/eprintln!
  # for user-facing output. Those repos should disable the rule in
  # their .gitlab/sast-ruleset.toml:
  #
  #   [[semgrep.ruleset]]
  #     disable = true
  #     [semgrep.ruleset.identifier]
  #       type = "semgrep_id"
  #       value = "vauchi-no-println-in-lib"
  #
  # Currently disabled in: cli (println), linux-gtk (eprintln)
  # ============================================================

  - id: vauchi-no-println-in-lib
    patterns:
      - pattern: println!(...)
    message: >
      Do not use println!() in library code. Use proper logging
      (tracing/log crate) or return values. println!() bypasses
      structured logging and may leak information.
      Binary-only crates should disable this rule via sast-ruleset.toml.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/src/**"
      exclude:
        - "**/src/main.rs"
        - "**/src/bin/**"
        - "**/examples/**"
        # flame.rs is #[cfg(feature = "flame")] dev-only profiling that
        # never compiles into a production build; its eprintln/println
        # report where the trace file was written. Same non-production
        # category as main.rs/bin/examples above.
        - "**/flame.rs"
    metadata:
      category: security
      confidence: MEDIUM

  - id: vauchi-no-dbg-macro
    patterns:
      - pattern: dbg!(...)
    message: >
      Remove dbg!() macro before committing. It writes to stderr
      and may expose sensitive data in production builds.
    severity: ERROR
    languages: [rust]
    paths:
      exclude:
        - "**/tests/**"
    metadata:
      category: security
      confidence: HIGH

  # ============================================================
  # Unsafe code enforcement
  #
  # The community rule `rust.lang.security.unsafe-usage.unsafe-usage`
  # fires on ALL unsafe code including vauchi-cabi (C ABI crate where
  # unsafe is inherent). We replace it with a targeted rule that only
  # flags unsafe in vauchi-core, where zero-unsafe is a design invariant.
  # core repo disables the community rule via sast-ruleset.toml.
  # ============================================================

  - id: vauchi-no-unsafe-in-core
    patterns:
      - pattern: unsafe { ... }
    message: >
      vauchi-core must contain zero unsafe code. All unsafe FFI
      belongs in vauchi-cabi or vauchi-platform. If you need unsafe
      here, discuss in an ADR first.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - "**/vauchi-core/src/**"
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-eprintln-in-lib
    patterns:
      - pattern: eprintln!(...)
    message: >
      Do not use eprintln!() in library code. stderr output may
      leak diagnostic information in production.
    severity: WARNING
    languages: [rust]
    paths:
      include:
        - "**/src/**"
      exclude:
        - "**/src/main.rs"
        - "**/src/bin/**"
        - "**/examples/**"
        # flame.rs is #[cfg(feature = "flame")] dev-only profiling that
        # never compiles into a production build; its eprintln/println
        # report where the trace file was written. Same non-production
        # category as main.rs/bin/examples above.
        - "**/flame.rs"
    metadata:
      category: security
      confidence: MEDIUM

  # ============================================================
  # Randomness policy
  # ============================================================

  - id: vauchi-no-thread-rng
    patterns:
      - pattern: rand::thread_rng()
    message: >
      Do not use rand::thread_rng() for security-sensitive code.
      Use rand::rngs::OsRng instead. Tests and deterministic simulations
      may disable this rule locally.
    severity: ERROR
    languages: [rust]
    paths:
      exclude:
        - "**/tests/**"
        - "**/*_test.rs"
        - "**/ benches/**"
    metadata:
      category: security
      confidence: HIGH

  # ============================================================
  # Test isolation / temp file policy
  # ============================================================

  - id: vauchi-no-env-temp-dir
    patterns:
      - pattern: std::env::temp_dir().join(...)
    message: >
      Do not build paths under std::env::temp_dir() manually.
      Use tempfile::tempdir() or tempfile::NamedTempFile for race-free,
      isolated temporary directories.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - "**/tests/**"
        - "**/src/**"
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-fixed-tmp-path
    pattern-regex: '"/tmp/[^"]*"'
    message: >
      Do not hardcode /tmp/ paths. They are predictable, shared, and
      race-prone. Use tempfile::tempdir() or tempfile::NamedTempFile.
    severity: ERROR
    languages: [rust]
    paths:
      include:
        - "**/src/**"
    metadata:
      category: security
      confidence: HIGH

  # ============================================================
  # Shell / CI supply-chain policy
  # ============================================================

  - id: vauchi-no-curl-pipe-shell
    pattern-regex: 'curl\s+[^|]*\|\s*(?:bash|sh|zsh)\b'
    message: >
      Do not pipe curl output directly into a shell. Download, verify
      checksums/signatures, and inspect the script before execution.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/*.sh"
        - "**/*.md"
    metadata:
      category: security
      confidence: HIGH

  - id: vauchi-no-unverified-script-fetch
    pattern-regex: 'curl\s+[^\n]*\.sh[^\n]*\n\s*chmod\s+\+x[^\n]*\n\s*\.?/.*\.sh'
    message: >
      Fetching a script with curl, chmod +x, and running it without
      integrity verification is a supply-chain risk. Use the
      verified-fetch CI template or verify a SHA-256 / signature first.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "**/.gitlab-ci.yml"
        - "**/*.yml"
    metadata:
      category: security
      confidence: HIGH
