# GitLab CI for vauchi-scripts
#
# Development tools and CI templates - lint-only pipeline
#
# Uses shared templates (self-reference via local include).

# Include shared templates (local reference for this repo)
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: '/ci-templates/lint-docs.yml'
  - local: '/ci-templates/mr-rules.yml'
  - local: '/ci-templates/reuse.yml'
  - local: '/ci-templates/badges.yml'

variables:
  SECRET_DETECTION_EXCLUDED_PATHS: "archive/"

stages:
  - lint
  - security
  - metrics
  - deploy

# Lint shell scripts with shellcheck
lint:shellcheck:
  extends: .mr-or-main
  stage: lint
  tags:
    - self-hosted
    - shellcheck
  resource_group: nell-lint
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
      else
        git init
        git remote add origin "$REPO_URL"
      fi
      fetch_and_checkout() {
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }
      if ! fetch_and_checkout 2>/dev/null; then
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        fetch_and_checkout
      fi
      git clean -ffd
  script:
    - |
      echo "Linting shell scripts..."
      ERRORS=0

      for file in $(find scripts -name "*.sh" -type f); do
        echo "Checking: $file"
        if ! shellcheck "$file"; then
          ERRORS=$((ERRORS + 1))
        fi
      done

      if [ $ERRORS -gt 0 ]; then
        echo ""
        echo "Found shellcheck errors in $ERRORS file(s)."
        exit 1
      fi

      echo "All shell scripts pass shellcheck."

# Validate CI templates (YAML syntax)
# yamllint -d relaxed is advisory by design — purely cosmetic style
# warnings on shared CI templates. The script body uses `|| true` per
# file so a single bad file doesn't terminate the loop, and the job
# itself is allow_failure: true so style nits stay out of the merge
# gate. Audited 2026-04-22 T2.5 — both safeguards retained because
# CI-template style is intentionally low-stakes.
lint:ci-templates:
  extends: .mr-or-main
  stage: lint
  tags:
    - self-hosted
    - yamllint
  resource_group: nell-lint
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
      else
        git init
        git remote add origin "$REPO_URL"
      fi
      fetch_and_checkout() {
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }
      if ! fetch_and_checkout 2>/dev/null; then
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        fetch_and_checkout
      fi
      git clean -ffd
  script:
    - |
      echo "Validating CI template YAML..."

      for file in ci-templates/*.yml; do
        echo "Checking: $file"
        yamllint -d relaxed "$file" || true
      done

      echo "CI template validation complete."
  allow_failure: true

# ============================================================
# Security Stage
# ============================================================

secret_detection:
  stage: security
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Push engineering metrics to Prometheus pushgateway (daily schedule).
# allow_failure: true because pushgateway availability is best-effort
# observability — a missed daily push is recoverable on the next run
# and must never gate scheduled work. Audited 2026-04-22 T2.5.
metrics:daily:
  stage: metrics
  tags:
    - self-hosted
    - shellcheck
    - linux
  resource_group: metrics-daily
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  before_script:
    - mkdir -p ~/.ssh
    - base64 -d "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - |
      cat >> ~/.ssh/config <<'SSHEOF'
      Host bold-hopper-vps
        HostName 87.106.25.46
        User vauchi
        StrictHostKeyChecking accept-new
      SSHEOF
    - chmod 600 ~/.ssh/config
  script:
    - scripts/ci/metrics-push.sh --ci
  allow_failure: true

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
