# GitLab CI for vauchi-scripts
#
# Development tools and CI templates - lint-only pipeline
#
# Uses shared templates (self-reference via local include).

# Include shared templates (local reference for this repo)
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: '/ci-templates/lint-docs.yml'
  - local: '/ci-templates/mr-rules.yml'
  - local: '/ci-templates/reuse.yml'
  - local: '/ci-templates/badges.yml'
  - local: '/ci-templates/shipped-in.yml'
  - local: '/ci-templates/spec-trailer.yml'

variables:
  SECRET_DETECTION_EXCLUDED_PATHS: "archive/"
  # The shared templates fetch runtime scripts from vauchi/scripts via the
  # GitLab API using this ref. Consumers (including this repo) must define it
  # because the templates no longer hard-code ?ref=main (see commit 0192383).
  VAUCHI_SCRIPTS_REF: "main"

stages:
  - lint
  - security
  - metrics
  - deploy

test:shipped-in-alpine:
  extends: .mr-or-main
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - apk add --no-cache bash git > /dev/null
    - bash scripts/tests/commit-msg-shipped-in-trailer.test.sh
    - bash scripts/tests/check-shipped-in.test.sh

# lint:spec-trailer runs check-spec-trailer.sh in alpine:3.21 in the
# repositories that include it; its tests run there too (BusyBox grep and
# sed), not only under GNU in test:selftests.
test:spec-trailer-alpine:
  extends: .mr-or-main
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - apk add --no-cache bash git > /dev/null
    - bash scripts/tests/commit-msg-spec-trailer.test.sh
    - bash scripts/tests/check-spec-trailer.test.sh

test:architecture:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/rust:1.93.1
  tags: [docker]
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --manifest-path tools/architecture-check/Cargo.toml --check
    - cargo clippy --locked --manifest-path tools/architecture-check/Cargo.toml -j 8 --all-targets -- -D warnings
    - cargo test --locked --manifest-path tools/architecture-check/Cargo.toml -j 8
    - bash tools/architecture-check/tests/gate.test.sh
    - cargo build --locked --manifest-path tools/architecture-check/Cargo.toml --target-dir tools/architecture-check/target --bin vauchi-quality-complexity
    - python3 tools/architecture-check/tests/quality-scan-integration.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Detector and Python contract tests under scripts/tests/.
# This is the "lint green in CI" gate the prose-deletion MR depends
# on: a deleted rules-file section must map to a lint whose self-test
# ran green here. Runs on the markdownlint-tagged shell runner so the
# markdownlint fixture suite exercises for real; suites for tools the
# runner lacks self-skip and say so in the log.
test:selftests: # vci02-ok: .mr-or-main is rules-only, no before_script to preserve
  extends: .mr-or-main
  stage: lint
  # Deterministic GNU/Linux environment — the detectors' real CI
  # habitat. (First run landed on the macOS markdownlint runner and
  # surfaced that check-no-domain-imports-in-views silently no-ops on
  # BSD grep — real pre-existing bug, tracked as its own problem
  # record, not something this job should inherit per-run.)
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:20
  tags: [docker]
  timeout: 20m
  before_script:
    # ripgrep: the mobile view-guard detectors hard-require it (they
    # fail loud when it's missing — the silent-degradation variant is
    # what broke the first two runs of this job). jq: session-error
    # ledger parsing in gen-hook-from-pattern's auto-pick.
    # python3-yaml: check-ci-needs-rules.py (VCI06) parses resolved CI configs.
    - apt-get update -qq >/dev/null && apt-get install -y -qq ripgrep jq python3 python3-yaml >/dev/null
    - npm install -g markdownlint-cli@0.41.0 >/dev/null 2>&1 || echo "markdownlint install failed — its suite self-skips"
  script:
    - |
      # CC-27 ratchet: every check-*.sh has a seeded-violation test or a
      # baseline line that may only be removed.
      bash scripts/check-seeded-violation-tests.sh
      FAILED=0
      for t in scripts/tests/*.test.sh; do
        echo "═══ $t ═══"
        rc=0; bash "$t" || rc=$?
        # 77 = automake SKIP convention (e.g. check-binding-abi needs
        # a built Android .so this runner doesn't have)
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then
          FAILED=$((FAILED + 1))
        fi
      done
      for t in scripts/tests/*.test.py; do
        echo "═══ $t ═══"
        if ! python3 "$t"; then
          FAILED=$((FAILED + 1))
        fi
      done
      if [ "$FAILED" -gt 0 ]; then
        echo ""
        echo "FAILED: $FAILED self-test suite(s) red."
        exit 1
      fi
      BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -n "$BASE_SHA" ] \
          && git diff --name-only "$BASE_SHA"...HEAD \
              | grep -q '^scripts/humble_check.baseline.json$'; then
        git show "$BASE_SHA:scripts/humble_check.baseline.json" \
          > /tmp/humble-previous.json
        python3 scripts/humble_check.py \
          --validate-baseline scripts/humble_check.baseline.json \
          --against /tmp/humble-previous.json \
          --config scripts/humble_check_rules.json
      fi

# Lint shell scripts with shellcheck
lint:shellcheck: # vci02-ok: .mr-or-main is rules-only, no before_script to preserve
  extends: .mr-or-main
  stage: lint
  tags:
    - self-hosted
    - shellcheck
  resource_group: nell-lint
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
      else
        git init
        git remote add origin "$REPO_URL"
      fi
      fetch_and_checkout() {
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20 || return 1
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20 || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }
      if ! fetch_and_checkout 2>/dev/null; then
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        if ! fetch_and_checkout; then
          echo "ERROR: source checkout failed after clean-clone recovery" >&2
          exit 1
        fi
      fi
      git show -s --format='Checked out %H' HEAD
      git clean -ffd
  script:
    - |
      echo "Linting shell scripts..."
      ERRORS=0

      # -S warning pins the same severity the pre-commit hook uses
      # (scripts/hooks/pre-commit). Default severity also fails on
      # info-level findings (SC2317 unreachable-code false positives
      # alone caused 22 pipeline failures 2026-03..07) that the local
      # hook never surfaced — the divergence made "works locally,
      # fails in CI" the norm for this job.
      for file in $(find scripts -name "*.sh" -type f); do
        echo "Checking: $file"
        if ! shellcheck -S warning "$file"; then
          ERRORS=$((ERRORS + 1))
        fi
      done

      if [ $ERRORS -gt 0 ]; then
        echo ""
        echo "Found shellcheck errors in $ERRORS file(s)."
        exit 1
      fi

      echo "All shell scripts pass shellcheck."

# Validate CI templates (YAML syntax is blocking; style is advisory)
# Syntax errors in shared CI templates break every consumer, so they must
# fail the pipeline. Style warnings from yamllint -d relaxed remain advisory.
lint:ci-templates: # vci02-ok: .mr-or-main is rules-only, no before_script to preserve
  extends: .mr-or-main
  stage: lint
  tags:
    - self-hosted
    - yamllint
  resource_group: nell-lint
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      REPO_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      if [ -d ".git" ]; then
        git remote set-url origin "$REPO_URL" 2>/dev/null || true
      else
        git init
        git remote add origin "$REPO_URL"
      fi
      fetch_and_checkout() {
        if [ -n "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}" ]; then
          git fetch origin "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" --depth 20 || return 1
          git checkout -f "origin/${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        else
          git fetch origin "${CI_COMMIT_REF_NAME}" --depth 20 || return 1
          git checkout -f "${CI_COMMIT_SHA}"
        fi
      }
      if ! fetch_and_checkout 2>/dev/null; then
        rm -rf .git
        git init
        git remote set-url origin "$REPO_URL" 2>/dev/null \
          || git remote add origin "$REPO_URL"
        if ! fetch_and_checkout; then
          echo "ERROR: source checkout failed after clean-clone recovery" >&2
          exit 1
        fi
      fi
      git show -s --format='Checked out %H' HEAD
      git clean -ffd
  script:
    - |
      echo "Validating CI template YAML syntax..."
      FAILED=0
      for file in ci-templates/*.yml; do
        echo "Checking syntax: $file"
        if ! python3 -c "import yaml; yaml.SafeLoader.add_constructor('!reference', lambda loader,node: loader.construct_sequence(node)); yaml.safe_load(open('$file'))"; then
          echo "ERROR: YAML syntax error in $file" >&2
          FAILED=1
        fi
      done
      if [ "$FAILED" -ne 0 ]; then
        exit 1
      fi

      echo "Running style lint (advisory)..."
      for file in ci-templates/*.yml; do
        yamllint -d relaxed "$file" || true
      done

      echo "CI template validation complete."
  allow_failure: false

# ============================================================
# Security Stage
# ============================================================

secret_detection:
  stage: security
  tags: [docker]
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One click releases the templates: the next dated ci-templates tag at this
# main commit (private#1068). Manual, because a templates tag decides what
# every repo's CI runs once its pin moves; the click is that decision.
# PROJECT_ACCESS_TOKEN must be allowed to create protected tags here.
tag:ci-templates:
  stage: deploy
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  interruptible: false
  resource_group: ci-templates-tag
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"
      when: manual
  allow_failure: true
  before_script:
    - |
      # The Alpine CDN fails intermittently; retry, and fail loudly rather
      # than tagging without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache bash curl python3 && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
  script:
    - bash scripts/ci/create-ci-templates-tag.sh

# Cancel stuck jobs in ios-spm-v* / macos-spm-v* resource groups.
# Detects jobs held by the GitLab "cancelled job doesn't release
# resource_group" bug (observed 2026-04-11, -19 x2, -21) and cancels
# anything running longer than STUCK_THRESHOLD_SECS (2h default).
# The resource_group version bump (v5 → v6) still requires a human
# review — this job only handles the cancel half of the workaround.
# See scripts/ci/resource-group-reset.sh + runner-runbook.md.
# Added as Phase 3 T3.4 of 2026-04-22-ci-pipeline-health-audit.
resource-group:reset:
  stage: metrics
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_RESOURCE_GROUP_RESET == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    # Dry-run unless RG_RESET_EXECUTE=true. The nightly schedule does not
    # set it yet (job 16748033836 on 2026-09-25 ran dry): runner-runbook
    # step 5 adds it once the dry-run output has been reviewed.
    RG_RESET_EXECUTE: ""
  before_script:
    - |
      # The Alpine CDN fails intermittently and a bare `apk add` turns
      # that into a red job for a check that never ran. Retry, and fail
      # loudly rather than continuing without the tools.
      for attempt in 1 2 3; do
          apk add --no-cache bash curl python3 && installed=yes && break
          echo "apk add failed (attempt $attempt/3), retrying in 5s" >&2
          sleep 5
      done
      if [ "${installed:-}" != yes ]; then
          echo "apk add failed after 3 attempts" >&2
          exit 1
      fi
  script:
    - chmod +x scripts/ci/resource-group-reset.sh
    - |
      if [ "$RG_RESET_EXECUTE" = "true" ]; then
        scripts/ci/resource-group-reset.sh --execute
      else
        scripts/ci/resource-group-reset.sh
      fi
  allow_failure: true  # advisory: never block other scheduled work

# Collect CI runner queue metrics and push to Prometheus.
# Runs every few minutes from a schedule. Self-hosted runner so the
# pushgateway SSH key and GitLab API token stay off SaaS runners.
metrics:queue:
  stage: metrics
  tags:
    - self-hosted
    - shellcheck
    - linux
  resource_group: metrics-queue
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - scripts/ci/queue-metrics.sh --ci
  allow_failure: true

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
